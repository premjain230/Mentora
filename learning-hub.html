<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var v=localStorage.getItem('learning-allied-theme')||localStorage.getItem('aquila-theme');document.documentElement.className=v==='dark'?'':'light-mode'}catch(e){document.documentElement.className=''}})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, follow" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' blob: https://www.gstatic.com https://apis.google.com https://accounts.google.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.googletagmanager.com https://esm.sh https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' blob: https://www.googleapis.com https://apis.google.com https://accounts.google.com https://esm.sh https://www.gstatic.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://analytics.vercel.com https://learningallied.world https://www.learningallied.world https://cloudflareinsights.com; frame-src 'self' https://www.gstatic.com https://accounts.google.com https://mentora-c6dca.firebaseapp.com; object-src 'none';">
<meta name="description" content="Learning Allied AI Learning Hub — pick your board, read short lessons, test yourself and get a final explanation built around the questions you got wrong." />
<meta name="keywords" content="Learning Allied, learning hub, AI learning hub, JEE preparation, NEET preparation, Board exams, chapter-wise lessons, practice quizzes" />
<meta name="author" content="Prem Jain" />
<meta name="publisher" content="Learning Allied" />
<meta name="language" content="English" />
<meta name="geo.country" content="IN" />
<link rel="canonical" href="https://www.learningallied.world/learning-hub" />
<title>AI Learning Hub — Learning Allied | Board Syllabus, Chapter by Chapter</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230ea5e9'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='18' font-weight='bold'>A</text></svg>">
<meta name="referrer" content="no-referrer-when-downgrade">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/tokens.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/sidebar.css" />
<link rel="stylesheet" href="/css/texture.css" />
<script type="module" src="/js/texture.js"></script>
<link rel="stylesheet" href="/css/shell.css" />
<link rel="stylesheet" href="/css/learning-hub.css" />
<style>
/* Hide the app until auth resolves; arena.html uses the same gate. */
body.auth-loading .main,
body.auth-loading .sidebar,
body.auth-loading .sidebar-overlay { visibility: hidden; opacity: 0; }
</style>
</head>
<body class="auth-loading">

<div id="authSplash" class="ld-splash" role="status" aria-label="Loading Learning Allied">
  <div class="ld">
    <img src="/learningallied-white.svg" alt="" width="60" height="60" decoding="async" fetchpriority="high" />
    <div class="ld-bar"></div>
  </div>
</div>

<div id="sidebarMount"></div>

<script type="module">
import { mountSidebar } from "./js/components/sidebar.js";
import { initSyllabusUpload } from "./js/syllabus.js";
import { auth, db } from "./firebase-config.js";
await mountSidebar("learning-hub.html");
initSyllabusUpload({ auth, db });
</script>

<main class="main">
  <div class="topbar lh-topbar">
    <div class="topbar-left">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-mobile-logo">
        <img src="/learningallied-white.svg" alt="Learning Allied" class="logo-img">
        <span class="logo-text">Learning Allied</span>
      </div>
      <div class="lh-title">Learning Hub</div>
    </div>
    <div class="topbar-right">
      <div class="topbar-avatar"><img id="topbarAvatar" src="" data-pending-avatar="1" alt="User" /></div>
    </div>
  </div>

  <div class="content lh-content">
    <div class="lh-wrap" id="lhWrap">

      <!-- Selection: one decision per screen (board, class, subject, chapter) -->
      <section id="lhPick" class="lh-pick" aria-live="polite">
        <nav id="lhPickCrumbs" class="lh-pick-crumbs" aria-label="Your selection" hidden></nav>
        <header class="lh-pick-head">
          <p class="lh-eyebrow lh-eyebrow--plain" id="lhPickEyebrow"></p>
          <h1 class="lh-hero-title" id="lhPickTitle"></h1>
          <p class="lh-hero-sub" id="lhPickSub"></p>
        </header>
        <div id="lhPickBody"></div>
        <button class="lh-btn lh-btn--plain lh-pick-back" id="lhPickBack" type="button">&larr; Back</button>
      </section>

      <!-- Lesson (read, questions, review) -->
      <div id="lhApp" class="lh-app" data-stage="reading" hidden>

        <section class="lh-stage" aria-label="Lesson">

          <!-- lesson header: breadcrumb, steps, progress -->
          <div class="lh-progress" id="lhProgress" hidden>
            <button class="lh-crumb-back" id="lhBackToExplorer" type="button">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
              <span>Chapters</span>
            </button>
            <div class="lh-progress-head">
              <div class="lh-progress-titles">
                <span id="lhProgressCrumb" class="lh-crumb"></span>
                <span id="lhProgressTitle" class="lh-progress-title"></span>
              </div>
              <span id="lhProgressPill" class="lh-pill"></span>
            </div>
            <ol class="lh-steps" id="lhSteps" aria-label="Lesson steps">
              <li data-step="0">Read</li>
              <li data-step="1">Questions</li>
              <li data-step="2">Review</li>
            </ol>
            <div class="lh-bar"><div class="lh-bar-fill" id="lhBarFill" style="width:0%"></div></div>
          </div>

          <!-- Reading -->
          <article id="lhReader" class="lh-card" hidden>
            <div id="lhPlanLoading" class="lh-loading" aria-live="polite">
              <div class="lh-skel" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
              <p id="lhPlanLoadingMsg">Preparing this chapter…</p>
            </div>

            <div id="lhPlanError" class="lh-alert" role="alert" hidden>
              <p id="lhPlanErrorMsg"></p>
              <button class="lh-btn lh-btn--ghost" id="lhPlanRetry" type="button">Try again</button>
            </div>

            <div id="lhPageWrap" hidden>
              <div id="lhIntro">
                <p class="lh-eyebrow lh-eyebrow--plain" id="lhIntroEyebrow"></p>
                <h1 class="lh-hero-title lh-hero-title--sm" id="lhIntroTitle"></h1>
                <p class="lh-meta" id="lhIntroMeta"></p>
                <div class="lh-learn" id="lhLearn">
                  <p class="lh-label">In this chapter</p>
                  <ol class="lh-learn-list" id="lhLearnList"></ol>
                </div>
              </div>

              <div id="lhPage">
                <div class="lh-page-head">
                  <h2 class="lh-h2 lh-page-title" id="lhPageTitle"></h2>
                  <span id="lhPageCount" class="lh-page-count"></span>
                </div>
                <ol id="lhPageLines" class="lh-lines"></ol>
                <div id="lhPageExtra"></div>
              </div>

              <div class="lh-nav">
                <button class="lh-btn lh-btn--ghost" id="lhPrev" type="button">Back</button>
                <div class="lh-dots" id="lhDots"></div>
                <button class="lh-btn lh-btn--primary" id="lhNext" type="button">Next</button>
              </div>
            </div>
          </article>

          <!-- Quiz -->
          <article id="lhQuiz" class="lh-card" hidden>
            <p class="lh-eyebrow lh-eyebrow--plain" id="lhQuizEyebrow">Practice</p>
            <h1 class="lh-hero-title lh-hero-title--sm">Check what you understood</h1>
            <p class="lh-meta" id="lhQuizMeta"></p>

            <div class="lh-quiz">
              <div class="lh-quiz-top">
                <span id="lhQuizOf" class="lh-label"></span>
                <span id="lhQuizScoreLive" class="lh-quiz-live"></span>
              </div>
              <div class="lh-qdots" id="lhQuizDots"></div>
              <p id="lhQuizQ" class="lh-quiz-q"></p>
              <div id="lhQuizOptions" class="lh-quiz-options" role="radiogroup" aria-label="Answer options"></div>
              <div class="lh-nav">
                <button class="lh-btn lh-btn--ghost" id="lhQuizPrev" type="button">Back</button>
                <button class="lh-btn lh-btn--primary" id="lhQuizNext" type="button">Next question</button>
              </div>
            </div>

            <div id="lhQuizError" class="lh-alert" role="alert" hidden>
              <p id="lhQuizErrorMsg"></p>
              <button class="lh-btn lh-btn--ghost" id="lhQuizRetry" type="button">Try again</button>
            </div>
          </article>

          <!-- Review + final explanation -->
          <article id="lhReview" class="lh-card" hidden>
            <p class="lh-eyebrow lh-eyebrow--plain" id="lhReviewEyebrow">Marked</p>
            <h1 class="lh-hero-title lh-hero-title--sm" id="lhReviewTitle">Your review</h1>

            <div id="lhReviewLoading" class="lh-loading" aria-live="polite">
              <div class="lh-skel" aria-hidden="true"><i></i><i></i><i></i></div>
              <p>Marking your answers and writing your explanation…</p>
            </div>

            <div id="lhReviewError" class="lh-alert" role="alert" hidden>
              <p id="lhReviewErrorMsg"></p>
              <button class="lh-btn lh-btn--ghost" id="lhReviewRetry" type="button">Try again</button>
            </div>

            <div id="lhScoreCard" class="lh-score" hidden>
              <span class="lh-score-icon" id="lhScoreIcon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
              </span>
              <span class="lh-score-text">
                <b id="lhScoreValue">0 / 0</b>
                <span id="lhScoreLabel" class="lh-muted"></span>
              </span>
              <span id="lhStatusBadge" class="lh-pill"></span>
            </div>

            <div id="lhReviewBody" class="lh-prose" hidden></div>

            <div id="lhReviewDone" class="lh-done" hidden>
              <p id="lhReviewDoneMsg"></p>
              <div class="lh-done-actions">
                <button class="lh-btn lh-btn--primary" id="lhNextChapter" type="button">Next chapter</button>
                <button class="lh-btn lh-btn--ghost" id="lhRedoQuiz" type="button">Retake the questions</button>
                <button class="lh-btn lh-btn--plain" id="lhBackToBrowse" type="button">All chapters</button>
              </div>
            </div>
          </article>

        </section>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* Toast helper — identical to study-session.html so the app stays consistent. */
window.__learningAlliedToast = window.__aquilaToast = function (msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  clearTimeout(window._tt);
  window._tt = setTimeout(function(){ t.className = 'toast'; }, 3200);
};
</script>
<script type="module" src="./learning-hub.js"></script>
<script type="module" src="./js/avatar-sync.js"></script>
<script type="module">
import { initAnalytics } from "./js/vercel-analytics.js";
initAnalytics();
</script>
</body>
</html>
