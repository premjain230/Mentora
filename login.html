<style>
:root {
  --bg: #070810;
  --surface: #0f1117;
  --card: #13151f;
  --card2: #1a1d27;
  --border: rgba(255,255,255,0.07);
  --border-focus: rgba(0,212,255,0.5);
  --text: #f0f0f8;
  --sub: #6b6f8a;
  --muted: #3a3d52;
  --accent: #00d4ff;
  --violet: #a78bfa;
  --error: #ff6b6b;
  --success: #34d399;
  --font: 'Sora', sans-serif;
  --mono: 'Space Mono', monospace;
}
.light-mode {
  --bg: #f4f5f9;
  --surface: #ecedf2;
  --card: #ffffff;
  --card2: #f0f1f5;
  --border: rgba(0,0,0,0.08);
  --text: #16162a;
  --sub: #5a5d72;
  --muted: #9ea0b4;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.35s ease, color 0.35s ease;
  overflow-x: hidden;
  position: relative;
  -webkit-font-smoothing: antialiased;
}

/* ── Background layers ── */
.bg-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 700px 500px at 20% 0%, rgba(0,212,255,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 600px 500px at 85% 100%, rgba(167,139,250,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 400px 400px at 50% 50%, rgba(0,212,255,0.03) 0%, transparent 70%);
}

.grid-bg {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(0,212,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.025) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 10%, transparent 100%);
  -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 10%, transparent 100%);
}

/* ── Constellation canvas ── */
#constellation {
  position: fixed; inset: 0; pointer-events: none; z-index: 1;
  opacity: 0.45;
}

/* ── Particles ── */
.particles { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
.particle {
  position: absolute; border-radius: 50%;
  animation: pfloat var(--dur) ease-in-out infinite var(--delay);
  will-change: transform, opacity;
}
@keyframes pfloat {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  15% { opacity: var(--op); }
  85% { opacity: var(--op); }
  100% { transform: translateY(-120px) translateX(var(--drift)); opacity: 0; }
}

/* ── Page wrapper ── */
.page {
  position: relative; z-index: 10;
  width: 100%; min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 20px;
}

/* ── Logo ── */
.logo {
  display: flex; align-items: center; gap: 11px;
  margin-bottom: 32px;
  animation: fadeDown 0.7s cubic-bezier(0.16,1,0.3,1) both;
  text-decoration: none;
}
.logo-mark {
  width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
}
.logo-mark svg { width: 100%; height: 100%; }
.logo-img { height: 38px; width: auto; }
.logo-name {
  font-size: 19px; font-weight: 700; letter-spacing: -0.03em;
  color: var(--text);
}
.logo-name span { color: var(--accent); }

/* ── Card ── */
.card {
  width: 100%; max-width: 440px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 36px 36px 32px;
  position: relative;
  animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) 0.08s both;
  transition: box-shadow 0.4s, border-color 0.4s;
}
.card:hover {
  box-shadow: 0 20px 64px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,212,255,0.1);
  border-color: rgba(0,212,255,0.14);
}
.card::before {
  content: '';
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 60%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,0.4), transparent);
}

@keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }

/* ── Card header ── */
.card-hdr { margin-bottom: 28px; }
.card-hdr h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 5px; }
.card-hdr p { font-size: 13px; color: var(--sub); }

/* ── Floating label fields ── */
.field {
  position: relative;
  margin-bottom: 18px;
}
.field input {
  width: 100%;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  padding: 20px 16px 8px;
  outline: none;
  transition: border-color 0.22s, box-shadow 0.22s, background 0.22s;
  caret-color: var(--accent);
}
.field input:focus {
  border-color: var(--border-focus);
  background: #161824;
  box-shadow: 0 0 0 4px rgba(0,212,255,0.08);
}
.field input.has-error {
  border-color: rgba(255,107,107,0.6);
  box-shadow: 0 0 0 4px rgba(255,107,107,0.07);
}
.field input.valid {
  border-color: rgba(52,211,153,0.5);
}
.field label {
  position: absolute;
  left: 16px; top: 14px;
  font-size: 13px; font-weight: 500;
  color: var(--sub);
  pointer-events: none;
  transition: top 0.2s cubic-bezier(0.16,1,0.3,1), font-size 0.2s, color 0.2s;
  transform-origin: left;
}
.field input:focus ~ label,
.field input:not(:placeholder-shown) ~ label {
  top: 7px;
  font-size: 10px;
  font-family: var(--mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}
.field input.has-error ~ label { color: var(--error); }
.field input.valid ~ label { color: var(--success); }

/* field icon (eye toggle) */
.field-action {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  color: var(--muted); padding: 4px;
  transition: color 0.2s;
  display: flex; align-items: center;
}
.field-action:hover { color: var(--sub); }
.field-action svg { width: 16px; height: 16px; }

/* field error message */
.field-msg {
  font-size: 11px; font-family: var(--mono);
  margin-top: 5px; padding-left: 4px;
  height: 0; overflow: hidden;
  transition: height 0.2s, opacity 0.2s;
  opacity: 0;
  color: var(--error);
}
.field-msg.show { height: 16px; opacity: 1; }
.field-msg.ok { color: var(--success); }

/* ── Options row ── */
.opt-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 22px;
}
.remember {
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; font-size: 13px; color: var(--sub);
  user-select: none;
}
.remember input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
.forgot {
  font-size: 13px; color: var(--accent); text-decoration: none;
  font-weight: 500; transition: color 0.2s, opacity 0.2s;
  opacity: 0.8;
}
.forgot:hover { opacity: 1; color: #33ddff; }

/* ── Primary button ── */
.btn-primary {
  width: 100%; padding: 15px;
  border-radius: 12px; border: none;
  background: linear-gradient(135deg, #00b4d8, #00d4ff 50%, #48e3ff);
  color: #040d12;
  font-family: var(--font);
  font-size: 14px; font-weight: 700;
  cursor: pointer;
  position: relative; overflow: hidden;
  transition: transform 0.18s, box-shadow 0.18s;
  letter-spacing: 0.02em;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 36px rgba(0,212,255,0.38);
}
.btn-primary:active { transform: translateY(0) scale(0.99); }
.btn-primary .btn-shine {
  position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
  transform: skewX(-18deg);
  animation: shine 4s ease-in-out infinite 1.5s;
}
@keyframes shine { 0%, 100% { left: -100%; } 45%, 55% { left: 140%; } }

/* ── Button loading state ── */
.btn-primary.loading { pointer-events: none; }
.btn-primary.loading .btn-text { opacity: 0; }
.btn-primary.loading .btn-spinner { display: flex; }
.btn-spinner {
  display: none; position: absolute;
  align-items: center; gap: 5px;
}
.spin-dot {
  width: 6px; height: 6px; border-radius: 50%; background: #040d12;
  animation: spinDot 0.9s ease-in-out infinite;
}
.spin-dot:nth-child(2) { animation-delay: 0.15s; }
.spin-dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes spinDot { 0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }

/* ── Success state ── */
.btn-primary.success {
  background: linear-gradient(135deg, #059669, #34d399);
  box-shadow: 0 12px 36px rgba(52,211,153,0.35);
}
.success-check { display: none; }
.btn-primary.success .success-check { display: block; }
.btn-primary.success .btn-text { display: none; }

/* ── Divider ── */
.or-row {
  display: flex; align-items: center; gap: 12px;
  margin: 18px 0;
}
.or-line { flex: 1; height: 1px; background: var(--border); }
.or-text { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.1em; }

/* ── Google button ── */
.btn-google {
  width: 100%; padding: 13px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.025);
  color: var(--sub);
  font-family: var(--font);
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: border-color 0.2s, color 0.2s, background 0.2s, transform 0.18s;
}
.btn-google:hover {
  border-color: rgba(0,212,255,0.25);
  color: var(--text);
  background: rgba(0,212,255,0.04);
  transform: translateY(-1px);
}
.btn-google:active { transform: translateY(0); }
.btn-google svg { width: 17px; height: 17px; flex-shrink: 0; }

/* ── Footer link ── */
.card-foot {
  text-align: center; margin-top: 22px;
  font-size: 13px; color: var(--sub);
  animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) 0.2s both;
}
.card-foot a {
  color: var(--accent); text-decoration: none;
  font-weight: 600; transition: color 0.2s;
}
.card-foot a:hover { color: #33ddff; }

/* ── Features strip below card ── */
.features {
  display: flex; gap: 20px; margin-top: 28px;
  animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) 0.28s both;
  flex-wrap: wrap; justify-content: center;
}
.feat-chip {
  display: flex; align-items: center; gap: 7px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 13px;
  font-size: 11.5px; color: var(--sub);
  transition: border-color 0.2s, color 0.2s;
}
.feat-chip:hover { border-color: rgba(0,212,255,0.2); color: var(--text); }
.feat-chip svg { width: 13px; height: 13px; color: var(--accent); flex-shrink: 0; }

/* ── Reduced motion ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ── Mobile ── */
@media (max-width: 480px) {
  .card { padding: 28px 22px 24px; border-radius: 18px; }
  .features { gap: 10px; }
}
</style>
</head>

<script>
/* ── Constellation canvas ── */
(function () {
  const canvas = document.getElementById('constellation');
  const ctx = canvas.getContext('2d');
  let W, H, nodes, raf;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function initNodes() {
    const count = Math.min(40, Math.floor(W * H / 28000));
    nodes = Array.from({ length: count }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      r: Math.random() * 1.8 + 0.8,
      pulse: Math.random() * Math.PI * 2,
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    nodes.forEach(n => {
      n.x += n.vx; n.y += n.vy;
      if (n.x < 0 || n.x > W) n.vx *= -1;
      if (n.y < 0 || n.y > H) n.vy *= -1;
      n.pulse += 0.018;
    });

    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 160) {
          const alpha = (1 - dist / 160) * 0.18;
          const gradient = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
          gradient.addColorStop(0, `rgba(0,212,255,${alpha})`);
          gradient.addColorStop(1, `rgba(167,139,250,${alpha})`);
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = gradient;
          ctx.lineWidth = 0.7;
          ctx.stroke();
        }
      }
    }

    nodes.forEach(n => {
      const pulse = 0.7 + 0.3 * Math.sin(n.pulse);
      const isCyan = n.pulse % (Math.PI * 2) < Math.PI;
      const color = isCyan ? `rgba(0,212,255,${0.55 * pulse})` : `rgba(167,139,250,${0.55 * pulse})`;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r * pulse, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      const grd = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * 4 * pulse);
      grd.addColorStop(0, isCyan ? `rgba(0,212,255,${0.12 * pulse})` : `rgba(167,139,250,${0.12 * pulse})`);
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r * 4 * pulse, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();
    });

    raf = requestAnimationFrame(draw);
  }

  resize();
  initNodes();
  draw();
  window.addEventListener('resize', () => { resize(); initNodes(); });
})();

/* ── Particles ── */
(function () {
  const pc = document.getElementById('pts');
  const colors = ['#00d4ff', '#a78bfa', '#48e3ff'];
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const s = Math.random() * 2 + 1;
    p.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;bottom:${Math.random()*15}%;background:${colors[i%3]};--op:${0.25+Math.random()*0.35};--dur:${6+Math.random()*8}s;--delay:-${Math.random()*8}s;--drift:${(Math.random()-.5)*60}px`;
    pc.appendChild(p);
  }
})();

/* ── Eye toggle ── */
document.getElementById('eyeBtn').addEventListener('click', function () {
  const inp = document.getElementById('pwdF');
  const isPass = inp.type === 'password';
  inp.type = isPass ? 'text' : 'password';
  document.getElementById('eyeShow').style.display = isPass ? 'none' : '';
  document.getElementById('eyeHide').style.display = isPass ? '' : 'none';
});

/* ── Validation helpers (cosmetic, inline field hints) ── */
function setFieldState(fieldId, state, msg) {
  const field = document.getElementById(fieldId);
  const input = field.querySelector('input');
  const msgEl = field.querySelector('.field-msg');
  input.className = '';
  if (state === 'error') { input.classList.add('has-error'); msgEl.textContent = msg; msgEl.className = 'field-msg show'; }
  else if (state === 'ok') { input.classList.add('valid'); msgEl.textContent = msg || ''; msgEl.className = 'field-msg' + (msg ? ' show ok' : ''); }
  else { msgEl.className = 'field-msg'; }
}

function clearFieldError(fieldId) {
  const field = document.getElementById(fieldId);
  field.querySelector('input').classList.remove('has-error');
  field.querySelector('.field-msg').className = 'field-msg';
}

function validateEmail() {
  const val = document.getElementById('emailIn').value;
  if (!val) return setFieldState('f-email', 'none');
  const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
  setFieldState('f-email', ok ? 'ok' : 'error', ok ? '' : 'Enter a valid email');
}

/* ── Sign In handler — wraps auth.js's signIn() ── */
async function handleSignIn() {
  const email = document.getElementById('emailIn').value.trim();
  const pwd = document.getElementById('pwdF').value;
  let valid = true;

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    setFieldState('f-email', 'error', 'Enter a valid email'); valid = false;
  }
  if (!pwd) { setFieldState('f-pwd', 'error', 'Enter your password'); valid = false; }
  if (!valid) return;

  const btn = document.getElementById('signInBtn');
  btn.classList.add('loading');

  try {
    const { signIn } = await import('./auth.js');
    await signIn(btn);
    btn.classList.remove('loading');
    btn.classList.add('success');
  } catch (e) {
    btn.classList.remove('loading');
    // auth.js already shows the specific Firebase error via #authMsg;
    // this just flags the password field too.
    setFieldState('f-pwd', 'error', 'Sign-in failed — see message above');
  }
}

async function handleGoogle(btnEl) {
  try {
    const { googleSignIn } = await import('./auth.js');
    googleSignIn(btnEl);
  } catch (e) {
    console.error('Google sign-in failed to load:', e);
  }
}

/* ── Forgot password — wraps auth.js's forgotPassword() ── */
document.getElementById('forgotLink').addEventListener('click', async (e) => {
  e.preventDefault();

  const email = document.getElementById('emailIn').value.trim();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    setFieldState('f-email', 'error', 'Enter your email above first');
    document.getElementById('emailIn').focus();
    return;
  }

  const link = e.currentTarget;
  const original = link.textContent;
  link.textContent = 'Sending…';
  link.style.pointerEvents = 'none';

  try {
    const { forgotPassword } = await import('./auth.js');
    await forgotPassword();
  } catch (err) {
    console.error('forgotPassword failed:', err);
  } finally {
    link.textContent = original;
    link.style.pointerEvents = '';
  }
});
</script>
