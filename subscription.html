<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-base: #0a0b0f;
    --bg-sidebar: #0f1117;
    --bg-card: #1a1d27;
    --bg-input: #1e2130;
    --accent: #00d4ff;
    --accent2: #a78bfa;
    --accent3: #ff6b6b;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(0,212,255,0.4);
    --text-primary: #f0f0f8;
    --text-secondary: #8b8fa8;
    --text-muted: #4a4d62;
    --font-main: 'Sora', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --sidebar-w: 248px;
  }
  .light-mode {
    --bg-base: #f4f5f9;
    --bg-sidebar: #ecedf2;
    --bg-card: #ffffff;
    --bg-input: #f0f1f5;
    --border: rgba(0,0,0,0.08);
    --text-primary: #16162a;
    --text-secondary: #5a5d72;
    --text-muted: #9ea0b4;
  }
  html, body { height: 100%; }
  body {
    font-family: var(--font-main);
    background: var(--bg-base);
    color: var(--text-primary);
    height: 100vh;
    transition: background 0.35s ease, color 0.35s ease;
    display: flex;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(640px 420px at 14% -6%, rgba(0,212,255,0.09), transparent 62%),
      radial-gradient(560px 420px at 92% 6%, rgba(167,139,250,0.08), transparent 60%);
  }
  svg { display: block; }

  /* ===== Sidebar ===== */
  .sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w);
    background: var(--bg-sidebar); border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    position: relative; z-index: 30;
    transition: margin-left 0.32s cubic-bezier(0.16,1,0.3,1), box-shadow 0.32s;
  }
  .logo-area { padding: 20px 18px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
  .logo-icon { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; }
  .logo-text { font-size: 17px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.3px; }
  .logo-text span { color: var(--accent); }
.logo-img { height: 34px; width: auto; display: block; }
  .sidebar-close { display: none; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: var(--text-secondary); align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .new-chat-btn { margin: 16px 14px 8px; background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.25); color: var(--accent); font-family: var(--font-main); font-size: 13px; font-weight: 500; padding: 10px 14px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s; width: calc(100% - 28px); text-decoration: none; }
  .new-chat-btn:hover { background: rgba(0,212,255,0.18); border-color: rgba(0,212,255,0.5); }
  .nav-section { padding: 6px 10px; flex: 1; overflow-y: auto; }
  .nav-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.4px; color: var(--text-muted); padding: 14px 8px 6px; }
  .nav-item { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 13.5px; color: var(--text-secondary); transition: all 0.18s; margin-bottom: 2px; border: 1px solid transparent; user-select: none; text-decoration: none; }
  .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text-primary); }
  .nav-item.active { background: rgba(0,212,255,0.08); color: var(--text-primary); border-color: rgba(0,212,255,0.2); }
  .nav-item.active .nav-icon { color: var(--accent); }
  .nav-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-secondary); }
  .nav-item:hover .nav-icon { color: var(--text-primary); }
.nav-badge { margin-left: auto; background: var(--accent3); color: white; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 20px; font-family: var(--font-mono); }
.nav-badge.green { background: var(--accent2); color: #16122b; }
.nav-badge.purple { background: var(--accent2); color: #080a12; }
.nav-group-children { overflow: hidden; max-height: 0; transition: max-height 0.3s ease; }
.nav-group-children.open { max-height: 200px; }
.nav-group-toggle { cursor: pointer; }
.nav-group-chevron { margin-left: auto; transition: transform 0.3s; font-size: 10px; color: var(--text-muted); }
.nav-group-toggle.open .nav-group-chevron { transform: rotate(180deg); }
.nav-group-item { padding-left: 36px !important; }

  /* Upgrade button in sidebar */
  .upgrade-nav-btn {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 12px; border-radius: 10px;
    cursor: pointer; font-size: 13.5px; font-weight: 600;
    color: var(--accent2);
    background: rgba(167,139,250,0.08);
    border: 1px solid rgba(167,139,250,0.2);
    margin-bottom: 2px; text-decoration: none;
    transition: all 0.18s;
  }
  .upgrade-nav-btn:hover { background: rgba(167,139,250,0.14); border-color: rgba(167,139,250,0.4); }
  .upgrade-nav-btn.active { background: rgba(167,139,250,0.14); border-color: rgba(167,139,250,0.35); }

  .sidebar-bottom { padding: 12px 10px; border-top: 1px solid var(--border); }
  .user-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; }
  .signout-btn { width: calc(100% - 20px); margin: 0 10px 8px; padding: 9px 14px; background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.2); color: var(--accent3); font-family: var(--font-main); font-size: 12px; font-weight: 500; border-radius: 8px; cursor: pointer; transition: all 0.18s; }
  .signout-btn:hover { background: rgba(255,107,107,0.15); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #00d4ff, #a78bfa); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; overflow: hidden; color: #06121a; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 13px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-plan { font-size: 11px; color: var(--accent); font-weight: 500; }
  .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(2px); z-index: 25; opacity: 0; visibility: hidden; transition: opacity 0.28s, visibility 0.28s; pointer-events: none; }

  /* ===== Main ===== */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-base); position: relative; z-index: 1; min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; border-bottom: 1px solid var(--border); gap: 12px; backdrop-filter: blur(6px); }
  .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .menu-btn { display: none; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary); align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: all 0.18s; }
  .menu-btn:hover { color: var(--text-primary); border-color: var(--border-hover); }
  .topbar-mobile-logo { display: none; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: var(--text-primary); }
  .topbar-mobile-logo .logo-icon { width: 28px; height: 28px; border-radius: 8px; }
  .topbar-mobile-logo span { color: var(--accent); }
  .page-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }

  /* ===== Content ===== */
  .content { flex: 1; overflow-y: auto; padding: 40px 60px; }
  .content::-webkit-scrollbar { width: 4px; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .page-header { margin-bottom: 36px; animation: fadeUp 0.45s cubic-bezier(0.16,1,0.3,1) both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .page-header h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
  .page-header h1 span { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .page-header p { font-size: 14px; color: var(--text-secondary); }

  /* ===== Usage section ===== */
  .section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.4px; color: var(--text-muted); margin-bottom: 14px; }
  .usage-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 40px; animation: fadeUp 0.45s 0.08s cubic-bezier(0.16,1,0.3,1) both; }
  .usage-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px 20px 18px;
    transition: border-color 0.2s;
  }
  .usage-card:hover { border-color: rgba(0,212,255,0.18); }
  .usage-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .usage-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.16); color: var(--accent); }
  .usage-icon.violet { background: rgba(167,139,250,0.1); border-color: rgba(167,139,250,0.2); color: var(--accent2); }
  .usage-icon.coral { background: rgba(255,107,107,0.08); border-color: rgba(255,107,107,0.18); color: var(--accent3); }
  .usage-icon svg { width: 17px; height: 17px; }
  .usage-fraction { font-family: var(--font-mono); font-size: 13px; color: var(--text-muted); }
  .usage-fraction .used { color: var(--accent); font-weight: 700; }
  .usage-label { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 10px; }
  .usage-bar { height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
  .usage-bar-fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.6s cubic-bezier(0.16,1,0.3,1); }
  .usage-bar-fill.full { background: linear-gradient(90deg, var(--accent3), #ff8f8f); }
  .usage-bar-fill.violet { background: linear-gradient(90deg, var(--accent2), #c4b5fd); }
  .usage-status { font-size: 11.5px; color: var(--text-muted); }
  .usage-status.ok { color: #34d399; }
  .usage-status.warn { color: #fbbf24; }
  .usage-status.full { color: var(--accent3); }

  /* Unlimited badge */
  .unlimited-pill { display: inline-flex; align-items: center; gap: 4px; background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.25); color: #34d399; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; font-family: var(--font-mono); }

  /* ===== Plans ===== */
  .plans-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 40px; animation: fadeUp 0.45s 0.16s cubic-bezier(0.16,1,0.3,1) both; }
  .plan-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 20px; padding: 28px 24px;
    position: relative; transition: all 0.2s;
  }
  .plan-card:hover { border-color: rgba(255,255,255,0.12); }
  .plan-card.pro {
    background: linear-gradient(160deg, #13111f 0%, #0f1117 100%);
    border-color: rgba(167,139,250,0.28);
    box-shadow: 0 0 40px rgba(167,139,250,0.07);
  }
  .plan-card.pro:hover { border-color: rgba(167,139,250,0.45); }
  .plan-card.current-free { border-color: rgba(0,212,255,0.28); }

  .plan-ribbon {
    position: absolute; top: -1px; right: 22px;
    background: linear-gradient(135deg, var(--accent2), #7c3aed);
    color: white; font-size: 10.5px; font-weight: 700;
    padding: 4px 12px; border-radius: 0 0 10px 10px;
    letter-spacing: 0.5px;
  }

  .plan-header { margin-bottom: 20px; }
  .plan-name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.4px; color: var(--text-muted); margin-bottom: 6px; }
  .plan-title { font-size: 22px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.4px; margin-bottom: 6px; }
  .plan-title.pro-gradient { background: linear-gradient(135deg, var(--accent2), #c4b5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .plan-price { font-size: 13px; color: var(--text-muted); }
  .plan-price strong { font-size: 28px; color: var(--text-primary); font-weight: 800; font-family: var(--font-mono); letter-spacing: -1px; }
  .plan-price .per { color: var(--text-muted); font-size: 12px; }

  .plan-divider { height: 1px; background: var(--border); margin: 20px 0; }

  .plan-features { list-style: none; padding: 0; margin: 0 0 24px; display: flex; flex-direction: column; gap: 11px; }
  .plan-feature { display: flex; align-items: flex-start; gap: 10px; font-size: 13.5px; color: var(--text-secondary); }
  .plan-feature .check { width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .plan-feature .check.cyan { background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.2); color: var(--accent); }
  .plan-feature .check.violet { background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.22); color: var(--accent2); }
  .plan-feature .check svg { width: 11px; height: 11px; }
  .plan-feature .feat-text strong { color: var(--text-primary); display: block; font-weight: 500; }
  .plan-feature .feat-text span { font-size: 12px; color: var(--text-muted); }

  .plan-btn {
    width: 100%; padding: 12px 16px; border-radius: 12px;
    font-family: var(--font-main); font-size: 13.5px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 7px;
    border: none; text-align: center;
  }
  .plan-btn.current { background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.2); color: var(--accent); cursor: default; }
  .plan-btn.request { background: linear-gradient(135deg, rgba(167,139,250,0.18), rgba(109,40,217,0.18)); border: 1px solid rgba(167,139,250,0.35); color: var(--accent2); }
  .plan-btn.request:hover { background: linear-gradient(135deg, rgba(167,139,250,0.28), rgba(109,40,217,0.28)); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(167,139,250,0.18); }
  .plan-btn.requested { background: rgba(52,211,153,0.08); border: 1px solid rgba(52,211,153,0.25); color: #34d399; cursor: default; }

  /* ===== Contact options (shown after request click) ===== */
  .contact-options {
    margin-top: 14px; border-radius: 14px;
    background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
    padding: 16px; display: none; flex-direction: column; gap: 10px;
    animation: fadeUp 0.3s cubic-bezier(0.16,1,0.3,1) both;
  }
  .contact-options.show { display: flex; }
  .contact-label { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
  .contact-link {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.07); background: var(--bg-card);
    color: var(--text-secondary); font-size: 13px; text-decoration: none;
    transition: all 0.18s;
  }
  .contact-link:hover { border-color: rgba(0,212,255,0.28); color: var(--text-primary); background: rgba(0,212,255,0.04); }
  .contact-link svg { width: 16px; height: 16px; flex-shrink: 0; }
  .contact-link .cl-label { flex: 1; font-weight: 500; }
  .contact-link .cl-sub { font-size: 11.5px; color: var(--text-muted); }
  .contact-divider { height: 1px; background: rgba(255,255,255,0.05); margin: 2px 0; }

  /* Custom form */
  .contact-form { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
  .contact-form input, .contact-form textarea {
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 14px;
    color: var(--text-primary); font-family: var(--font-main); font-size: 13px;
    outline: none; resize: none; transition: border-color 0.2s;
  }
  .contact-form input::placeholder, .contact-form textarea::placeholder { color: var(--text-muted); }
  .contact-form input:focus, .contact-form textarea:focus { border-color: rgba(0,212,255,0.35); }
  .contact-form-btn {
    padding: 11px; border-radius: 10px;
    background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.25);
    color: var(--accent); font-family: var(--font-main); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.18s;
  }
  .contact-form-btn:hover { background: rgba(0,212,255,0.18); }

  /* ===== FAQ ===== */
  .faq-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 40px; animation: fadeUp 0.45s 0.24s cubic-bezier(0.16,1,0.3,1) both; }
  .faq-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .faq-q { padding: 16px 18px; font-size: 13.5px; font-weight: 500; color: var(--text-primary); cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; user-select: none; }
  .faq-q:hover { color: var(--accent); }
  .faq-chevron { width: 16px; height: 16px; flex-shrink: 0; color: var(--text-muted); transition: transform 0.2s; }
  .faq-item.open .faq-chevron { transform: rotate(180deg); }
  .faq-a { display: none; padding: 0 18px 16px; font-size: 13px; color: var(--text-secondary); line-height: 1.7; border-top: 1px solid var(--border); padding-top: 14px; }
  .faq-item.open .faq-a { display: block; }

  /* Loading state */
  .sub-loading { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 60px 20px; color: var(--text-muted); font-size: 13px; }
  .sub-loading-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: dotBounce 1.2s ease-in-out infinite; }
  .sub-loading-dot:nth-child(2) { animation-delay: 180ms; }
  .sub-loading-dot:nth-child(3) { animation-delay: 360ms; }
  @keyframes dotBounce { 0%,80%,100%{ transform:translateY(0);opacity:.4; } 40%{ transform:translateY(-5px);opacity:1; } }

  /* Toast */
  .sub-toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(60px);
    background: #1a1d27; border: 1px solid rgba(52,211,153,0.3); color: #34d399;
    padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 500;
    z-index: 9999; transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
    white-space: nowrap; pointer-events: none;
  }
  .sub-toast.show { transform: translateX(-50%) translateY(0); }

  /* ===== Mobile ===== */
  @media (max-width: 880px) {
    .sidebar { position: fixed; top: 0; left: 0; bottom: 0; margin-left: calc(-1 * var(--sidebar-w)); box-shadow: none; }
    .sidebar.open { margin-left: 0; box-shadow: 24px 0 60px rgba(0,0,0,0.45); }
    .sidebar-close { display: flex; }
    .sidebar-overlay.open { opacity: 1; visibility: visible; pointer-events: all; }
    .menu-btn { display: flex; }
    .topbar-mobile-logo { display: flex; }
    .topbar { padding: 12px 14px; }
    .content { padding: 24px 16px 40px; }
    .usage-grid { grid-template-columns: 1fr; }
    .plans-grid { grid-template-columns: 1fr; }
  }
@keyframes rippleAnim{to{transform:scale(2);opacity:0;}}
</style>
</head>

<script>
  /* ── Mobile sidebar ── */
  const sidebar        = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const menuBtn        = document.getElementById('menuBtn');
  const sidebarCloseBtn= document.getElementById('sidebarClose');
  function openSidebar()  { sidebar.classList.add('open');    sidebarOverlay.classList.add('open'); }
  function closeSidebar() { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('open'); }
  menuBtn.addEventListener('click', openSidebar);
  sidebarCloseBtn.addEventListener('click', closeSidebar);
  sidebarOverlay.addEventListener('click', closeSidebar);
  document.querySelectorAll('.nav-item:not(.nav-group-toggle)').forEach((link) => {
    link.addEventListener('click', () => { if (window.innerWidth <= 880) closeSidebar(); });
  });
  function toggleNavGroup(el) {
    el.classList.toggle('open');
    const children = el.nextElementSibling;
    if (children) children.classList.toggle('open');
  }

  /* ── Toast ── */
  function showToast(msg, isError = false) {
    const t = document.getElementById('subToast');
    t.textContent = msg;
    t.style.borderColor = isError ? 'rgba(255,107,107,0.3)' : 'rgba(52,211,153,0.3)';
    t.style.color = isError ? '#ff6b6b' : '#34d399';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3200);
  }

  /* ── FAQ toggle ── */
  function toggleFaq(el) {
    const item = el.closest('.faq-item');
    item.classList.toggle('open');
  }

  /* ── Contact options toggle ── */
  function toggleContact() {
    const box = document.getElementById('contactOptions');
    const btn = document.getElementById('requestBtn');
    if (box.classList.contains('show')) {
      box.classList.remove('show');
    } else {
      box.classList.add('show');
      btn.classList.add('requested');
      btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Request sent — choose contact method`;
    }
  }

  /* ── Contact form submit ── */
  function submitContactForm() {
    const name = document.getElementById('cfName').value.trim();
    const email = document.getElementById('cfEmail').value.trim();
    const msg = document.getElementById('cfMsg').value.trim();
    if (!name || !email) { showToast('Please enter your name and email.', true); return; }
    // In production, send to a backend endpoint. For now, record in Firestore via the module.
    import('./subscription.js').then(({ requestProAccess }) => {
      import('./firebase-config.js').then(({ auth }) => {
        import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js').then(({ onAuthStateChanged }) => {
          onAuthStateChanged(auth, (user) => {
            if (user && user.emailVerified) requestProAccess(user.uid, user.email);
          });
        });
      });
    });
    showToast('✓ Request submitted! We\'ll reach out soon.');
    document.getElementById('cfName').value = '';
    document.getElementById('cfEmail').value = '';
    document.getElementById('cfMsg').value = '';
  }
</script>

  }

  // Auth + data load
  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }
    if (user && !user.emailVerified) { window.location.href = 'verify-email.html'; return; }

    // Sidebar user info
    document.getElementById('userName').textContent = user.displayName || user.email;
    document.getElementById('userAvatar').textContent = (user.displayName || user.email || 'G')[0].toUpperCase();
    if (user.photoURL) {
      document.getElementById('userAvatar').innerHTML = `<img src="${user.photoURL.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}" alt="avatar" />`;
    }

    const plan = await import('./subscription.js').then(m => m.getUserPlan(user.uid, user));
    const usage = await import('./subscription.js').then(m => m.getUsage(user.uid));
    document.getElementById('userPlanLabel').textContent = plan === 'pro' ? '✨ Aquila Pro' : 'Free Plan';

    document.getElementById('loadingState').style.display = 'none';
    renderPage({ user, plan, usage });
  });

  // Sign out
  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = 'login.html';
  });

/* ── Scroll progress bar ── */
(function(){
  var bar = document.createElement('div');
  bar.className = 'scroll-progress';
  document.body.prepend(bar);
  var ticking = false;
  window.addEventListener('scroll', function(){
    if(!ticking){ requestAnimationFrame(function(){
      var h = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = h > 0 ? ((window.scrollY / h) * 100) + '%' : '0%';
      ticking = false;
    }); ticking = true; }
  });
}());

/* ── Ripple effect ── */
(function(){
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(rm) return;
  document.querySelectorAll('.btn-primary, .btn-secondary, .btn-ghost-nav, .signout-btn, .new-chat-btn, .upgrade-nav-btn, .send-btn').forEach(function(btn){
    btn.addEventListener('click', function(e){
      var rp = document.createElement('span');
      var r = btn.getBoundingClientRect();
      var s = Math.max(r.width, r.height);
      rp.style.cssText = 'position:absolute;top:'+(e.clientY-r.top-s/2)+'px;left:'+(e.clientX-r.left-s/2)+'px;width:'+s+'px;height:'+s+'px;border-radius:50%;background:rgba(255,255,255,0.15);transform:scale(0);animation:rippleAnim .5s ease-out;pointer-events:none;z-index:0;';
      btn.style.position = 'relative';
      btn.style.overflow = 'hidden';
      btn.appendChild(rp);
      setTimeout(function(){ rp.remove(); }, 600);
    });
  });
}());
</script>
