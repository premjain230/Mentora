<style>
.usage-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:40px; }
.usage-card { background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:20px 20px 18px;transition:border-color 0.2s; }
.usage-card:hover { border-color:rgba(0,212,255,0.18); }
.usage-card-top { display:flex;align-items:center;justify-content:space-between;margin-bottom:14px; }
.usage-icon { width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.16);color:var(--cyan); }
.usage-icon.violet { background:rgba(167,139,250,0.1);border-color:rgba(167,139,250,0.2);color:var(--violet); }
.usage-icon.coral { background:rgba(255,107,107,0.08);border-color:rgba(255,107,107,0.18);color:var(--red); }
.usage-icon svg { width:17px;height:17px; }
.usage-fraction { font-family:var(--font-mono);font-size:13px;color:var(--text-muted); }
.usage-fraction .used { color:var(--cyan);font-weight:700; }
.usage-label { font-size:13px;font-weight:500;margin-bottom:10px; }
.usage-bar { height:6px;background:rgba(255,255,255,0.05);border-radius:10px;overflow:hidden;margin-bottom:8px; }
.usage-bar-fill { height:100%;border-radius:10px;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width 0.6s cubic-bezier(0.16,1,0.3,1); }
.usage-bar-fill.full { background:linear-gradient(90deg,var(--red),#ff8f8f); }
.usage-bar-fill.violet { background:linear-gradient(90deg,var(--violet),#c4b5fd); }
.usage-status { font-size:11.5px;color:var(--text-muted); }
.usage-status.ok { color:#34d399; }
.usage-status.warn { color:#fbbf24; }
.usage-status.full { color:var(--red); }
.unlimited-pill { display:inline-flex;align-items:center;gap:4px;background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.25);color:#34d399;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;font-family:var(--font-mono); }
.plans-grid { display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:40px; }
.plan-card { background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:28px 24px;position:relative;transition:all 0.2s; }
.plan-card:hover { border-color:rgba(255,255,255,0.12); }
.plan-card.pro { background:linear-gradient(160deg,#13111f 0%,#0f1117 100%);border-color:rgba(167,139,250,0.28);box-shadow:0 0 40px rgba(167,139,250,0.07); }
.plan-card.pro:hover { border-color:rgba(167,139,250,0.45); }
.plan-card.current-free { border-color:rgba(0,212,255,0.28); }
.plan-ribbon { position:absolute;top:-1px;right:22px;background:linear-gradient(135deg,var(--violet),#7c3aed);color:white;font-size:10.5px;font-weight:700;padding:4px 12px;border-radius:0 0 10px 10px;letter-spacing:0.5px; }
.plan-header { margin-bottom:20px; }
.plan-name { font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.4px;color:var(--text-muted);margin-bottom:6px; }
.plan-title { font-size:22px;font-weight:800;letter-spacing:-0.4px;margin-bottom:6px; }
.plan-title.pro-gradient { background:linear-gradient(135deg,var(--violet),#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
.plan-price { font-size:13px;color:var(--text-muted); }
.plan-price strong { font-size:28px;font-weight:800;font-family:var(--font-mono);letter-spacing:-1px; }
.plan-price .per { color:var(--text-muted);font-size:12px; }
.plan-divider { height:1px;background:var(--border);margin:20px 0; }
.plan-features { list-style:none;padding:0;margin:0 0 24px;display:flex;flex-direction:column;gap:11px; }
.plan-feature { display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:var(--text-secondary); }
.plan-feature .check { width:20px;height:20px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px; }
.plan-feature .check.cyan { background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.2);color:var(--cyan); }
.plan-feature .check.violet { background:rgba(167,139,250,0.1);border:1px solid rgba(167,139,250,0.22);color:var(--violet); }
.plan-feature .check svg { width:11px;height:11px; }
.plan-feature .feat-text strong { display:block;font-weight:500; }
.plan-feature .feat-text span { font-size:12px;color:var(--text-muted); }
.plan-btn { width:100%;padding:12px 16px;border-radius:12px;font-size:13.5px;font-weight:600;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:7px;border:none;text-align:center; }
.plan-btn.current { background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.2);color:var(--cyan);cursor:default; }
.plan-btn.request { background:linear-gradient(135deg,rgba(167,139,250,0.18),rgba(109,40,217,0.18));border:1px solid rgba(167,139,250,0.35);color:var(--violet); }
.plan-btn.request:hover { background:linear-gradient(135deg,rgba(167,139,250,0.28),rgba(109,40,217,0.28));transform:translateY(-1px);box-shadow:0 8px 24px rgba(167,139,250,0.18); }
.plan-btn.requested { background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.25);color:#34d399;cursor:default; }
.contact-options { margin-top:14px;border-radius:14px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);padding:16px;display:none;flex-direction:column;gap:10px; }
.contact-options.show { display:flex; }
.contact-label { font-size:12px;color:var(--text-muted);margin-bottom:2px; }
.contact-link { display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.07);background:var(--bg-card);color:var(--text-secondary);font-size:13px;text-decoration:none;transition:all 0.18s; }
.contact-link:hover { border-color:rgba(0,212,255,0.28);background:rgba(0,212,255,0.04); }
.contact-link svg { width:16px;height:16px;flex-shrink:0; }
.contact-link .cl-label { flex:1;font-weight:500; }
.contact-link .cl-sub { font-size:11.5px;color:var(--text-muted); }
.contact-divider { height:1px;background:rgba(255,255,255,0.05);margin:2px 0; }
.contact-form { display:flex;flex-direction:column;gap:8px;padding-top:4px; }
.contact-form input,.contact-form textarea { background:var(--bg-input);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:13px;outline:none;resize:none;transition:border-color 0.2s; }
.contact-form input::placeholder,.contact-form textarea::placeholder { color:var(--text-muted); }
.contact-form input:focus,.contact-form textarea:focus { border-color:rgba(0,212,255,0.35); }
.contact-form-btn { padding:11px;border-radius:10px;background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.25);color:var(--cyan);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.18s; }
.contact-form-btn:hover { background:rgba(0,212,255,0.18); }
.faq-list { display:flex;flex-direction:column;gap:10px;margin-bottom:40px; }
.faq-item { background:var(--bg-card);border:1px solid var(--border);border-radius:14px;overflow:hidden; }
.faq-q { padding:16px 18px;font-size:13.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;user-select:none; }
.faq-q:hover { color:var(--cyan); }
.faq-chevron { width:16px;height:16px;flex-shrink:0;color:var(--text-muted);transition:transform 0.2s; }
.faq-item.open .faq-chevron { transform:rotate(180deg); }
.faq-a { display:none;padding:0 18px 16px;font-size:13px;color:var(--text-secondary);line-height:1.7;border-top:1px solid var(--border);padding-top:14px; }
.faq-item.open .faq-a { display:block; }
.sub-loading { display:flex;align-items:center;justify-content:center;gap:8px;padding:60px 20px;color:var(--text-muted);font-size:13px; }
.sub-toast { position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(60px);background:#1a1d27;border:1px solid rgba(52,211,153,0.3);color:#34d399;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:500;z-index:9999;transition:transform 0.3s cubic-bezier(0.16,1,0.3,1);white-space:nowrap;pointer-events:none; }
.sub-toast.show { transform:translateX(-50%) translateY(0); }
@media (max-width:880px) {
  .usage-grid { grid-template-columns:1fr; }
  .plans-grid { grid-template-columns:1fr; }
}
</head>

<script>
  /* ── Mobile sidebar ── */
  const sidebar        = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const menuBtn        = document.getElementById('menuBtn');
  const sidebarCloseBtn= document.getElementById('sidebarClose');
  function openSidebar()  { sidebar.classList.add('open');    sidebarOverlay.classList.add('open'); }
  function closeSidebar() { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('open'); }
  menuBtn.addEventListener('click', openSidebar);
  sidebarCloseBtn.addEventListener('click', closeSidebar);
  sidebarOverlay.addEventListener('click', closeSidebar);
  document.querySelectorAll('.nav-item:not(.nav-group-toggle)').forEach((link) => {
    link.addEventListener('click', () => { if (window.innerWidth <= 880) closeSidebar(); });
  });
  function toggleNavGroup(el) {
    el.classList.toggle('open');
    const children = el.nextElementSibling;
    if (children) children.classList.toggle('open');
  }

  /* ── Toast ── */
  function showToast(msg, isError = false) {
    const t = document.getElementById('subToast');
    t.textContent = msg;
    t.style.borderColor = isError ? 'rgba(255,107,107,0.3)' : 'rgba(52,211,153,0.3)';
    t.style.color = isError ? '#ff6b6b' : '#34d399';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3200);
  }

  /* ── FAQ toggle ── */
  function toggleFaq(el) {
    const item = el.closest('.faq-item');
    item.classList.toggle('open');
  }

  /* ── Contact options toggle ── */
  function toggleContact() {
    const box = document.getElementById('contactOptions');
    const btn = document.getElementById('requestBtn');
    if (box.classList.contains('show')) {
      box.classList.remove('show');
    } else {
      box.classList.add('show');
      btn.classList.add('requested');
      btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Request sent — choose contact method`;
    }
  }

  /* ── Contact form submit ── */
  function submitContactForm() {
    const name = document.getElementById('cfName').value.trim();
    const email = document.getElementById('cfEmail').value.trim();
    const msg = document.getElementById('cfMsg').value.trim();
    if (!name || !email) { showToast('Please enter your name and email.', true); return; }
    // In production, send to a backend endpoint. For now, record in Firestore via the module.
    import('./subscription.js').then(({ requestProAccess }) => {
      import('./firebase-config.js').then(({ auth }) => {
        import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js').then(({ onAuthStateChanged }) => {
          onAuthStateChanged(auth, (user) => {
            if (user) requestProAccess(user.uid, user.email);
          });
        });
      });
    });
    showToast('✓ Request submitted! We\'ll reach out soon.');
    document.getElementById('cfName').value = '';
    document.getElementById('cfEmail').value = '';
    document.getElementById('cfMsg').value = '';
  }
</script>

<script type="module">
  import { auth, db } from './firebase-config.js';
  import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
  import { onUserReady, getUserPlan, getUsage, requestProAccess, PLANS } from './subscription.js';

  function pct(used, limit) {
    if (limit === Infinity) return 100;
    return Math.min(100, Math.round((used / limit) * 100));
  }

  function statusClass(p) {
    if (p >= 100) return 'full';
    if (p >= 75) return 'warn';
    return 'ok';
  }

  function statusText(used, limit, unit = '') {
    if (limit === Infinity) return 'Unlimited';
    const rem = limit - used;
    if (rem <= 0) return 'Limit reached';
    return `${rem} ${unit} remaining today`;
  }

  function renderPage({ user, plan, usage }) {
    const limits = PLANS[plan];
    const isPro = plan === 'pro';

    const chatPct = pct(usage.dailyChatCount, limits.chatLimit);
    const analysisPct = pct(usage.dailyAnalysisCount, limits.analysisLimit);
    const plannerPct = pct(usage.plannerUsageMinutes, limits.plannerMinutes);

    const chatLimit = limits.chatLimit === Infinity ? '∞' : limits.chatLimit;
    const analysisLimit = limits.analysisLimit === Infinity ? '∞' : limits.analysisLimit;
    const plannerLimit = limits.plannerMinutes === Infinity ? '∞' : limits.plannerMinutes;

    document.getElementById('mainContent').innerHTML = `
      <div class="page-header">
        <h1>Your <span>Subscription</span></h1>
        <p>Manage your plan and track daily usage across Aquila AI.</p>
      </div>

      <!-- Usage -->
      <div class="section-label">Today's Usage</div>
      <div class="usage-grid">
        <div class="usage-card">
          <div class="usage-card-top">
            <div class="usage-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
            ${isPro ? '<span class="unlimited-pill">∞ Unlimited</span>' : `<span class="usage-fraction"><span class="used">${usage.dailyChatCount}</span>/${chatLimit}</span>`}
          </div>
          <div class="usage-label">AI Chats</div>
          ${isPro ? '' : `<div class="usage-bar"><div class="usage-bar-fill${chatPct >= 100 ? ' full' : ''}" style="width:${chatPct}%"></div></div>`}
          <div class="usage-status ${isPro ? 'ok' : statusClass(chatPct)}">${statusText(usage.dailyChatCount, limits.chatLimit, 'chats')}</div>
        </div>
        <div class="usage-card">
          <div class="usage-card-top">
            <div class="usage-icon violet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg></div>
            ${isPro ? '<span class="unlimited-pill">∞ Unlimited</span>' : `<span class="usage-fraction"><span class="used" style="color:var(--accent2)">${usage.dailyAnalysisCount}</span>/${analysisLimit}</span>`}
          </div>
          <div class="usage-label">AI Analyses</div>
          ${isPro ? '' : `<div class="usage-bar"><div class="usage-bar-fill violet${analysisPct >= 100 ? ' full' : ''}" style="width:${analysisPct}%"></div></div>`}
          <div class="usage-status ${isPro ? 'ok' : statusClass(analysisPct)}">${statusText(usage.dailyAnalysisCount, limits.analysisLimit, 'analyses')}</div>
        </div>
        <div class="usage-card">
          <div class="usage-card-top">
            <div class="usage-icon coral"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg></div>
            ${isPro ? '<span class="unlimited-pill">∞ Unlimited</span>' : `<span class="usage-fraction"><span class="used" style="color:var(--accent3)">${usage.plannerUsageMinutes}</span>/${plannerLimit} min</span>`}
          </div>
          <div class="usage-label">Study Planner</div>
          ${isPro ? '' : `<div class="usage-bar"><div class="usage-bar-fill${plannerPct >= 100 ? ' full' : ''}" style="width:${plannerPct}%; background:linear-gradient(90deg,var(--accent3),#ff8f8f)"></div></div>`}
          <div class="usage-status ${isPro ? 'ok' : statusClass(plannerPct)}">${statusText(usage.plannerUsageMinutes, limits.plannerMinutes, 'min')}</div>
        </div>
      </div>

      <!-- Plans -->
      <div class="section-label">Plans</div>
      <div class="plans-grid">

        <!-- Free -->
        <div class="plan-card ${!isPro ? 'current-free' : ''}">
          <div class="plan-header">
            <div class="plan-name">Starter</div>
            <div class="plan-title">Free</div>
            <div class="plan-price"><strong>₹0</strong> <span class="per">/ forever</span></div>
          </div>
          <div class="plan-divider"></div>
          <ul class="plan-features">
            <li class="plan-feature"><span class="check cyan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span><span class="feat-text"><strong>20 AI Chats/day</strong><span>Resets every 24 hours</span></span></li>
            <li class="plan-feature"><span class="check cyan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span><span class="feat-text"><strong>20 AI Analyses/day</strong><span>Quiz & performance analysis</span></span></li>
            <li class="plan-feature"><span class="check cyan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span><span class="feat-text"><strong>30 min Study Planner/day</strong><span>Plan your daily schedule</span></span></li>
            <li class="plan-feature"><span class="check cyan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span><span class="feat-text"><strong>Community access</strong><span>Join other JEE/NEET aspirants</span></span></li>
          </ul>
          <button class="plan-btn ${!isPro ? 'current' : 'request'}" ${!isPro ? 'disabled' : 'onclick="window.location.href=\'home.html\'"'}>
            ${!isPro ? '✓ Your current plan' : 'Switch to Free'}
          </button>
        </div>

        <!-- Pro -->
        <div class="plan-card pro">
          <div class="plan-ribbon">✨ Early Access</div>
          <div class="plan-header">
            <div class="plan-name">Premium</div>
            <div class="plan-title pro-gradient">Aquila Pro</div>
            <div class="plan-price"><strong>Free*</strong> <span class="per">during Early Access</span></div>
          </div>
          <div class="plan-divider"></div>
          <ul class="plan-features">
            <li class="plan-feature"><span class="check violet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span><span class="feat-text"><strong>Unlimited AI Chats</strong><span>No daily restrictions</span></span></li>
            <li class="plan-feature"><span class="check violet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span><span class="feat-text"><strong>Unlimited AI Analyses</strong><span>Deep-dive any quiz anytime</span></span></li>
            <li class="plan-feature"><span class="check violet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span><span class="feat-text"><strong>Unlimited Study Planner</strong><span>Build plans without limits</span></span></li>
            <li class="plan-feature"><span class="check violet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span><span class="feat-text"><strong>Priority AI responses</strong><span>Faster, smarter answers</span></span></li>
            <li class="plan-feature"><span class="check violet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span><span class="feat-text"><strong>Early access to new features</strong><span>Be the first to try everything</span></span></li>
          </ul>
          ${isPro ? `
            <button class="plan-btn requested" disabled>✓ You have Aquila Pro</button>
          ` : `
            <button class="plan-btn request" id="requestBtn" onclick="toggleContact()">
              ✨ Request Pro Access — Free
            </button>
            <div class="contact-options" id="contactOptions">
              <div class="contact-label">Choose how to reach us</div>
              <a href="https://discord.gg/YOUR_DISCORD_INVITE" target="_blank" class="contact-link">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.001.022.01.043.027.057a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
                <span>
                  <span class="cl-label">Join our Discord</span>
                  <span class="cl-sub">Message us directly for instant access</span>
                </span>
              </a>
              <a href="mailto:hello@aquila.ai?subject=Pro Access Request&body=Hi, I'd like to request Aquila Pro access. My email is: ${user.email}" class="contact-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                <span>
                  <span class="cl-label">Send an email</span>
                  <span class="cl-sub">hello@aquila.ai — we'll reply within 24h</span>
                </span>
              </a>
              <div class="contact-divider"></div>
              <div class="contact-label">Or fill this quick form</div>
              <div class="contact-form">
                <input id="cfName" type="text" placeholder="Your name" value="${user.displayName || ''}" />
                <input id="cfEmail" type="email" placeholder="Your email" value="${user.email || ''}" />
                <textarea id="cfMsg" rows="2" placeholder="Anything you'd like us to know? (optional)"></textarea>
                <button class="contact-form-btn" onclick="submitContactForm()">Submit Request</button>
              </div>
            </div>
          `}
        </div>
      </div>

      <!-- FAQ -->
      <div class="section-label">Frequently Asked Questions</div>
      <div class="faq-list">
        <div class="faq-item">
          <div class="faq-q" onclick="toggleFaq(this)">
            When do daily limits reset?
            <svg class="faq-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="faq-a">All free plan limits reset every 24 hours at midnight. Your usage counter starts fresh each day automatically.</div>
        </div>
        <div class="faq-item">
          <div class="faq-q" onclick="toggleFaq(this)">
            Is Aquila Pro really free during Early Access?
            <svg class="faq-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="faq-a">Yes — Aquila Pro is completely free during our Early Access period. No credit card, no payment of any kind. We're giving early supporters unlimited access as a thank-you for helping us grow.</div>
        </div>
        <div class="faq-item">
          <div class="faq-q" onclick="toggleFaq(this)">
            How do I get Pro access?
            <svg class="faq-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="faq-a">Click "Request Pro Access" above and reach out via Discord, email, or the contact form. We'll manually upgrade your account within 24 hours. Pro access is granted by our team during Early Access.</div>
        </div>
        <div class="faq-item">
          <div class="faq-q" onclick="toggleFaq(this)">
            What exams does Aquila AI support?
            <svg class="faq-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="faq-a">Aquila AI is built specifically for Indian students preparing for JEE (Main & Advanced), NEET, and Board exams (Class 10 & 12). Our AI is tuned to the NCERT and JEE/NEET syllabi.</div>
        </div>
      </div>
    `;
  }

  function initSubscriptionPage() {
    if (!auth) {
      document.getElementById('loadingState').textContent = 'Firebase unavailable. Please try again.';
      return;
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }

      try {
        // Sidebar user info
        document.getElementById('userName').textContent = user.displayName || user.email;
        document.getElementById('userAvatar').textContent = (user.displayName || user.email || 'G')[0].toUpperCase();
        if (user.photoURL) {
          document.getElementById('userAvatar').innerHTML = `<img src="${user.photoURL}" alt="avatar" />`;
        }

        const { getUserPlan, getUsage } = await import('./subscription.js');
        const plan = await getUserPlan(user.uid, user);
        const usage = await getUsage(user.uid);
        document.getElementById('userPlanLabel').textContent = plan === 'pro' ? '✨ Aquila Pro' : 'Free Plan';

        document.getElementById('loadingState').style.display = 'none';
        renderPage({ user, plan, usage });
      } catch (err) {
        console.error('Subscription page failed to load:', err);
        document.getElementById('loadingState').textContent = 'Failed to load subscription data. Please refresh.';
      }
    });
  }

  initSubscriptionPage();

  // Sign out
  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = 'login.html';
  });
</script>

</body>
</html>
