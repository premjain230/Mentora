<style>
/* Subscription page — Orbit theme. Uses tokens.css vars. Loads after shell.css. */
:root {
  --sub-accent: var(--accent, #ff8a1f);
}
.light-mode { --sub-accent: var(--accent, #ea6a00); }
body { font-family: var(--font-main); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.main {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg-base); position: relative; z-index: 1; min-width: 0;
}
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--space-3);
  height: calc(var(--topbar-h) + env(safe-area-inset-top));
  min-height: calc(var(--topbar-h) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) var(--space-5) 0;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
  z-index: 20;
  overflow: hidden;
}
.topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.menu-btn {
  display: none; width: 36px; height: 36px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text-secondary); align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; transition: color 0.15s, border-color 0.15s;
}
.menu-btn:hover { color: var(--text-primary); border-color: var(--border-hover); }
.topbar-mobile-logo {

  font: 600 15px var(--font-display); color: var(--text-primary);
}
.topbar-mobile-logo .logo-img { height: 24px; width: auto; }
.topbar-mobile-logo span { color: inherit; }

.content { flex: 1; overflow-y: auto; padding: 48px 24px 72px; }
.content > * { max-width: 860px; margin-left: auto; margin-right: auto; }
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--radius-full); }
.page-header { margin-bottom: 40px; }
.page-header h1 {
  font: 700 28px/1.2 var(--font-display); letter-spacing: -0.03em;
  margin-bottom: 8px; color: var(--text-primary);
}
.page-header h1 span { color: var(--text-primary); }
.page-header p { font-size: 15px; color: var(--text-secondary); }
.section-label {
  font-size: 12px; font-weight: 500; letter-spacing: 0.02em;
  color: var(--text-muted); margin-bottom: 12px;
}

/* usage */
.usage-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
  margin-bottom: 48px;
}
.usage-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-xl); padding: 20px;
  transition: border-color 0.15s;
}
.usage-card:hover { border-color: var(--border-strong); }
.usage-card-top {

}
.usage-icon,
.usage-icon.violet,
.usage-icon.coral {

}
.usage-icon svg { width: 17px; height: 17px; }
.usage-fraction { font: 400 13px var(--font-mono); color: var(--text-muted); }
.usage-fraction .used { color: var(--text-primary) !important; font-weight: 700; }
.usage-label { font-size: 14px; font-weight: 500; color: var(--text-primary); margin-bottom: 12px; }
.usage-bar {

  border-radius: 999px; overflow: hidden; margin-bottom: 10px;
}
.usage-bar-fill {
  height: 100%; border-radius: 999px; background: var(--accent) !important;
  transition: width 0.6s cubic-bezier(.2, .7, .2, 1);
}
.usage-bar-fill.full { background: var(--accent3, #f87171) !important; }
.usage-status {
  font-size: 12px; color: var(--text-muted);
}
.usage-status.ok { color: var(--green, #10b981); }
.usage-status.warn { color: var(--accent4, #f59e0b); }
.usage-status.full { color: var(--accent3, #f87171); }

}
.plan-btn.request {

  transition: opacity 0.15s;
}
.contact-form-btn:hover { opacity: 0.88; }

.faq-list {

}
.faq-item {

  transition: border-color 0.15s;
}
.faq-item.open, .faq-item:hover { border-color: var(--border-strong); }
.faq-q {

  color: var(--text-primary); cursor: pointer;

.faq-q:hover { color: var(--text-primary); }
.faq-chevron {

}
.faq-item.open .faq-chevron { transform: rotate(180deg); }
.faq-a {
  display: none; padding: 14px 20px 18px; font-size: 14px;
  color: var(--text-secondary); line-height: 1.65;
  border-top: 1px solid var(--border);

.faq-item.open .faq-a { display: block; }

/* loading + toast */
.sub-loading {
  display: flex; justify-content: center; padding: 80px 20px;
}
.sub-loading-dot { display: none; }
.sub-loading::after {
  content: ""; width: 22px; height: 22px;
  border: 2px solid var(--border-strong);
  border-top-color: var(--accent);
  border-radius: 50%; animation: sr 0.8s linear infinite;
}
@keyframes sr { to { transform: rotate(360deg); } }
.sub-toast {
  position: fixed;
  bottom: calc(24px + env(safe-area-inset-bottom));

@media (max-width: 880px) {

}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>

<script>
 /* ── Toast ── */
 function showToast(msg, isError = false) {
  const t = document.getElementById('subToast');
  t.textContent = msg;
  t.style.borderColor = isError ? 'rgba(255,107,107,0.3)' : 'rgba(52,211,153,0.3)';
  t.style.color = isError ? '#ff6b6b' : '#34d399';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
 }

 /* ── FAQ toggle ── */
 function toggleFaq(el) {
  const item = el.closest('.faq-item');
  item.classList.toggle('open');
 }

 /* ── Contact options toggle ── */
 function toggleContact() {
  const box = document.getElementById('contactOptions');
  const btn = document.getElementById('requestBtn');
  if (box.classList.contains('show')) {
   box.classList.remove('show');
  } else {
   box.classList.add('show');
   btn.classList.add('requested');
   btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Request sent — choose contact method`;
  }
 }

 /* ── Contact form submit ── */
 function submitContactForm() {
  const name = document.getElementById('cfName').value.trim();
  const email = document.getElementById('cfEmail').value.trim();
  const msg = document.getElementById('cfMsg').value.trim();
  if (!name || !email) { showToast('Please enter your name and email.', true); return; }
  // Only record (and report success) for an actually signed-in, verified user.
  import('./firebase-config.js').then(async ({ auth }) => {
   const user = auth && auth.currentUser;
   if (!user || !user.emailVerified) {
    showToast('Please sign in and verify your email to submit a Pro request.', true);
    return;
   }
   const { requestProAccess } = await import('./subscription.js');
   try {
    await requestProAccess(user.uid, user.email);
    showToast('✓ Request submitted! We\'ll reach out soon.');
    document.getElementById('cfName').value = '';
    document.getElementById('cfEmail').value = '';
    document.getElementById('cfMsg').value = '';
   } catch (e) {
    console.error(e);
    showToast('Could not submit your request. Please try again.', true);
   }
  });
 }
</script>

<script type="module">
 import { mountSidebar, populateSidebarUser } from './js/components/sidebar.js';
 import { auth, db } from './firebase-config.js';

 import { onUserReady, getUserPlan, getUsage, requestProAccess, PLANS } from './subscription.js';

 function pct(used, limit) {
  if (limit === Infinity) return 100;
  return Math.min(100, Math.round((used / limit) * 100));
 }

 function statusClass(p) {
  if (p >= 100) return 'full';
  if (p >= 75) return 'warn';
  return 'ok';
 }

 function statusText(used, limit, unit = '') {
  if (limit === Infinity) return 'Unlimited';
  const rem = limit - used;
  if (rem <= 0) return 'Limit reached';
  return `${rem} ${unit} remaining today`;
 }

  // Populate shared sidebar user card
  const _sbMount = document.getElementById('sidebarMount');
  try { populateSidebarUser(user, plan, _sbMount); } catch(e) {}
  const limits = PLANS[plan];
  const isPro = plan === 'pro';

  const chatPct = pct(usage.dailyChatCount, limits.chatLimit);
  const analysisPct = pct(usage.dailyAnalysisCount, limits.analysisLimit);
  const plannerPct = pct(usage.plannerUsageMinutes, limits.plannerMinutes);

  const chatLimit = limits.chatLimit === Infinity ? '∞' : limits.chatLimit;
  const analysisLimit = limits.analysisLimit === Infinity ? '∞' : limits.analysisLimit;
  const plannerLimit = limits.plannerMinutes === Infinity ? '∞' : limits.plannerMinutes;

  document.getElementById('mainContent').innerHTML = `
   <div class="page-header">
    <h1>Your <span>Subscription</span></h1>

 mountSidebar('/subscription').then(sidebarEl => {
  if (!sidebarEl) return;
  const signOutBtn = sidebarEl.querySelector('#signOutBtn');
  if (signOutBtn) {
   signOutBtn.addEventListener('click', () => {
    signOut(auth).then(() => { window.location.href = '/login'; }).catch(console.error);
   });
  }
 }).catch(() => {});

 // Auth + data load — v2 null-safe + try/catch (fixes #720 + hard-refresh cache)
 onAuthStateChanged(auth, async (user) => {
  try {
   if (!user) { window.location.href = 'login.html'; return; }
   if (user && !user.emailVerified) { window.location.href = 'verify-email.html'; return; }

   // Sidebar user info (null-safe — fixes #720 TypeError)
   try {
    const nameEl = document.getElementById('userName');
    if (nameEl) nameEl.textContent = user.displayName || user.email || 'Guest';
    const avatarEl = document.getElementById('userAvatar');
    if (avatarEl) {
     if (user.photoURL) {
      avatarEl.innerHTML = `<img src="${String(user.photoURL).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}" alt="avatar" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" />`;
     } else {
      avatarEl.textContent = (user.displayName || user.email || 'G')[0].toUpperCase();
     }
    }
   } catch (e) { console.warn('sidebar update skipped', e); }

   let plan = 'free';
   let usage = { dailyChatCount: 0, dailyAnalysisCount: 0, plannerUsageMinutes: 0, date: new Date().toISOString().slice(0,10) };
   try {
    const mod = await import('./subscription.js');
    plan = await mod.getUserPlan(user.uid, user).catch(()=> 'free');
    usage = await mod.getUsage(user.uid).catch(()=> usage);
   } catch (e) { console.warn('plan/usage load failed', e); }

   // Supports both old (userPlanLabel) and current (userPlan) markup
   try {
    const planEl = document.getElementById('userPlanLabel') || document.getElementById('userPlan') || document.querySelector('.user-plan');
    if (planEl) planEl.textContent = plan === 'pro' ? '✨ Learning Allied Pro' : 'Free Plan';
   } catch (e) { console.warn('plan badge skipped', e); }

   const ls = document.getElementById('loadingState');
   if (ls) ls.style.display = 'none';
   try { renderPage({ user, plan, usage }); } catch (e) { console.error('renderPage failed', e); const ls2 = document.getElementById('loadingState'); if (ls2) ls2.innerHTML = '<div style="color:#ff6b6b;padding:20px;">Failed to load subscription. Please refresh.</div>'; }
  } catch (e) {
   console.error('subscription auth handler failed', e);
   const ls = document.getElementById('loadingState');
   if (ls) { ls.style.display = 'block'; ls.innerHTML = '<div style="color:#ff6b6b;padding:20px;">Something went wrong. Please refresh.</div>'; }
  }
 });

 // Sign out
 document.getElementById('signOutBtn').addEventListener('click', async () => {

 });

/* ── Scroll progress bar ── */
(function(){
 var bar = document.createElement('div');
 bar.className = 'scroll-progress';
 document.body.prepend(bar);
 var ticking = false;
 window.addEventListener('scroll', function(){
  if(!ticking){ requestAnimationFrame(function(){
   var h = document.documentElement.scrollHeight - window.innerHeight;
   bar.style.width = h > 0 ? ((window.scrollY / h) * 100) + '%' : '0%';
   ticking = false;
  }); ticking = true; }
 });
}());

/* ── Ripple effect ── */
(function(){
 var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(rm) return;
 document.querySelectorAll('.btn-primary, .btn-secondary, .btn-ghost-nav, .signout-btn, .new-chat-btn, .upgrade-nav-btn, .send-btn').forEach(function(btn){
  btn.addEventListener('click', function(e){
   var rp = document.createElement('span');
   var r = btn.getBoundingClientRect();
   var s = Math.max(r.width, r.height);
   rp.style.cssText = 'position:absolute;top:'+(e.clientY-r.top-s/2)+'px;left:'+(e.clientX-r.left-s/2)+'px;width:'+s+'px;height:'+s+'px;border-radius:50%;background:rgba(255,255,255,0.15);transform:scale(0);animation:rippleAnim .5s ease-out;pointer-events:none;z-index:0;';
   btn.style.position = 'relative';
   btn.style.overflow = 'hidden';
   btn.appendChild(rp);
   setTimeout(function(){ rp.remove(); }, 600);
  });
 });
}());
