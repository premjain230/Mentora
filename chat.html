<style>
 /* =========================================================================
    Chat — dedicated composer/conversation layout.
    No dashboard chrome: no graphs.css, no stat cards, no analytics.
    ========================================================================= */

 .main { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

 /* ---- Topbar: minimal — brand, nothing else fighting for attention ---- */
 .topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 56px; flex-shrink: 0;
  background: var(--bg-base); border-bottom: 1px solid var(--border-subtle);
 }
 .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
 .menu-btn {
  width: 32px; height: 32px; border-radius: var(--radius-md); border: none; background: transparent;
  color: var(--text-secondary); display: none; align-items: center; justify-content: center; cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
 }
 .menu-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
 .brand-mark { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: -0.01em; color: var(--text-primary); }
 .brand-mark img { width: 22px; height: 22px; border-radius: 6px; }
 .brand-mark .logo-text { display: none; }
 .topbar-context { font-size: 12.5px; color: var(--text-muted); padding-left: 10px; margin-left: 2px; border-left: 1px solid var(--border-subtle); display: none; }
 .topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
 .new-chat-topbtn {
  display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
  border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text-secondary); font-size: 12.5px; font-weight: 500; cursor: pointer;
  transition: all var(--dur-fast) var(--ease-out);
 }
 .new-chat-topbtn:hover { color: var(--text-primary); border-color: var(--border-strong); background: var(--bg-card-hover); }
 .new-chat-topbtn svg { width: 14px; height: 14px; stroke-width: 2.2; }
 #topbarAvatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); cursor: pointer; }

 /* ---- Conversation area ---- */
 .chat-area {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 28px 20px 16px; display: flex; flex-direction: column; gap: 4px;
  scroll-behavior: smooth; background: var(--bg-base);
 }
 .chat-area::-webkit-scrollbar { width: 5px; }
 .chat-area::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
 .chat-area::-webkit-scrollbar-track { background: transparent; }

 /* ---- Empty state (built by chat.js renderWelcome) ---- */
 .welcome {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: 48px 20px 16px; gap: 16px; max-width: 640px; margin: auto; width: 100%;
  animation: fadeUp 0.5s var(--ease-out) both;
 }
 @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
 .welcome-icon {
  width: 52px; height: 52px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-sm); position: relative; color: var(--accent);
 }
 .welcome-icon::before {
  content: ''; position: absolute; inset: -1px; border-radius: var(--radius-xl);
  background: linear-gradient(135deg, rgba(14,165,233,0.14), rgba(139,124,247,0.10));
  z-index: -1; opacity: 0.9;
 }
 .welcome-icon svg { width: 24px; height: 24px; stroke-width: 1.7; }
 .welcome h1 {
  font-family: var(--font-display); font-size: 25px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.25;
  color: var(--text-primary);
 }
 .welcome p { font-size: 14px; color: var(--text-secondary); max-width: 440px; line-height: 1.65; font-weight: 400; }

 .suggestion-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; max-width: 600px; margin-top: 4px; }
 .suggestion-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 15px; cursor: pointer; text-align: left;
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
 }
 .suggestion-card:hover { background: var(--bg-card-hover); border-color: var(--border-strong); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
 .suggestion-card:active { transform: translateY(0); }
 .suggestion-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
 .sug-icon { width: 28px; height: 28px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; margin-bottom: 9px; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-muted); }
 .sug-icon svg { width: 14px; height: 14px; stroke-width: 1.7; }
 .sug-title { font-size: 12.5px; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; letter-spacing: -0.01em; }
 .sug-desc { font-size: 11.5px; color: var(--text-muted); line-height: 1.5; }

 /* ---- Messages (rendered by chat.js — see class names below) ---- */
 .message-row {
  display: flex; gap: 12px; padding: 8px 4px; max-width: 720px; margin: 0 auto; width: 100%;
  align-items: flex-start; animation: msgIn 0.28s var(--ease-out) both;
 }
 @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
 .message-row.user { justify-content: flex-end; }
 .message-row.assistant { align-items: flex-start; }

 .user-bubble {
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: var(--radius-lg); border-bottom-right-radius: 6px;
  padding: 11px 15px; max-width: 72%;
  font-size: 14px; line-height: 1.6; color: var(--text-primary); font-weight: 450;
  word-break: break-word; white-space: pre-wrap; box-shadow: var(--shadow-xs);
 }

 .assistant-avatar {
  width: 28px; height: 28px; flex-shrink: 0; margin-top: 2px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: #fff;
 }

 .ai-bubble { flex: 1; min-width: 0; font-size: 14px; line-height: 1.75; color: var(--text-primary); word-break: break-word; font-weight: 400; }
 .ai-bubble h1 { font-family: var(--font-display); font-size: 19px; font-weight: 650; margin: 16px 0 8px; letter-spacing: -0.02em; }
 .ai-bubble h2 { font-family: var(--font-display); font-size: 16px; font-weight: 650; margin: 16px 0 8px; color: var(--text-primary); padding-bottom: 6px; border-bottom: 1px solid var(--border-subtle); }
 .ai-bubble h3 { font-size: 14px; font-weight: 600; margin: 12px 0 6px; }
 .ai-bubble strong { font-weight: 600; color: var(--text-primary); }
 .ai-bubble em { color: var(--text-secondary); }
 .ai-bubble ul, .ai-bubble ol { padding-left: 20px; margin: 8px 0; }
 .ai-bubble li { margin: 4px 0; color: var(--text-secondary); }
 .ai-bubble li::marker { color: var(--text-muted); }
 .ai-bubble code { background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 5px; padding: 1px 6px; font-family: var(--font-mono); font-size: 12.5px; color: var(--accent2); font-weight: 500; }
 .ai-bubble pre { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px 16px; overflow-x: auto; margin: 12px 0; max-width: 100%; }
 .ai-bubble pre code { background: none; border: none; padding: 0; color: var(--text-primary); font-size: 12.5px; }
 .ai-bubble hr { border: none; border-top: 1px solid var(--border-subtle); margin: 16px 0; }
 .ai-bubble p { margin: 8px 0; color: var(--text-primary); }
 .ai-bubble blockquote { border-left: 3px solid var(--accent2); padding: 4px 14px; margin: 10px 0; color: var(--text-secondary); background: var(--bg-card); border-radius: 6px; }
 .ai-bubble table { border-collapse: collapse; width: 100%; font-size: 13px; }
 .ai-bubble th, .ai-bubble td { padding: 8px 12px; border: 1px solid var(--border); text-align: left; }
 .ai-bubble a { color: var(--accent); font-weight: 500; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: transparent; transition: text-decoration-color var(--dur-fast) ease; }
 .ai-bubble a:hover { text-decoration-color: var(--accent); }

 /* ---- Typing / streaming cursor (used by chat.js) ---- */
 @keyframes learningAlliedDot { 0%,80%,100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-6px); opacity: 1; } }
 @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
 .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; animation: learningAlliedDot 1.2s ease-in-out infinite; }
 .stream-cursor { display: inline-block; width: 2px; height: 15px; background: var(--accent); border-radius: 2px; margin-left: 2px; vertical-align: middle; animation: blink .7s step-end infinite; }

 /* ---- Loading state (used by home.js when opening a saved chat) ---- */
 .chat-loading { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 48px 20px; color: var(--text-muted); font-size: 13px; }
 .chat-loading-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); display: inline-block; animation: learningAlliedDot 1.2s ease-in-out infinite; }
 .chat-loading-dot:nth-child(2) { animation-delay: 150ms; }
 .chat-loading-dot:nth-child(3) { animation-delay: 300ms; }

 /* ---- Composer ---- */
 .input-area { padding: 12px 20px 18px; border-top: 1px solid var(--border-subtle); background: linear-gradient(to top, var(--bg-base) 65%, transparent); flex-shrink: 0; }
 .input-box {
  max-width: 720px; margin: 0 auto;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl);
  padding: 10px 10px 10px 16px; display: flex; align-items: flex-end; gap: 8px;
  box-shadow: var(--shadow-sm); transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
 }
 .input-box:focus-within { border-color: var(--border-active); box-shadow: var(--shadow-glow); }
 .input-box textarea {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text-primary); font-family: var(--font-main); font-size: 14.5px; font-weight: 450;
  resize: none; line-height: 1.6; min-height: 24px; max-height: 160px; overflow-y: auto; padding: 6px 0;
 }
 .input-box textarea::placeholder { color: var(--text-faint); }
 .send-btn {
  width: 34px; height: 34px; border-radius: var(--radius-md); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  background: var(--text-primary); border: 1px solid var(--text-primary); color: var(--bg-base);
  transition: all var(--dur-fast) var(--ease-out);
 }
 .send-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); filter: brightness(1.12); }
 .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
 .send-btn svg { width: 15px; height: 15px; stroke-width: 2.3; }
 .send-btn.search-pulse { position: relative; }
 .send-btn.search-pulse::after {
  content: ''; position: absolute; inset: -3px; border-radius: calc(var(--radius-md) + 3px);
  border: 2px solid var(--accent2); opacity: 0; animation: pulseRing 1.2s ease-out infinite;
 }
 @keyframes pulseRing { 0% { opacity: 0.6; transform: scale(1); } 100% { opacity: 0; transform: scale(1.18); } }
 .input-footer {
  font-size: 11px; color: var(--text-faint); max-width: 720px; margin: 10px auto 0; text-align: center; font-weight: 450;
 }

 /* ---- Reduced motion ---- */
 @media (prefers-reduced-motion: reduce) {
  .welcome, .message-row, .suggestion-card, .send-btn { animation: none !important; transition: none !important; }
 }

 /* ---- Mobile ---- */
 @media (max-width: 880px) {
  .menu-btn { display: flex; }
  .topbar { padding: 0 14px; height: 52px; }
  .chat-area { padding: 18px 12px 12px; }
  .input-area { padding: 10px 12px 14px; }
  .suggestion-grid { grid-template-columns: 1fr; gap: 8px; }
  .user-bubble { max-width: 86%; }
  .welcome { padding: 28px 6px 12px; gap: 12px; }
  .welcome h1 { font-size: 21px; }
  .welcome p { font-size: 13px; }
  .welcome-icon { width: 48px; height: 48px; }
  .new-chat-topbtn span { display: none; }
  .new-chat-topbtn { width: 32px; padding: 0; justify-content: center; }
 }
</style>
<style>

<!-- ===== Non-module helpers (kept plain for inline handlers) ===== -->
<script>
function resizeInput(input) {
 input.style.height = 'auto';
 input.style.height = input.scrollHeight + 'px';
}
function fillPrompt(text) {
 const input = document.getElementById('chatInput');
 input.value = text;
 resizeInput(input);
 input.focus();
}
function runPrompt(text) {
 const input = document.getElementById('chatInput');
 input.value = text;
 resizeInput(input);
 sendMessage();
}
function handleKey(e) {
 if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

/* Mobile sidebar open/close/toggle is handled by js/components/sidebar.js mountSidebar(). */

/* Focus the chat input on load (desktop only — avoids popping the mobile keyboard). */
(function(){
 if (window.matchMedia('(pointer: coarse)').matches) return;
 window.addEventListener('load', function(){
  var input = document.getElementById('chatInput');
  if (input && !input.value) {
   setTimeout(function(){ input.focus({ preventScroll: true }); }, 400);
  }
 });
}());

/* Ripple on primary buttons. */
(function(){
 if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
 document.querySelectorAll('.send-btn, .new-chat-topbtn').forEach(function(btn){
  btn.addEventListener('click', function(e){
   var ripple = document.createElement('span');
   var r = btn.getBoundingClientRect();
   var size = Math.max(r.width, r.height);
   ripple.style.cssText = 'position:absolute;top:'+(e.clientY-r.top-size/2)+'px;left:'+(e.clientX-r.left-size/2)+'px;width:'+size+'px;height:'+size+'px;border-radius:50%;background:rgba(255,255,255,0.15);transform:scale(0);animation:rippleAnim 0.5s ease-out;pointer-events:none;z-index:0;';
   btn.style.position = 'relative';
   btn.style.overflow = 'hidden';
   btn.appendChild(ripple);
   setTimeout(function(){ ripple.remove(); }, 600);
  });
 });
}());
</script>
<style>@keyframes rippleAnim{to{transform:scale(2);opacity:0;}}</style>
