<style>
.chat-area { flex: 1 1 auto; width: 100%; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 28px clamp(16px, 4vw, 40px) calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth; background: transparent; }

.chat-area::-webkit-scrollbar { width: 6px; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--radius-full); }

/* ── Welcome ───────────────────────────────────────────── */
.welcome { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 24px 16px 12px; gap: 12px; max-width: 680px; margin: 0 auto; width: 100%; }
.welcome-icon { width: 60px; height: 60px; background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; color: var(--text-primary); }
.welcome-icon svg { width: 26px; height: 26px; stroke-width: 1.7; }
.welcome h1 { font-family: var(--font-display); font-size: clamp(28px, 4vw, 38px); font-weight: 700; letter-spacing: -0.035em; line-height: 1.12; color: var(--text-primary); }
.welcome p { font-size: 14px; color: var(--text-secondary); max-width: 500px; line-height: 1.6; font-weight: 400; }
.suggestion-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 640px; margin-top: 10px; }
.suggestion-card { min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 12px 18px; cursor: pointer; text-align: left; transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
.suggestion-card:hover { background: var(--bg-card-hover); border-color: var(--border-hover); transform: translateY(-1px); }
.suggestion-card:active { transform: translateY(0); }
.suggestion-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chat-suggestion-title { min-width: 0; font-size: 13.5px; font-weight: 550; color: var(--text-primary); letter-spacing: -0.01em; }
.chat-suggestion-arrow { flex-shrink: 0; color: var(--text-muted); font-size: 14px; transition: color var(--dur-fast) ease, transform var(--dur-fast) var(--ease-out); }
.suggestion-card:hover .chat-suggestion-arrow { color: var(--accent); transform: translate(1px, -1px); }

/* ── Composer ──────────────────────────────────────────── */
.input-area { width: 100%; padding: 12px clamp(12px, 3vw, 28px) 16px; background: transparent; }
.input-box { width: 100%; max-width: 760px; min-width: 0; min-height: 56px; margin: 0 auto; background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: 28px; padding: 9px 10px 9px 20px; display: flex; align-items: flex-end; gap: 8px; transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out); }
.input-box:focus-within { border-color: var(--border-active); box-shadow: 0 0 0 4px var(--bg-active); }
.input-box textarea { flex: 1 1 auto; min-width: 0; background: transparent; border: none; outline: none; color: var(--text-primary); font-family: var(--font-main); font-size: 14.5px; font-weight: 450; resize: none; line-height: 1.6; min-height: 24px; max-height: 160px; overflow-y: auto; padding: 8px 0; }

.input-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.search-toggle-btn, .send-btn { width: 38px; height: 38px; border-radius: 999px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: all var(--dur-fast) var(--ease-out); }
.search-toggle-btn { border: 1px solid var(--border-strong); background: transparent; color: var(--text-muted); }
.search-toggle-btn:hover { color: var(--text-primary); border-color: var(--border-hover); background: var(--bg-hover); }

.send-btn { background: var(--pill-bg, #ffffff); border: 1px solid transparent; color: var(--pill-fg, #000000); box-shadow: none; }
.send-btn:hover:not(:disabled) { opacity: 0.88; }
.send-btn:active:not(:disabled) { transform: scale(0.94); }
.send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

.message-row.assistant { align-items: flex-start; }
.user-bubble { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 24px 24px 8px 24px; padding: 12px 18px; max-width: 76%; font-size: 14px; line-height: 1.6; color: var(--text-primary); font-weight: 450; word-break: break-word; white-space: pre-wrap; }

.ai-bubble code { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px; padding: 1px 6px; font-family: var(--font-mono); font-size: 12.5px; color: var(--text-primary); font-weight: 500; }
.ai-bubble pre { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; overflow-x: auto; margin: 12px 0; max-width: 100%; }
.ai-bubble pre code { background: none; border: none; padding: 0; color: var(--text-primary); font-size: 12.5px; }
.ai-bubble hr { border: none; border-top: 1px solid var(--border-subtle); margin: 16px 0; }
.ai-bubble p { margin: 8px 0; color: var(--text-primary); }
.ai-bubble blockquote { border-left: 3px solid var(--accent); padding: 6px 16px; margin: 10px 0; color: var(--text-secondary); background: var(--bg-card); border-radius: 0 var(--radius-md) var(--radius-md) 0; }
.ai-bubble table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
.ai-bubble th, .ai-bubble td { padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: left; }
.ai-bubble th { background: var(--bg-elevated); font-weight: 600; }

.ai-bubble a:hover { border-bottom-color: var(--accent); }
.ai-actions { display: flex; align-items: center; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
.ai-action-btn { display: flex; align-items: center; gap: 5px; padding: 7px 12px; font-size: 12px; font-weight: 500; font-family: var(--font-main); border-radius: var(--radius-full); border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; transition: all var(--dur-fast) var(--ease-out); line-height: 1; }
.ai-action-btn:hover { color: var(--text-primary); border-color: var(--border-strong); background: var(--bg-hover); }
.ai-action-btn.active-good, .ai-action-btn.active-copy { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: var(--accent-soft); }
.ai-action-btn.active-bad { color: var(--accent3, #f87171); border-color: color-mix(in srgb, var(--accent3, #f87171) 30%, transparent); background: color-mix(in srgb, var(--accent3, #f87171) 10%, transparent); }
.ai-action-divider { width: 1px; height: 14px; background: var(--border); flex-shrink: 0; margin: 0 2px; }
.chat-loading { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 40px 20px; color: var(--text-muted); font-size: 13px; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes learningAlliedDot { 0%,80%,100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-6px); opacity: 1; } }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
.message-row { animation: fadeUp .3s var(--ease-out) both; }
.typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; animation: learningAlliedDot 1.2s ease-in-out infinite; }

.chat-loading-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); display: inline-block; animation: learningAlliedDot 1.2s ease-in-out infinite; }
.chat-loading-dot:nth-child(2) { animation-delay: 150ms; }
.chat-loading-dot:nth-child(3) { animation-delay: 300ms; }

/* ── Topbar ────────────────────────────────────────────── */
.chat-topbar { background: transparent; border-bottom-color: var(--border-subtle); }
.chat-topbar .topbar-left { flex: 0 1 auto; overflow: visible; }
.chat-topbar .model-selector { display: flex; }
.chat-topbar .model-selector::after { content: '⌄'; margin-left: 2px; color: var(--text-muted); }

/* Chat history button — lives in the topbar because the sidebar no longer
   carries a Chat History entry. */
.history-btn {
  display: inline-flex; align-items: center; gap: 6px;

}
.history-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
.history-btn:hover { color: var(--text-primary); border-color: var(--border-strong); background: var(--bg-card-hover); }
.history-btn:active { transform: translateY(1px); }
.history-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 560px) { .history-btn span { display: none; } .history-btn { width: 34px; padding: 0; justify-content: center; } }
@media (max-width: 880px) {

.message-row { padding: 0 4px; max-width: 100%; }

.input-footer span:last-child { display: none; }
}
@media (max-width: 880px) and (max-height: 700px) {

@media (max-width: 480px) { .chat-topbar { gap: 6px; } .chat-topbar .model-selector { padding: 7px 10px; } .input-box textarea { font-size: 16px; } }
@media (max-width: 360px) { .chat-topbar .model-selector { width: 32px; padding: 7px; gap: 0; overflow: hidden; color: transparent; } .chat-topbar .model-selector::after { display: none; } .chat-topbar .model-dot { margin: 0; } }
@media (prefers-reduced-motion: reduce) { .message-row { animation: none; } }

<script>
function resizeInput(input) {
 if (!input) return;
 input.style.height = 'auto';
 input.style.height = input.scrollHeight + 'px';
}
function fillPrompt(text) {
 const input = document.getElementById('chatInput');
 input.value = text;
 resizeInput(input);
 input.focus();
}
function runPrompt(text) {
 const input = document.getElementById('chatInput');
 input.value = text;
 resizeInput(input);
 sendMessage();
}
function handleKey(e) {
 if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
(function(){
 if (window.matchMedia('(pointer: coarse)').matches) return;
 window.addEventListener('load', function(){
  var input = document.getElementById('chatInput');
  if (input && !input.value) setTimeout(function(){ input.focus({ preventScroll: true }); }, 450);
 });
}());
(function(){
 var viewport = window.visualViewport;
 if (!viewport) return;
 function syncViewportHeight(){
  var target = document.activeElement;
  if (target && target.matches('input, textarea')) document.documentElement.style.setProperty('--app-height', viewport.height + 'px');
  else document.documentElement.style.removeProperty('--app-height');
 }
 document.addEventListener('focusin', syncViewportHeight);
 document.addEventListener('focusout', function(){ setTimeout(syncViewportHeight, 0); });
 viewport.addEventListener('resize', syncViewportHeight);
 syncViewportHeight();
}());
(function(){
 var chatArea = document.getElementById('chatArea');
 var control = document.getElementById('scrollControl');
 if (!chatArea) return;
 var bar = document.createElement('div');
 bar.className = 'scroll-progress';
 document.body.prepend(bar);
 var ticking = false;
 function updateScrollState(){
  ticking = false;
  var max = Math.max(0, chatArea.scrollHeight - chatArea.clientHeight);
  var top = Math.min(max, Math.max(0, chatArea.scrollTop));
  bar.style.width = max > 0 ? ((top / max) * 100) + '%' : '0%';
  if (!control) return;
  var scrollable = max > 8;
  var direction = top >= max - 48 || top > max * 0.55 ? 'up' : 'down';
  control.classList.toggle('visible', scrollable);
  control.dataset.direction = direction;
  var label = direction === 'up' ? 'Scroll to top' : 'Scroll to latest';
  control.setAttribute('aria-label', label);
  control.title = label;
 }
 function scheduleScrollUpdate(){
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(updateScrollState);
 }
 if (control) {
  control.addEventListener('click', function(){
   var max = Math.max(0, chatArea.scrollHeight - chatArea.clientHeight);
   var target = control.dataset.direction === 'up' ? 0 : max;
   chatArea.scrollTo({ top: target, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  });
 }
 chatArea.addEventListener('scroll', scheduleScrollUpdate, { passive: true });
 window.addEventListener('resize', scheduleScrollUpdate, { passive: true });
 if ('ResizeObserver' in window) new ResizeObserver(scheduleScrollUpdate).observe(chatArea);
 if ('MutationObserver' in window) new MutationObserver(scheduleScrollUpdate).observe(chatArea, { childList: true, subtree: true });
 scheduleScrollUpdate();
}());
(function(){
 if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
 document.querySelectorAll('.send-btn, .signout-btn, .new-chat-btn, .upgrade-nav-btn').forEach(function(btn){
  btn.addEventListener('click', function(e){
   var ripple = document.createElement('span');
   var r = btn.getBoundingClientRect();
   var size = Math.max(r.width, r.height);
