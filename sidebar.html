<!--
  Learning Allied — sidebar
  =========================
  This is the ONE place the app nav is defined. To add / remove / reorder a nav
  item, edit the <nav> below. No JavaScript changes needed.

  How active highlighting works:
    Each link carries data-nav="<url-segment>". sidebar.js compares it against
    the current path and adds .active. So data-nav MUST match the href's last
    segment: href="/study-session" -> data-nav="study-session".

  Badges:            <span class="nav-badge">New</span>
                     <span class="nav-badge green">New</span>
                     <span class="nav-badge purple">New</span>
                     <span class="nav-badge sky">..</span>
  Icon colours:      add class "tone-sky" or "tone-green" to the .nav-icon span.

  Collapsible group: a .nav-group-toggle button followed by .nav-group-children.
    sidebar.js wires the toggle. Add/remove children freely.

  NOTE: ids marked REQUIRED are read by other modules:
    navSection (home.js inserts recommendations), syllabus* (js/syllabus.js),
    newChatBtn / signOutBtn / userName / userPlan / userAvatar (home.js).
    Renaming them will break those features.
-->

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<aside class="sidebar" id="sidebar" aria-label="Main navigation">
  <div class="logo-area">
    <a href="/" class="logo">
      <img src="logo.png" alt="Learning Allied" class="logo-img">
      <span class="logo-text">Learning Allied</span>
    </a>
    <button class="sidebar-close" id="sidebarClose" type="button" aria-label="Close menu">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <button class="new-chat-btn" id="newChatBtn" type="button">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    New Chat
  </button>

  <nav class="nav-section" id="navSection">

    <div class="nav-label">Main</div>

    <a href="/home" data-nav="home" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>
      Home
      <span class="nav-badge" id="reviewBadge"></span>
    </a>

    <a href="/chat" data-nav="chat" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
      Chat
    </a>

    <a href="/study-session" data-nav="study-session" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>
      Study Session
      <span class="nav-badge green">New</span>
    </a>

    <a href="/planner" data-nav="planner" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg></span>
      Study Planner
    </a>

    <a href="/arena" data-nav="arena" class="nav-item" aria-label="Arena — Conquer your syllabus">
      <span class="nav-icon tone-sky"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 8a2 2 0 1 0 0 0"/></svg></span>
      Arena
      <span class="nav-badge sky">&#9876;</span>
    </a>

    <div class="nav-label">Account</div>

    <a href="/referral" data-nav="referral" class="nav-item">
      <span class="nav-icon tone-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
      Refer &amp; Earn
    </a>

    <a href="/subscription" data-nav="subscription" class="upgrade-nav-btn">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></span>
      Subscription
    </a>

    <a href="/profile" data-nav="profile" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
      Profile
    </a>

    <a href="/settings" data-nav="settings" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
      Settings
    </a>

  </nav>

  <div class="side-card-wrap">
    <div class="side-card side-card--syllabus" id="syllabusCard">
      <div class="side-card-icon side-card-icon--green">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </div>
      <div class="side-card-body">
        <div class="side-card-title" id="syllabusLabel">Upload syllabus</div>
        <div class="side-card-sub" id="syllabusSub">JPG, PNG, PDF &mdash; personalises plan</div>
      </div>
      <input type="file" id="syllabusFile" accept=".jpg,.jpeg,.png,.pdf" hidden>
      <button id="syllabusUploadBtn" class="side-card-btn side-card-btn--green" type="button">Upload</button>
    </div>
    <div id="syllabusProgress" class="side-card-progress" hidden></div>
  </div>

  <div class="side-card-wrap">
    <div class="side-card side-card--console">
      <div class="side-card-icon side-card-icon--blue">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/></svg>
      </div>
      <div class="side-card-body">
        <div class="side-card-title">AIConsole</div>
        <div class="side-card-sub">Study assistant</div>
      </div>
      <a href="/chat" class="side-card-btn side-card-btn--blue">Ask</a>
    </div>
  </div>

  <div class="sidebar-bottom">
    <button class="signout-btn" id="signOutBtn">Sign out</button>
    <div class="user-card">
      <div class="avatar" id="userAvatar">G</div>
      <div class="user-info">
        <div class="user-name" id="userName">Guest</div>
        <div class="user-plan" id="userPlan">Free Plan</div>
      </div>
    </div>
  </div>
</aside>
