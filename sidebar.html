<!--
  Learning Allied — sidebar
  =========================
  This is the ONE place the app nav is defined. To add / remove / reorder a nav
  item, edit the <nav> below. No JavaScript changes needed.

  How active highlighting works:
    Each link carries data-nav="<url-segment>". sidebar.js compares it against
    the current path and adds .active. So data-nav MUST match the href's last
    segment: href="/study-session" -> data-nav="study-session".

  Badges:            <span class="nav-badge">New</span>
  Icons:             all share one style (24px grid, 1.7 stroke, round caps), monochrome.

  NOTE: ids marked REQUIRED are read by other modules:
    navSection (home.js inserts recommendations),
    signOutBtn / userName / userPlan / userAvatar / reviewBadge (home.js).
    Renaming them will break those features.
-->

<div class="sidebar-overlay" id="sidebarOverlay"></div>

      <span class="logo-text">Learning Allied</span>
    </a>
    <button class="sidebar-close" id="sidebarClose" type="button" aria-label="Close menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>

      <span class="nav-text">Home</span>

    </a>

    <a href="/chat" data-nav="chat" class="nav-item">
