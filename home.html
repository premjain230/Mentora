<style>
 .main { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

 /* ---- Topbar ---- */
 .topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 56px; flex-shrink: 0;
  background: var(--bg-base); border-bottom: 1px solid var(--border-subtle);
 }
 .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
 .menu-btn {
  width: 32px; height: 32px; border-radius: var(--radius-md); border: none; background: transparent;
  color: var(--text-secondary); display: none; align-items: center; justify-content: center; cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
 }
 .menu-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
 .brand-mark { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: -0.01em; color: var(--text-primary); flex-shrink: 0; }
 .brand-mark img { width: 22px; height: 22px; border-radius: 6px; }
 .greeting { font-size: 13px; color: var(--text-secondary); margin-left: 6px; padding-left: 10px; border-left: 1px solid var(--border-subtle); white-space: nowrap; }
 .topbar-center { flex: 1; display: flex; justify-content: center; max-width: 420px; margin: 0 16px; }
 .topbar-search-wrap { position: relative; width: 100%; max-width: 340px; }
 .topbar-search-wrap input {
  width: 100%; height: 34px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 999px;
  padding: 0 34px 0 14px; font-size: 13px; color: var(--text-primary); outline: none;
  transition: border-color var(--dur-fast) var(--ease-out);
 }
 .topbar-search-wrap input:focus { border-color: var(--border-active); }
 .topbar-search-wrap input::placeholder { color: var(--text-faint); }
 .topbar-search-wrap svg { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text-muted); pointer-events: none; }
 .topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
 .chat-cta {
  display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px;
  border-radius: var(--radius-md); border: 1px solid var(--text-primary); background: var(--text-primary);
  color: var(--bg-base); font-size: 12.5px; font-weight: 600; cursor: pointer; text-decoration: none;
  transition: all var(--dur-fast) var(--ease-out);
 }
 .chat-cta:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
 .chat-cta svg { width: 14px; height: 14px; stroke-width: 2.2; }
 #topbarAvatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); cursor: pointer; }

 /* ---- Hub layout ---- */
 .chat-area {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 28px 20px 40px; display: flex; flex-direction: column; align-items: center;
  scroll-behavior: smooth; background: var(--bg-base);
 }
 .chat-area::-webkit-scrollbar { width: 5px; }
 .chat-area::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
 .chat-area::-webkit-scrollbar-track { background: transparent; }

 .hub-grid { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 760px; animation: fadeUp 0.5s var(--ease-out) both; }
 @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

 .hub-row-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 2px; }
 .hub-title { font-family: var(--font-display); font-size: 19px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary); }
 .hub-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
 .hub-link-pill { font-size: 11.5px; color: var(--accent); text-decoration: none; border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px; background: var(--bg-card); transition: all var(--dur-fast) var(--ease-out); }
 .hub-link-pill:hover { border-color: var(--border-strong); background: var(--bg-card-hover); }
 .hub-eyebrow { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
 .hub-tag { font-size: 10px; background: var(--bg-elevated); padding: 2px 8px; border-radius: 999px; color: var(--text-muted); }
 .hub-caption { font-size: 11px; color: var(--text-muted); }
 .hub-caption-center { font-size: 11px; color: var(--text-muted); text-align: center; }
 .hub-big-number { font-size: 20px; font-weight: 700; margin-top: 6px; color: var(--text-primary); }
 .hub-medium-label { font-size: 13px; font-weight: 600; margin-top: 6px; color: var(--text-primary); }
 .hub-gauge-wrap { width: 112px; height: 112px; display: grid; place-items: center; color: var(--text-muted); font-size: 12px; margin: 0 auto; }
 .hub-volume-chart { margin-top: 10px; height: 64px; }
 .hub-counts-row { display: flex; gap: 10px; font-size: 11px; color: var(--text-muted); margin-top: 4px; }
 .hub-bar-strip { margin-top: 10px; height: 8px; display: flex; gap: 2px; border-radius: 999px; overflow: hidden; background: var(--bg-elevated); }
 .hub-clickable { cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
 .hub-clickable:hover { border-color: var(--border-strong); transform: translateY(-1px); }
 .hub-clickable .hub-eyebrow { align-self: flex-start; }

 .cere-grid-3 { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 12px; }
 .cere-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
 .aq-graph-card { padding: 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); }

 /* ---- Mobile ---- */
 @media (max-width: 880px) {
  .menu-btn { display: flex; }
  .topbar { padding: 0 14px; height: 52px; }
  .topbar-center { display: none; }
  .greeting { display: none; }
  .chat-area { padding: 18px 12px 28px; }
  .cere-grid-3, .cere-grid { grid-template-columns: 1fr; }
  .chat-cta span { display: none; }
  .chat-cta { width: 32px; padding: 0; justify-content: center; }
 }

<script>
function resizeInput(input) {
 if (!input) return;
 input.style.height = 'auto';
 input.style.height = input.scrollHeight + 'px';
}
function fillPrompt(text) {
 try { sessionStorage.setItem('learning-allied-pending-prompt', text); sessionStorage.setItem('aquila_pending_prompt', text); } catch(e){}
 window.location.href = '/chat';
}
function runPrompt(text) { fillPrompt(text); }
function handleKey(e) {
 if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); }
}

(function(){
 var viewport = window.visualViewport;
 if (!viewport) return;
 function syncViewportHeight(){
  var target = document.activeElement;
  if (target && target.matches('input, textarea')) document.documentElement.style.setProperty('--app-height', viewport.height + 'px');
  else document.documentElement.style.removeProperty('--app-height');
 }
 document.addEventListener('focusin', syncViewportHeight);
 document.addEventListener('focusout', function(){ setTimeout(syncViewportHeight, 0); });
 viewport.addEventListener('resize', syncViewportHeight);
 syncViewportHeight();
}());

(function(){
 var chatArea = document.getElementById('chatArea');
 var control = document.getElementById('scrollControl');
 if (!chatArea) return;
 var bar = document.createElement('div');
 bar.className = 'scroll-progress';
 document.body.prepend(bar);
 var ticking = false;
 function updateScrollState(){
  ticking = false;
  var max = Math.max(0, chatArea.scrollHeight - chatArea.clientHeight);
  var top = Math.min(max, Math.max(0, chatArea.scrollTop));
  bar.style.width = max > 0 ? ((top / max) * 100) + '%' : '0%';
  if (!control) return;
  var scrollable = max > 8;
  var direction = top >= max - 48 || top > max * 0.55 ? 'up' : 'down';
  control.classList.toggle('visible', scrollable);
  control.dataset.direction = direction;
  var label = direction === 'up' ? 'Scroll to top' : 'Scroll to latest';
  control.setAttribute('aria-label', label);
  control.title = label;
 }
 function scheduleScrollUpdate(){
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(updateScrollState);
 }
 if (control) {
  control.addEventListener('click', function(){
   var max = Math.max(0, chatArea.scrollHeight - chatArea.clientHeight);
   var target = control.dataset.direction === 'up' ? 0 : max;
   chatArea.scrollTo({ top: target, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  });
 }
 chatArea.addEventListener('scroll', scheduleScrollUpdate, { passive: true });
 window.addEventListener('resize', scheduleScrollUpdate, { passive: true });
 if ('ResizeObserver' in window) new ResizeObserver(scheduleScrollUpdate).observe(chatArea);
 if ('MutationObserver' in window) new MutationObserver(scheduleScrollUpdate).observe(chatArea, { childList: true, subtree: true });
 scheduleScrollUpdate();
}());

(function(){
 var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(reduceMotion) return;
 document.querySelectorAll('.send-btn, .signout-btn, .new-chat-btn, .upgrade-nav-btn').forEach(function(btn){
  btn.addEventListener('click', function(e){
   var ripple = document.createElement('span');
   var r = btn.getBoundingClientRect();
   var size = Math.max(r.width, r.height);
   ripple.style.cssText = 'position:absolute;top:'+(e.clientY-r.top-size/2)+'px;left:'+(e.clientX-r.left-size/2)+'px;width:'+size+'px;height:'+size+'px;border-radius:50%;background:rgba(255,255,255,0.15);transform:scale(0);animation:rippleAnim 0.5s ease-out;pointer-events:none;z-index:0;';
   btn.style.position = 'relative';
   btn.style.overflow = 'hidden';
   btn.appendChild(ripple);
   setTimeout(function(){ ripple.remove(); }, 600);
  });
 });
}());
</script>
