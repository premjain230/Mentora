<!DOCTYPE html>
<html lang="en">
<script>document.documentElement.className=localStorage.getItem('aquila-theme')==='light'?'light-mode':''</script>
<head>
<meta charset="UTF-8" /> 
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.googletagmanager.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://esm.sh https://www.gstatic.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://analytics.vercel.com; object-src 'none'; frame-src 'none';">
<title>Aquila AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link href="css/design-system.css" rel="stylesheet" />
<style>
  /* ── Chat area ── */
  .chat-area { flex: 1; overflow-y: auto; padding: 36px 60px 20px; display: flex; flex-direction: column; gap: 26px; }

  .welcome {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 36px 20px 20px; gap: 16px; max-width: 680px; margin: 0 auto; width: 100%;
    animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
  }
  .welcome-icon {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, rgba(0,212,255,0.16), rgba(167,139,250,0.16));
    border: 1px solid rgba(0,212,255,0.28);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 6px;
    box-shadow: 0 8px 28px rgba(0,212,255,0.16);
    position: relative;
    color: var(--cyan);
  }
  .welcome-icon::after {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 26px;
    background: radial-gradient(circle, rgba(0,212,255,0.16), transparent 70%);
    animation: breathe 3.6s ease-in-out infinite;
    z-index: -1;
  }
  .welcome-icon svg { width: 30px; height: 30px; }
  .welcome h1 {
    font-size: 30px; font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--text) 40%, var(--violet));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .welcome p { font-size: 15px; color: var(--text-secondary); max-width: 440px; line-height: 1.7; font-weight: 300; }

  .suggestion-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 640px; margin-top: 8px; }
  .suggestion-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; cursor: pointer; text-align: left; transition: all 0.2s;
  }
  .suggestion-card:hover { border-color: rgba(0,212,255,0.32); background: var(--bg-input); transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,0.25); }
  .sug-icon { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.16); color: var(--cyan); }
  .suggestion-card:nth-child(even) .sug-icon { background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.2); color: var(--violet); }
  .sug-icon svg { width: 16px; height: 16px; }
  .sug-title { font-size: 13.5px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
  .sug-desc { font-size: 12px; color: var(--text-muted); }

  /* ── Input area ── */
  .input-area { padding: 16px 60px 22px; border-top: 1px solid var(--border); }
  .input-box {
    max-width: 720px; margin: 0 auto;
    background: var(--bg-input); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px 16px; display: flex; align-items: flex-end; gap: 10px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-box:focus-within { border-color: rgba(0,212,255,0.4); box-shadow: 0 0 0 3px rgba(0,212,255,0.10); }
  .input-box textarea {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-family: var(--font-sans); font-size: 14.5px;
    resize: none; line-height: 1.5; min-height: 24px; max-height: 140px; overflow-y: auto;
  }
  .input-box textarea::placeholder { color: var(--text-muted); }
  .input-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .send-btn {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--cyan); border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #06121a;
    transition: all 0.18s; flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(0,212,255,0.35);
  }
  .send-btn:hover { background: #33ddff; transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }
  .send-btn svg { width: 16px; height: 16px; }

  .input-footer {
    display: flex; justify-content: center; margin-top: 10px;
    font-size: 11.5px; color: var(--text-muted); gap: 20px;
    max-width: 720px; margin-left: auto; margin-right: auto; text-align: center;
  }
  .input-footer span { display: flex; align-items: center; gap: 5px; }

  /* ── Messages ── */
  .message-row { display: flex; padding: 0 20px; }
  .message-row.user { justify-content: flex-end; }
  .message-row.assistant { gap: 12px; align-items: flex-start; }

  .user-bubble {
    background: var(--bg-input); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px 14px 4px 14px;
    padding: 12px 16px; max-width: 72%;
    font-size: 14px; line-height: 1.65; color: var(--text);
    word-break: break-word; white-space: pre-wrap;
  }
  .assistant-avatar {
    width: 30px; height: 30px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    margin-top: 2px; color: #06121a;
  }
  .assistant-avatar svg { width: 16px; height: 16px; }
  .ai-bubble { flex: 1; font-size: 14px; line-height: 1.75; color: var(--text-secondary); word-break: break-word; min-width: 0; }
  .ai-bubble h1 { font-size: 18px; font-weight: 700; margin: 14px 0 8px; color: var(--text); }
  .ai-bubble h2 { font-size: 16px; font-weight: 600; margin: 12px 0 6px; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .ai-bubble h3 { font-size: 14px; font-weight: 600; margin: 10px 0 4px; color: var(--text); }
  .ai-bubble strong { color: var(--text); font-weight: 600; }
  .ai-bubble ul, .ai-bubble ol { padding-left: 20px; margin: 6px 0; }
  .ai-bubble li { margin: 4px 0; }
  .ai-bubble code { background: rgba(0,212,255,0.12); border-radius: 4px; padding: 2px 6px; font-family: var(--font-mono); font-size: 12px; color: var(--violet); }
  .ai-bubble pre { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 10px 0; max-width: 100%; }
  .ai-bubble pre code { background: none; padding: 0; color: var(--text-secondary); font-size: 12.5px; }
  .ai-bubble hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .ai-bubble p { margin: 6px 0; }

  /* ── AI Action Buttons ── */
  .ai-actions { display: flex; align-items: center; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
  .ai-action-btn {
    display: flex; align-items: center; gap: 5px; padding: 5px 11px; font-size: 12px;
    font-family: var(--font-sans); font-weight: 400; border-radius: 8px;
    border: 1px solid var(--border); background: transparent; color: var(--text-muted);
    cursor: pointer; transition: all 0.15s; line-height: 1;
  }
  .ai-action-btn:hover { color: var(--text-secondary); border-color: var(--border-strong); background: rgba(255,255,255,0.04); }
  .ai-action-btn.active-good  { color: var(--cyan);  border-color: rgba(0,212,255,0.4);  background: rgba(0,212,255,0.08); }
  .ai-action-btn.active-bad   { color: var(--red);   border-color: rgba(255,107,107,0.4); background: rgba(255,107,107,0.08); }
  .ai-action-btn.active-copy  { color: var(--cyan);  border-color: rgba(0,212,255,0.4);  background: rgba(0,212,255,0.08); }
  .ai-action-btn.active-share { color: var(--violet); border-color: rgba(167,139,250,0.4); background: rgba(167,139,250,0.08); }
  .ai-action-divider { width: 1px; height: 16px; background: var(--border); flex-shrink: 0; margin: 0 2px; }
  .cursor-blink { display: inline-block; width: 2px; height: 15px; background: var(--cyan); border-radius: 2px; margin-left: 2px; vertical-align: middle; animation: blink .7s step-end infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  @media (max-width: 880px) {
    .chat-area { padding: 22px 14px 16px; }
    .input-area { padding: 12px 14px 16px; }
    .suggestion-grid { grid-template-columns: 1fr; }
    .user-bubble { max-width: 88%; }
    .welcome { padding: 20px 8px 14px; gap: 12px; }
    .welcome h1 { font-size: 24px; }
    .welcome p { font-size: 13.5px; }
    .welcome-icon { width: 54px; height: 54px; border-radius: 16px; }
    .welcome-icon svg { width: 26px; height: 26px; }
    .message-row { padding: 0 4px; }
    .input-footer { flex-direction: column; gap: 4px; }
  }
  .focus-toggle {
    width: 36px; height: 36px; border-radius: 10px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-muted); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.18s;
  }
  .focus-toggle:hover { color: var(--text-secondary); border-color: var(--border-hover); }
  @media (max-width: 420px) { .topbar-mobile-logo span.full { display: none; } }

  /* ── Focus Mode ── */
  body.focus-mode .welcome { display: none; }
  body.focus-mode .suggestion-grid { display: none; }
  body.focus-mode .input-footer span:not(.model-info) { display: none; }
  body.focus-mode .focus-toggle { color: var(--cyan); border-color: rgba(0,212,255,0.4); background: rgba(0,212,255,0.08); }
</style>
</head>

      </button>

    <div class="topbar-right">

  </div>
  <div class="chat-area" id="chatArea"></div>
  <div class="input-area">
    <div class="input-box">
      <textarea id="chatInput" rows="1" placeholder="Ask Aquila AI anything — explain, analyze, or plan your study..." oninput="resizeInput(this)" onkeydown="handleKey(event)"></textarea>
      <div class="input-actions">
        <button class="send-btn" id="sendBtn" title="Send" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
    <div class="input-footer">
      <span>Encrypted in transit</span>
      <span>Aquila AI can make mistakes — verify important answers</span>
    </div>
  </div>
</main>

</div><!-- /main-layout -->

<!-- ===== Non-module helpers (must stay plain script for inline onXxx handlers) ===== -->
<script>
function resizeInput(input) {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
}
function fillPrompt(text) {
  const input = document.getElementById('chatInput');
  input.value = text;
  resizeInput(input);
  input.focus();
}
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function toggleFocus() {
  document.body.classList.toggle('focus-mode');
  localStorage.setItem('mentora-focus-mode', document.body.classList.contains('focus-mode'));
}
if (localStorage.getItem('mentora-focus-mode') === 'true') document.body.classList.add('focus-mode');

/* ── Keyboard shortcuts ── */
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
    e.preventDefault(); document.getElementById('chatInput')?.focus();
  }
  if (e.key === 'Escape') {
    const s = document.getElementById('sidebar');
    if (s?.classList.contains('open')) { s.classList.remove('open'); document.getElementById('sidebarOverlay')?.classList.remove('open'); }
  }
});
</script>
