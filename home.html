<!DOCTYPE html>
<html lang="en">
<script>document.documentElement.className=localStorage.getItem('aquila-theme')==='light'?'light-mode':''</script>
<head>
<meta charset="UTF-8" /> 
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.googletagmanager.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://analytics.vercel.com; object-src 'none'; frame-src 'none';">
<meta name="description" content="Aquila AI — your personalized AI study assistant for JEE, NEET & Board exams." />
<link rel="canonical" href="https://aquila-ai.vercel.app/home.html" />
<title>Aquila AI</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-base: #0a0b0f;
    --bg-sidebar: #0f1117;
    --bg-card: #1a1d27;
    --bg-input: #1e2130;
    --accent: #00d4ff;
    --accent2: #a78bfa;
    --accent3: #ff6b6b;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(0,212,255,0.4);
    --text-primary: #f0f0f8;
    --text-secondary: #8b8fa8;
    --text-muted: #4a4d62;
    --font-main: 'Sora', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --sidebar-w: 248px;
  }
  .light-mode {
    --bg-base: #f4f5f9;
    --bg-sidebar: #ecedf2;
    --bg-card: #ffffff;
    --bg-input: #f0f1f5;
    --border: rgba(0,0,0,0.08);
    --text-primary: #16162a;
    --text-secondary: #5a5d72;
    --text-muted: #9ea0b4;
  }

  html, body { height: 100%; }
  body {
    font-family: var(--font-main);
    background: var(--bg-base);
    color: var(--text-primary);
    transition: background 0.35s ease, color 0.35s ease;
    height: 100vh;
    display: flex;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(640px 420px at 14% -6%, rgba(0,212,255,0.09), transparent 62%),
      radial-gradient(560px 420px at 92% 6%, rgba(167,139,250,0.08), transparent 60%);
  }

  svg { display: block; }

  /* ===== Sidebar ===== */
  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 30;
    transition: margin-left 0.32s cubic-bezier(0.16,1,0.3,1), box-shadow 0.32s;
  }

  .logo-area { padding: 20px 18px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
  .logo-icon { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; }
  .logo-icon svg { width: 100%; height: 100%; }
  .logo-text { font-size: 17px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.3px; }
  .logo-text span { color: var(--accent); }
.logo-img { height: 34px; width: auto; display: block; }

  .sidebar-close {
    display: none;
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    color: var(--text-secondary);
    align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  .new-chat-btn {
    margin: 16px 14px 8px;
    background: rgba(0,212,255,0.1);
    border: 1px solid rgba(0,212,255,0.25);
    color: var(--accent);
    font-family: var(--font-main);
    font-size: 13px; font-weight: 500;
    padding: 10px 14px; border-radius: 10px;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: all 0.2s;
    width: calc(100% - 28px);
  }
  .new-chat-btn:hover { background: rgba(0,212,255,0.18); border-color: rgba(0,212,255,0.5); }
  .new-chat-btn svg { flex-shrink: 0; }

  .nav-section { padding: 6px 10px; flex: 1; overflow-y: auto; }
  .nav-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.4px; color: var(--text-muted); padding: 14px 8px 6px; }

  .nav-item {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 12px; border-radius: 10px;
    cursor: pointer; font-size: 13.5px;
    color: var(--text-secondary);
    transition: all 0.18s;
    margin-bottom: 2px;
    border: 1px solid transparent;
    user-select: none;
    text-decoration: none;
  }
  .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text-primary); }
  .nav-item.active { background: rgba(0,212,255,0.08); color: var(--text-primary); border-color: rgba(0,212,255,0.2); }
  .nav-item.active .nav-icon { color: var(--accent); }
  .nav-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-secondary); }
  .nav-item:hover .nav-icon { color: var(--text-primary); }
  .nav-badge { margin-left: auto; background: var(--accent3); color: white; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 20px; font-family: var(--font-mono); }
  .nav-badge.green { background: var(--accent2); color: #16122b; }
  .nav-badge.purple { background: var(--accent2); color: #0a0b0f; }
  .nav-group-children { overflow: hidden; max-height: 0; transition: max-height 0.3s ease; }
  .nav-group-children.open { max-height: 200px; }
  .nav-group-toggle { cursor: pointer; }
  .nav-group-chevron { margin-left: auto; transition: transform 0.3s; font-size: 10px; color: var(--text-muted); }
  .nav-group-toggle.open .nav-group-chevron { transform: rotate(180deg); }
  .nav-group-item { padding-left: 36px !important; }

  .upgrade-nav-btn {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 12px; border-radius: 10px;
    cursor: pointer; font-size: 13.5px; font-weight: 600;
    color: var(--accent2);
    background: rgba(167,139,250,0.08);
    border: 1px solid rgba(167,139,250,0.2);
    margin-bottom: 2px; text-decoration: none;
    transition: all 0.18s;
  }
  .upgrade-nav-btn:hover { background: rgba(167,139,250,0.14); border-color: rgba(167,139,250,0.4); }

  .nav-item.chat-history-item {
    font-size: 12.5px;
    color: var(--text-muted);
    padding: 8px 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
  }
  .nav-item.chat-history-item:hover { color: var(--text-secondary); background: rgba(255,255,255,0.03); }
  .nav-item.chat-history-item.active { color: var(--text-primary); background: rgba(0,212,255,0.08); border-color: rgba(0,212,255,0.2); }

  .sidebar-bottom { padding: 12px 10px; border-top: 1px solid var(--border); }
  .user-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; }
  .signout-btn { width: calc(100% - 20px); margin: 0 10px 8px; padding: 9px 14px; background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.2); color: var(--accent3); font-family: var(--font-main); font-size: 12px; font-weight: 500; border-radius: 8px; cursor: pointer; transition: all 0.18s; }
  .signout-btn:hover { background: rgba(255,107,107,0.15); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #00d4ff, #a78bfa); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; overflow: hidden; color: #06121a; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 13px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-plan { font-size: 11px; color: var(--accent); font-weight: 500; }

  .sidebar-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(2px);
    z-index: 25;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.28s, visibility 0.28s;
    pointer-events: none;
  }

  /* ===== Main ===== */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-base); position: relative; z-index: 1; min-width: 0; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
    backdrop-filter: blur(6px);
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }

  .menu-btn {
    display: none;
    width: 38px; height: 38px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.18s;
  }
  .menu-btn:hover { color: var(--text-primary); border-color: var(--border-hover); }

  .model-selector {
    display: flex; align-items: center; gap: 7px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 13px;
    font-size: 13px;
    color: var(--text-secondary);
    user-select: none;
    font-weight: 500;
    white-space: nowrap;
  }
  .model-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); flex-shrink: 0; }

  .topbar-mobile-logo {
    display: none;
    align-items: center; gap: 8px;
    font-size: 15px; font-weight: 700;
    color: var(--text-primary);
  }
  .topbar-mobile-logo .logo-icon { width: 28px; height: 28px; border-radius: 8px; }
  .topbar-mobile-logo span { color: var(--accent); }

  /* ===== Chat area ===== */
  .chat-area { flex: 1; overflow-y: auto; padding: 36px 60px 20px; display: flex; flex-direction: column; gap: 26px; }
  .chat-area::-webkit-scrollbar, .nav-section::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb, .nav-section::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .welcome {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 36px 20px 20px; gap: 16px; max-width: 680px; margin: 0 auto; width: 100%;
    animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  .welcome-icon {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, rgba(0,212,255,0.16), rgba(167,139,250,0.16));
    border: 1px solid rgba(0,212,255,0.28);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 6px;
    box-shadow: 0 8px 28px rgba(0,212,255,0.16);
    position: relative;
    color: var(--accent);
  }
  .welcome-icon::after {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 26px;
    background: radial-gradient(circle, rgba(0,212,255,0.16), transparent 70%);
    animation: breathe 3.6s ease-in-out infinite;
    z-index: -1;
  }
  @keyframes breathe { 0%, 100% { opacity: 0.5; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1.04); } }
  .welcome-icon svg { width: 30px; height: 30px; }

  .welcome h1 {
    font-size: 30px; font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(135deg, #f0f0f8 40%, var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .welcome p { font-size: 15px; color: var(--text-secondary); max-width: 440px; line-height: 1.7; font-weight: 300; }

  .suggestion-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 640px; margin-top: 8px; }
  .suggestion-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; cursor: pointer; text-align: left; transition: all 0.2s;
  }
  .suggestion-card:hover { border-color: rgba(0,212,255,0.32); background: #1e2130; transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,0.25); }
  .sug-icon { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.16); color: var(--accent); }
  .suggestion-card:nth-child(2) .sug-icon, .suggestion-card:nth-child(4) .sug-icon { background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.2); color: var(--accent2); }
  .sug-icon svg { width: 16px; height: 16px; }
  .sug-title { font-size: 13.5px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; }
  .sug-desc { font-size: 12px; color: var(--text-muted); }

  /* ===== Input area ===== */
  .input-area { padding: 16px 60px 22px; border-top: 1px solid var(--border); }
  .input-box {
    max-width: 720px; margin: 0 auto;
    background: var(--bg-input); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px 16px; display: flex; align-items: flex-end; gap: 10px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-box:focus-within { border-color: rgba(0,212,255,0.4); box-shadow: 0 0 0 3px rgba(0,212,255,0.10); }
  .input-box textarea {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text-primary); font-family: var(--font-main); font-size: 14.5px;
    resize: none; line-height: 1.5; min-height: 24px; max-height: 140px; overflow-y: auto;
  }
  .input-box textarea::placeholder { color: var(--text-muted); }
  .input-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .send-btn {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--accent); border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #06121a;
    transition: all 0.18s; flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(0,212,255,0.35);
  }
  .send-btn:hover { background: #33ddff; transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }
  .send-btn svg { width: 16px; height: 16px; }

  .input-footer {
    display: flex; justify-content: center; margin-top: 10px;
    font-size: 11.5px; color: var(--text-muted); gap: 20px;
    max-width: 720px; margin-left: auto; margin-right: auto; text-align: center;
  }
  .input-footer span { display: flex; align-items: center; gap: 5px; }

  /* ===== Messages ===== */
  .message-row { display: flex; padding: 0 20px; }
  .message-row.user { justify-content: flex-end; }
  .message-row.assistant { gap: 12px; align-items: flex-start; }

  .user-bubble {
    background: #1e2130; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px 14px 4px 14px;
    padding: 12px 16px; max-width: 72%;
    font-size: 14px; line-height: 1.65; color: #f0f0f8;
    word-break: break-word; white-space: pre-wrap;
  }
  .assistant-avatar {
    width: 30px; height: 30px; flex-shrink: 0;
    background: linear-gradient(135deg,#00d4ff,#a78bfa);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    margin-top: 2px; color: #06121a;
  }
  .assistant-avatar svg { width: 16px; height: 16px; }
  .ai-bubble { flex: 1; font-size: 14px; line-height: 1.75; color: #e8ecf0; word-break: break-word; min-width: 0; }
  .ai-bubble h1 { font-size: 18px; font-weight: 700; margin: 14px 0 8px; color: #f0f0f8; }
  .ai-bubble h2 { font-size: 16px; font-weight: 600; margin: 12px 0 6px; color: #f0f0f8; border-bottom: 1px solid rgba(255,255,255,0.07); padding-bottom: 4px; }
  .ai-bubble h3 { font-size: 14px; font-weight: 600; margin: 10px 0 4px; color: #f0f0f8; }
  .ai-bubble strong { color: #f0f0f8; font-weight: 600; }
  .ai-bubble ul, .ai-bubble ol { padding-left: 20px; margin: 6px 0; }
  .ai-bubble li { margin: 4px 0; }
  .ai-bubble code { background: rgba(0,212,255,0.12); border-radius: 4px; padding: 2px 6px; font-family: var(--font-mono); font-size: 12px; color: #a78bfa; }
  .ai-bubble pre { background: #1a1d27; border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 10px 0; max-width: 100%; }
  .ai-bubble pre code { background: none; padding: 0; color: #e8ecf0; font-size: 12.5px; }
  .ai-bubble hr { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 14px 0; }
  .ai-bubble p { margin: 6px 0; }

  /* ===== AI Action Buttons ===== */
  .ai-actions {
    display: flex; align-items: center; gap: 6px;
    margin-top: 14px; flex-wrap: wrap;
  }
  .ai-action-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 11px; font-size: 12px;
    font-family: var(--font-main); font-weight: 400;
    border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);
    background: transparent; color: var(--text-muted);
    cursor: pointer; transition: all 0.15s; line-height: 1;
  }
  .ai-action-btn svg { flex-shrink: 0; transition: all 0.15s; }
  .ai-action-btn:hover { color: var(--text-secondary); border-color: rgba(255,255,255,0.16); background: rgba(255,255,255,0.04); }
  .ai-action-btn.active-good  { color: var(--accent);  border-color: rgba(0,212,255,0.4);    background: rgba(0,212,255,0.08); }
  .ai-action-btn.active-bad   { color: var(--accent3); border-color: rgba(255,107,107,0.4); background: rgba(255,107,107,0.08); }
  .ai-action-btn.active-copy  { color: var(--accent);  border-color: rgba(0,212,255,0.4);    background: rgba(0,212,255,0.08); }
  .ai-action-btn.active-share { color: var(--accent2); border-color: rgba(167,139,250,0.4);  background: rgba(167,139,250,0.08); }
  .ai-action-divider { width: 1px; height: 16px; background: rgba(255,255,255,0.08); flex-shrink: 0; margin: 0 2px; }

  /* ===== Chat history loading state ===== */
  .chat-loading { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 40px 20px; color: var(--text-muted); font-size: 13px; }
  .chat-loading-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: aquilaDot 1.2s ease-in-out infinite; }
  .chat-loading-dot:nth-child(2) { animation-delay: 180ms; }
  .chat-loading-dot:nth-child(3) { animation-delay: 360ms; }
  @keyframes aquilaDot { 0%,80%,100%{ transform:translateY(0);opacity:.4; } 40%{ transform:translateY(-5px);opacity:1; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  a:focus-visible, button:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ===== Mobile ===== */
  @media (max-width: 880px) {
    .sidebar { position: fixed; top: 0; left: 0; bottom: 0; margin-left: calc(-1 * var(--sidebar-w)); box-shadow: none; }
    .sidebar.open { margin-left: 0; box-shadow: 24px 0 60px rgba(0,0,0,0.45); }
    .sidebar-close { display: flex; }
    .sidebar-overlay.open { opacity: 1; visibility: visible; pointer-events: all; }
    .menu-btn { display: flex; }
    .topbar-mobile-logo { display: flex; }
    .topbar { padding: 12px 14px; }
    .chat-area { padding: 22px 14px 16px; }
    .input-area { padding: 12px 14px 16px; }
    .suggestion-grid { grid-template-columns: 1fr; }
    .user-bubble { max-width: 88%; }
    .welcome { padding: 20px 8px 14px; gap: 12px; }
    .welcome h1 { font-size: 24px; }
    .welcome p { font-size: 13.5px; }
    .welcome-icon { width: 54px; height: 54px; border-radius: 16px; }
    .welcome-icon svg { width: 26px; height: 26px; }
    .message-row { padding: 0 4px; }
    .input-footer { flex-direction: column; gap: 4px; }
  }
  @media (max-width: 420px) { .topbar-mobile-logo span.full { display: none; } }
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="logo-area">
    <a href="index.html" class="logo">
      <img src="logo.png" alt="Aquila AI" class="logo-img">
      <span class="logo-text">Aquila AI</span>
    </a>
    <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

<!-- ===== Non-module helpers (must stay plain script for inline onXxx handlers) ===== -->
<script>
function resizeInput(input) {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
}
function fillPrompt(text) {
  const input = document.getElementById('chatInput');
  input.value = text;
  resizeInput(input);
  input.focus();
}
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

/* ── Mobile sidebar ── */
const sidebar         = document.getElementById('sidebar');
const sidebarOverlay  = document.getElementById('sidebarOverlay');
const menuBtn         = document.getElementById('menuBtn');
const sidebarCloseBtn = document.getElementById('sidebarClose');

function openSidebar()  { sidebar.classList.add('open');    sidebarOverlay.classList.add('open'); }
function closeSidebar() { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('open'); }

menuBtn.addEventListener('click', openSidebar);
sidebarCloseBtn.addEventListener('click', closeSidebar);
sidebarOverlay.addEventListener('click', closeSidebar);

document.querySelectorAll('.nav-item:not(.nav-group-toggle)').forEach((link) => {
  link.addEventListener('click', () => { if (window.innerWidth <= 880) closeSidebar(); });
});

function toggleNavGroup(el) {
  el.classList.toggle('open');
  const children = el.nextElementSibling;
  if (children) children.classList.toggle('open');
}
</script>
