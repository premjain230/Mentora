<style>
/* Class names below are rendered by chat.js / home.js. Keep them. */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes learningAlliedSplashDot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}

/* Auth gate: hide the dashboard until home.js adds auth-ready */
body.auth-loading .main,
body.auth-loading .sidebar,
body.auth-loading .sidebar-overlay{visibility:hidden;opacity:0}
#authSplash{position:fixed;inset:0;z-index:100;background:var(--bg-base,#0a0b0f);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
body.auth-loading #authSplash{display:flex}
#authSplash .dot{width:8px;height:8px;border-radius:50%;background:var(--accent,#00d4ff);display:inline-block;animation:learningAlliedSplashDot 1.2s ease-in-out infinite}
.splash-dots{display:flex;gap:5px;align-items:center}
.splash-label{font-size:13px;color:var(--text-muted,#71717a)}

/* Topbar */
.topbar{background:var(--bg-base);border-bottom:1px solid var(--border-subtle)}
#topbarGreeting{font-size:14px;font-weight:500;color:var(--text-secondary);margin-left:8px}
.topbar-center{flex:1;display:flex;justify-content:center;max-width:480px;margin:0 16px}
.topbar-search{position:relative;width:100%;max-width:360px}
.topbar-search input{width:100%;height:36px;background:var(--bg-card);border:1px solid var(--border);border-radius:999px;padding:0 38px 0 14px;font:400 13px var(--font-main);color:var(--text-primary);transition:border-color .2s}
.topbar-search input::placeholder{color:var(--text-faint)}
.topbar-search input:focus{outline:none;border-color:var(--border-active)}
.topbar-search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-muted);pointer-events:none}
.topbar-right{display:flex;align-items:center;gap:12px}
.icon-btn{width:36px;height:36px;border-radius:999px;background:var(--bg-card);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-muted);cursor:pointer;transition:color .2s,border-color .2s}
.icon-btn:hover{color:var(--text-primary);border-color:var(--border-strong)}
#topbarAvatar{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
:where(.icon-btn,.send-btn,.suggestion-card,.ai-action-btn):focus-visible,
.topbar-search input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Chat area */
.chat-area{flex:1;overflow-y:auto;padding:32px 48px 24px;display:flex;flex-direction:column;gap:24px;scroll-behavior:smooth;background:var(--bg-base)}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px}
.chat-loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:40px 20px;color:var(--text-muted);font-size:13px}

/* Empty state */
.welcome{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 20px 16px;gap:14px;max-width:720px;margin:0 auto;width:100%;animation:fadeUp .5s var(--ease-out) both}
.welcome-icon{width:52px;height:52px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;color:var(--text-primary)}
.welcome-icon svg{width:24px;height:24px;stroke-width:1.7}
.welcome h1{font-family:var(--font-display);font-size:28px;font-weight:600;letter-spacing:-.035em;line-height:1.2;color:var(--text-primary)}
.welcome p{font-size:15px;color:var(--text-secondary);max-width:460px;line-height:1.6}
.suggestion-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:640px;margin-top:12px}
.suggestion-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;cursor:pointer;text-align:left;transition:border-color .2s,background .2s,transform .2s}
.suggestion-card:hover{background:var(--bg-card-hover);border-color:var(--border-strong);transform:translateY(-1px)}
.suggestion-card:active{transform:none}
.sug-icon{width:30px;height:30px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-muted)}
.sug-icon svg{width:15px;height:15px;stroke-width:1.7}
.sug-title{font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:3px;letter-spacing:-.01em}
.sug-desc{font-size:12.5px;color:var(--text-muted);line-height:1.5}

/* Messages */
.message-row{display:flex;padding:0 16px;max-width:740px;margin:0 auto;width:100%}
.message-row.user{justify-content:flex-end}
.message-row.assistant{gap:14px;align-items:flex-start}
.user-bubble{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-lg);border-bottom-right-radius:var(--radius-sm);padding:10px 14px;max-width:68%;font-size:14.5px;line-height:1.6;color:var(--text-primary);word-break:break-word;white-space:pre-wrap}
.assistant-avatar{width:28px;height:28px;flex-shrink:0;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;margin-top:2px;color:var(--text-muted);font-size:12px;font-weight:700}
.ai-bubble{flex:1;min-width:0;font-size:14.5px;line-height:1.7;color:var(--text-primary);word-break:break-word}
.ai-bubble h1{font-family:var(--font-display);font-size:19px;font-weight:600;margin:16px 0 8px;letter-spacing:-.02em}
.ai-bubble h2{font-family:var(--font-display);font-size:16px;font-weight:600;margin:14px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--border-subtle)}
.ai-bubble h3{font-size:14.5px;font-weight:600;margin:12px 0 6px}
.ai-bubble strong{font-weight:600}
.ai-bubble p{margin:8px 0}
.ai-bubble ul,.ai-bubble ol{padding-left:20px;margin:8px 0}
.ai-bubble li{margin:4px 0;color:var(--text-secondary)}
.ai-bubble li::marker{color:var(--text-muted)}
.ai-bubble code{background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:6px;padding:1px 6px;font-family:var(--font-mono);font-size:12.5px}
.ai-bubble pre{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;overflow-x:auto;margin:12px 0;max-width:100%}
.ai-bubble pre code{background:none;border:0;padding:0;font-size:13px}
.ai-bubble hr{border:0;border-top:1px solid var(--border-subtle);margin:16px 0}
.ai-bubble a{color:var(--accent);font-weight:500;border-bottom:1px solid transparent;transition:border-color .2s}
.ai-bubble a:hover{border-bottom-color:var(--accent)}
.ai-actions{display:flex;align-items:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.ai-action-btn{display:flex;align-items:center;gap:5px;padding:6px 10px;font:450 12px/1 var(--font-main);border-radius:var(--radius-full);border:1px solid var(--border);background:var(--bg-card);color:var(--text-muted);cursor:pointer;transition:color .2s,border-color .2s,background .2s}
.ai-action-btn:hover{color:var(--text-primary);border-color:var(--border-strong);background:var(--bg-elevated)}
.ai-action-btn.active-good,.ai-action-btn.active-copy{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.ai-action-btn.active-bad{color:var(--accent3);border-color:var(--accent3);background:transparent}
.ai-action-divider{width:1px;height:14px;background:var(--border);margin:0 2px}

/* Composer */
.input-area{padding:14px 32px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border-subtle);background:var(--bg-base)}
.input-box{max-width:720px;margin:0 auto;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-xl);padding:10px 12px 10px 18px;display:flex;align-items:flex-end;gap:8px;transition:border-color .2s,box-shadow .2s}
.input-box:focus-within{border-color:var(--border-active);box-shadow:var(--shadow-glow)}
.input-box textarea{flex:1;background:transparent;border:0;outline:0;color:var(--text-primary);font:400 15px/1.6 var(--font-main);resize:none;min-height:24px;max-height:140px;overflow-y:auto;padding:6px 0}
.input-box textarea::placeholder{color:var(--text-faint)}
.input-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.send-btn{width:36px;height:36px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--text-primary);border:0;color:var(--bg-base);transition:opacity .2s,transform .2s}
.send-btn:hover{opacity:.85;transform:translateY(-1px)}
.send-btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.send-btn svg{width:15px;height:15px;stroke-width:2.2}
.input-footer{max-width:720px;margin:10px auto 0;text-align:center;font-size:12px;color:var(--text-faint)}

.cere-grid-3{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:12px}
.cere-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

@media(max-width:880px){
  .chat-area{padding:20px 16px 16px;gap:20px}
  .input-area{padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px))}
  .suggestion-grid{grid-template-columns:1fr;gap:8px}
  .cere-grid-3,.cere-grid{grid-template-columns:1fr}
  .topbar-center{display:none}
  .user-bubble{max-width:84%}
  .welcome{padding:28px 8px 14px}
  .welcome h1{font-size:24px}
  .message-row{padding:0 4px;max-width:100%}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body class="auth-loading">

<div id="authSplash" role="status" aria-label="Loading">
  <div class="splash-dots"><span class="dot"></span><span class="dot" style="animation-delay:150ms"></span><span class="dot" style="animation-delay:300ms"></span></div>
  <div class="splash-label">Loading Learning Allied</div>
</div>

<div id="sidebarMount"></div>
<script type="module">
  import { mountSidebar } from "./js/components/sidebar.js";
  import { initSyllabusUpload } from "./js/syllabus.js";
  import { auth, db } from "./firebase-config.js";
  mountSidebar();
  initSyllabusUpload({ auth, db });
</script>

<main class="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-mobile-logo"><img src="logo.svg" alt="" class="logo-img" width="28" height="28"><span class="logo-text">Learning Allied</span></div>
      <div style="display:none;" class="model-selector"><span class="model-dot"></span>Learning Allied</div>
      <div id="topbarGreeting">Hi, <span id="greetingName">there</span></div>
    </div>
    <div class="topbar-center">
      <div class="topbar-search">
        <input id="topbarSearch" type="search" placeholder="Search" aria-label="Search" />
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      </div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" aria-label="Notifications" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7-6 11-6 11s-6-4-6-11"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
      <img id="topbarAvatar" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" data-pending-avatar="1" alt="Your profile photo" width="32" height="32" />
    </div>
  </header>

  <div class="chat-area" id="chatArea" aria-live="polite"></div>

  <div class="input-area">
    <div class="input-box">
      <textarea id="chatInput" rows="1" aria-label="Message Learning Allied" placeholder="Ask a question or paste something you're studying" oninput="resizeInput(this)" onkeydown="handleKey(event)"></textarea>
      <div class="input-actions">
        <button class="send-btn" id="sendBtn" title="Send" aria-label="Send message" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
    <p class="input-footer">Learning Allied can make mistakes. Check important facts against your textbooks.</p>
  </div>
</main>

<!-- Plain script: inline onXxx handlers above need these on window -->
<script>
function resizeInput(input){input.style.height='auto';input.style.height=input.scrollHeight+'px'}
function fillPrompt(text){var i=document.getElementById('chatInput');i.value=text;resizeInput(i);i.focus()}
function runPrompt(text){var i=document.getElementById('chatInput');i.value=text;resizeInput(i);sendMessage()}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}

/* Focus the input on desktop only, to avoid the mobile keyboard popping up */
(function(){
  if(window.matchMedia('(pointer: coarse)').matches) return;
  window.addEventListener('load',function(){
    var i=document.getElementById('chatInput');
    if(i&&!i.value) setTimeout(function(){i.focus({preventScroll:true})},450);
  });
}());
</script>
