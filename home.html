<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /> 
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mentora AI</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-base: #0a0b0f;
    --bg-sidebar: #0f1117;
    --bg-card: #1a1d27;
    --bg-input: #1e2130;
    --accent: #6c63ff;
    --accent2: #00d4aa;
    --accent3: #ff6b6b;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(108,99,255,0.4);
    --text-primary: #f0f0f8;
    --text-secondary: #8b8fa8;
    --text-muted: #4a4d62;
    --font-main: 'Sora', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --sidebar-w: 248px;
  }

  html, body { height: 100%; }
  body {
    font-family: var(--font-main);
    background: var(--bg-base);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Ambient backdrop ===== */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(640px 420px at 14% -6%, rgba(108,99,255,0.10), transparent 62%),
      radial-gradient(560px 420px at 92% 6%, rgba(0,212,170,0.08), transparent 60%);
  }

  /* ===== Sidebar ===== */
  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 30;
    transition: margin-left 0.32s cubic-bezier(0.16,1,0.3,1), box-shadow 0.32s;
  }

  .logo-area { padding: 20px 18px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
  .logo-icon {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    box-shadow: 0 4px 16px rgba(108,99,255,0.28);
    flex-shrink: 0;
  }
  .logo-text { font-size: 17px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.3px; }
  .logo-text span { color: var(--accent2); }

  .sidebar-close {
    display: none;
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    color: var(--text-secondary);
    align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  .new-chat-btn {
    margin: 16px 14px 8px;
    background: rgba(108,99,255,0.12);
    border: 1px solid rgba(108,99,255,0.25);
    color: var(--accent);
    font-family: var(--font-main);
    font-size: 13px; font-weight: 500;
    padding: 10px 14px; border-radius: 10px;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: all 0.2s;
    width: calc(100% - 28px);
  }
  .new-chat-btn:hover { background: rgba(108,99,255,0.22); border-color: rgba(108,99,255,0.5); }

  .nav-section { padding: 6px 10px; flex: 1; overflow-y: auto; }
  .nav-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.4px; color: var(--text-muted); padding: 14px 8px 6px; }

  .nav-item {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 12px; border-radius: 10px;
    cursor: pointer; font-size: 13.5px;
    color: var(--text-secondary);
    transition: all 0.18s;
    margin-bottom: 2px;
    border: 1px solid transparent;
    user-select: none;
    text-decoration: none;
  }
  .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text-primary); }
  .nav-item.active { background: rgba(108,99,255,0.1); color: var(--text-primary); border-color: rgba(108,99,255,0.2); }
  .nav-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .nav-badge { margin-left: auto; background: var(--accent3); color: white; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 20px; font-family: var(--font-mono); }
  .nav-badge.green { background: var(--accent2); color: #0a0b0f; }
  .nav-badge.soon { background: rgba(255,255,255,0.08); color: var(--text-muted); }

  .sidebar-bottom { padding: 12px 10px; border-top: 1px solid var(--border); }
  .user-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; }
  .signout-btn { width: calc(100% - 20px); margin: 0 10px 8px; padding: 9px 14px; background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.2); color: var(--accent3); font-family: var(--font-main); font-size: 12px; font-weight: 500; border-radius: 8px; cursor: pointer; transition: all 0.18s; }
  .signout-btn:hover { background: rgba(255,107,107,0.15); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #6c63ff, #00d4aa); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 13px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-plan { font-size: 11px; color: var(--accent2); font-weight: 500; }

  /* ===== Sidebar overlay (mobile) ===== */
  .sidebar-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(2px);
    z-index: 25;
    opacity: 0;
    transition: opacity 0.28s;
  }

  /* ===== Main ===== */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-base); position: relative; z-index: 1; min-width: 0; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
    backdrop-filter: blur(6px);
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }

  .menu-btn {
    display: none;
    width: 38px; height: 38px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.18s;
  }
  .menu-btn:hover { color: var(--text-primary); border-color: var(--border-hover); }

  .model-selector {
    display: flex; align-items: center; gap: 7px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 13px;
    font-size: 13px;
    color: var(--text-secondary);
    user-select: none;
    font-weight: 500;
    white-space: nowrap;
  }
  .model-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 8px var(--accent2); flex-shrink: 0; }

  .topbar-mobile-logo {
    display: none;
    align-items: center; gap: 8px;
    font-size: 15px; font-weight: 700;
    color: var(--text-primary);
  }
  .topbar-mobile-logo .logo-icon { width: 28px; height: 28px; font-size: 14px; border-radius: 8px; }
  .topbar-mobile-logo span { color: var(--accent2); }

  /* ===== Chat area ===== */
  .chat-area { flex: 1; overflow-y: auto; padding: 36px 60px 20px; display: flex; flex-direction: column; gap: 26px; }
  .chat-area::-webkit-scrollbar, .nav-section::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb, .nav-section::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .welcome {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 36px 20px 20px; gap: 16px; max-width: 680px; margin: 0 auto; width: 100%;
    animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  .welcome-icon {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, rgba(108,99,255,0.2), rgba(0,212,170,0.2));
    border: 1px solid rgba(108,99,255,0.3);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; margin-bottom: 6px;
    box-shadow: 0 8px 28px rgba(108,99,255,0.18);
  }
  .welcome h1 {
    font-size: 30px; font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(135deg, #f0f0f8 40%, var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .welcome p { font-size: 15px; color: var(--text-secondary); max-width: 440px; line-height: 1.7; font-weight: 300; }

  .suggestion-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 640px; margin-top: 8px; }
  .suggestion-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
  }
  .suggestion-card:hover { border-color: rgba(108,99,255,0.35); background: #1e2130; transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,0.25); }
  .sug-icon { font-size: 20px; margin-bottom: 8px; display: block; }
  .sug-title { font-size: 13.5px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; }
  .sug-desc { font-size: 12px; color: var(--text-muted); }

  /* ===== Input area ===== */
  .input-area { padding: 16px 60px 22px; border-top: 1px solid var(--border); }
  .input-box {
    max-width: 720px; margin: 0 auto;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex; align-items: flex-end; gap: 10px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-box:focus-within { border-color: rgba(108,99,255,0.45); box-shadow: 0 0 0 3px rgba(108,99,255,0.10); }
  .input-box textarea {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text-primary); font-family: var(--font-main); font-size: 14.5px;
    resize: none; line-height: 1.5; min-height: 24px; max-height: 140px; overflow-y: auto;
  }
  .input-box textarea::placeholder { color: var(--text-muted); }
  .input-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .send-btn {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--accent); border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: white;
    transition: all 0.18s; flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(108,99,255,0.35);
  }
  .send-btn:hover { background: #7b73ff; transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }
  .send-btn svg { width: 16px; height: 16px; }

  .input-footer {
    display: flex; justify-content: center; margin-top: 10px;
    font-size: 11.5px; color: var(--text-muted); gap: 20px;
    max-width: 720px; margin-left: auto; margin-right: auto;
    text-align: center;
  }
  .input-footer span { display: flex; align-items: center; gap: 5px; }

  /* ===== Messages ===== */
  .message-row { display: flex; padding: 0 20px; }
  .message-row.user { justify-content: flex-end; }
  .message-row.assistant { gap: 12px; align-items: flex-start; }

  .user-bubble {
    background: #1e2130; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px 14px 4px 14px;
    padding: 12px 16px; max-width: 72%;
    font-size: 14px; line-height: 1.65; color: #f0f0f8;
    word-break: break-word; white-space: pre-wrap;
  }
  .assistant-avatar {
    width: 30px; height: 30px; flex-shrink: 0;
    background: linear-gradient(135deg,#6c63ff,#00d4aa);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 14px; margin-top: 2px;
  }
  .ai-bubble { flex: 1; font-size: 14px; line-height: 1.75; color: #e8ecf0; word-break: break-word; min-width: 0; }
  .ai-bubble h1 { font-size: 18px; font-weight: 700; margin: 14px 0 8px; color: #f0f0f8; }
  .ai-bubble h2 { font-size: 16px; font-weight: 600; margin: 12px 0 6px; color: #f0f0f8; border-bottom: 1px solid rgba(255,255,255,0.07); padding-bottom: 4px; }
  .ai-bubble h3 { font-size: 14px; font-weight: 600; margin: 10px 0 4px; color: #f0f0f8; }
  .ai-bubble strong { color: #f0f0f8; font-weight: 600; }
  .ai-bubble ul, .ai-bubble ol { padding-left: 20px; margin: 6px 0; }
  .ai-bubble li { margin: 4px 0; }
  .ai-bubble code { background: rgba(108,99,255,0.15); border-radius: 4px; padding: 2px 6px; font-family: var(--font-mono); font-size: 12px; color: #a78bfa; }
  .ai-bubble pre { background: #1a1d27; border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 10px 0; max-width: 100%; }
  .ai-bubble pre code { background: none; padding: 0; color: #e8ecf0; font-size: 12.5px; }
  .ai-bubble hr { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 14px 0; }
  .ai-bubble p { margin: 6px 0; }

  @keyframes mentoraDot { 0%,80%,100%{ transform:translateY(0);opacity:.4; } 40%{ transform:translateY(-5px);opacity:1; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ===== Mobile ===== */
  @media (max-width: 880px) {
    .sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      margin-left: calc(-1 * var(--sidebar-w));
      box-shadow: none;
    }
    .sidebar.open { margin-left: 0; box-shadow: 24px 0 60px rgba(0,0,0,0.45); }
    .sidebar-close { display: flex; }

    .sidebar-overlay.open { display: block; opacity: 1; }

    .menu-btn { display: flex; }
    .topbar-mobile-logo { display: flex; }
    .topbar { padding: 12px 14px; }

    .chat-area { padding: 22px 14px 16px; }
    .input-area { padding: 12px 14px 16px; }
    .suggestion-grid { grid-template-columns: 1fr; }
    .user-bubble { max-width: 88%; }
    .welcome { padding: 20px 8px 14px; gap: 12px; }
    .welcome h1 { font-size: 24px; }
    .welcome p { font-size: 13.5px; }
    .welcome-icon { width: 54px; height: 54px; font-size: 24px; border-radius: 16px; }
    .message-row { padding: 0 4px; }
    .input-footer { flex-direction: column; gap: 4px; }
  }

  @media (max-width: 420px) {
    .topbar-mobile-logo span.full { display: none; }
  }
</style>
</head>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="logo-area">
    <a href="index.html" class="logo"><div class="logo-icon">🎓</div><span class="logo-text">Mentora<span> AI</span></span></a>
    <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

<main class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

    </div>
  </div>

  <div class="input-area">
    <div class="input-box">
      <textarea id="chatInput" rows="1" placeholder="Ask Mentora anything - explain, analyze, or plan your study..." oninput="resizeInput(this)" onkeydown="handleKey(event)"></textarea>
      <div class="input-actions">
        <button class="send-btn" id="sendBtn" title="Send" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>

  </div>

<script>
function resizeInput(input) {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
}
function fillPrompt(text) {
  const input = document.getElementById('chatInput');
  input.value = text;
  resizeInput(input);
  input.focus();
}
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

/* ===== Mobile sidebar toggle ===== */
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('sidebarOverlay');
const menuBtn = document.getElementById('menuBtn');
const closeBtn = document.getElementById('sidebarClose');

function openSidebar() {
  sidebar.classList.add('open');
  overlay.classList.add('open');
}
function closeSidebar() {
  sidebar.classList.remove('open');
  overlay.classList.remove('open');
}
menuBtn.addEventListener('click', openSidebar);
closeBtn.addEventListener('click', closeSidebar);
overlay.addEventListener('click', closeSidebar);

/* close sidebar automatically when a nav link is tapped on mobile */
document.querySelectorAll('.nav-item').forEach((link) => {
  link.addEventListener('click', () => {
    if (window.innerWidth <= 880) closeSidebar();
  });
});
</script>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { collection, addDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const authInstance = auth || getAuth();
let currentUser = null;
let activeChatRef = null;
let history = [];
let sending = false;

onAuthStateChanged(authInstance, (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  currentUser = user;
  const name = user.displayName || user.email?.split("@")[0] || "Guest";
  document.getElementById("userName").textContent = name;

  const avatar = document.getElementById("userAvatar");
  if (user.photoURL) {
    avatar.innerHTML = `<img src="${escapeAttr(user.photoURL)}" alt="${escapeAttr(name)}" />`;
  } else {
    avatar.textContent = name.charAt(0).toUpperCase();
  }
});

document.getElementById("signOutBtn").onclick = async () => {
  await signOut(authInstance);
  window.location.href = "login.html";
};

document.getElementById("newChatBtn").onclick = () => resetChat();

function welcomeMarkup() {
  return `
    <div class="welcome" id="welcomeScreen">
      <div class="welcome-icon">🎓</div>
      <h1>Learn smarter, not harder.</h1>
      <p>Your AI study companion - ask anything, analyze ideas, or plan your academic journey with Mentora.</p>
      <div class="suggestion-grid">
        <div class="suggestion-card" onclick="fillPrompt('Explain quantum entanglement step by step')"><span class="sug-icon">⚛️</span><div class="sug-title">Explain quantum entanglement</div><div class="sug-desc">Physics concept, step by step</div></div>
        <div class="suggestion-card" onclick="fillPrompt('Summarize my notes and highlight key points')"><span class="sug-icon">📝</span><div class="sug-title">Summarize my notes</div><div class="sug-desc">Turn rough notes into clarity</div></div>
        <div class="suggestion-card" onclick="fillPrompt('Build a study plan for my upcoming exams')"><span class="sug-icon">🗓️</span><div class="sug-title">Build a study plan</div><div class="sug-desc">For my upcoming exam schedule</div></div>
        <div class="suggestion-card" onclick="fillPrompt('Help me solve a calculus problem')"><span class="sug-icon">🧮</span><div class="sug-title">Solve this math problem</div><div class="sug-desc">Calculus, algebra, stats and more</div></div>
      </div>
    </div>`;
}

function resetChat() {
  history = [];
  activeChatRef = null;
  document.getElementById("chatArea").innerHTML = welcomeMarkup();
}

function appendUser(text) {
  const row = document.createElement("div");
  row.className = "message-row user";
  const bubble = document.createElement("div");
  bubble.className = "user-bubble";
  bubble.textContent = text;
  row.appendChild(bubble);
  appendRow(row);
}

function createAiBubble() {
  const row = document.createElement("div");
  row.className = "message-row assistant";
  row.innerHTML = `<div class="assistant-avatar">🎓</div>`;
  const bubble = document.createElement("div");
  bubble.className = "ai-bubble";
  bubble.innerHTML = `<span style="display:inline-flex;gap:4px;align-items:center;height:22px;">
    ${[0,180,360].map((delay) => `<span style="width:6px;height:6px;border-radius:50%;background:#6c63ff;display:inline-block;animation:mentoraDot 1.2s ease-in-out ${delay}ms infinite;"></span>`).join("")}
  </span>`;
  row.appendChild(bubble);
  appendRow(row);
  return bubble;
}

function appendRow(row) {
  const chatArea = document.getElementById("chatArea");
  const welcome = document.getElementById("welcomeScreen");
  if (welcome) welcome.remove();
  chatArea.appendChild(row);
  chatArea.scrollTop = chatArea.scrollHeight;
}

async function callMentora() {
  const response = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    credentials: "same-origin",
    body: JSON.stringify({ messages: history }),
  });

  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    throw new Error(data.error || `Mentora API error ${response.status}`);
  }

  if (!data.reply) {
    throw new Error("Mentora returned an empty response.");
  }

  return data.reply;
}

async function saveMsg(role, content) {
  if (!currentUser) return;
  if (!activeChatRef) {
    activeChatRef = await addDoc(collection(db, "users", currentUser.uid, "chats"), {
      title: content.slice(0, 60),
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp(),
    });
  }

  await addDoc(collection(activeChatRef, "messages"), { role, content, ts: serverTimestamp() });
  await setDoc(activeChatRef, { updatedAt: serverTimestamp() }, { merge: true });
}

window.sendMessage = async function sendMessage() {
  if (sending) return;
  const input = document.getElementById("chatInput");
  const sendBtn = document.getElementById("sendBtn");
  const text = input.value.trim();
  if (!text) return;

  input.value = "";
  input.style.height = "auto";
  appendUser(text);
  history.push({ role: "user", content: text });
  saveMsg("user", text).catch(console.error);

  const bubble = createAiBubble();
  sending = true;
  sendBtn.disabled = true;

  try {
    const reply = await callMentora();
    bubble.innerHTML = renderMd(reply);
    history.push({ role: "assistant", content: reply });
    saveMsg("assistant", reply).catch(console.error);
  } catch (err) {
    bubble.innerHTML = `<span style="color:#ff6b6b;">${escapeHtml(err.message)}</span>`;
  } finally {
    sending = false;
    sendBtn.disabled = false;
    document.getElementById("chatArea").scrollTop = document.getElementById("chatArea").scrollHeight;
  }
};

function renderMd(text) {
  const codeBlocks = [];
  let html = text.replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, code) => {
    codeBlocks.push(code.trim());
    return `%%CODE${codeBlocks.length - 1}%%`;
  });

  html = escapeHtml(html);
  html = html.replace(/%%CODE(\d+)%%/g, (_, index) => `<pre><code>${escapeHtml(codeBlocks[index])}</code></pre>`);
  html = html
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/^### (.+)$/gm, "<h3>$1</h3>")
    .replace(/^## (.+)$/gm, "<h2>$1</h2>")
    .replace(/^# (.+)$/gm, "<h1>$1</h1>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/^[-*] (.+)$/gm, "<li>$1</li>")
    .replace(/^---$/gm, "<hr>")
    .replace(/\n/g, "<br>");

  return html;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[char]));
}

function escapeAttr(value) {
  return escapeHtml(value).replace(/'/g, "&#39;");
}

resetChat();
