<style>
  .main { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  /* ---- Accessibility helpers ---- */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  .skip-link {
    position: fixed; top: 8px; left: 8px; z-index: 1000;
    padding: 9px 16px; border-radius: 999px;
    background: var(--text-primary); color: var(--bg-base, #000);
    font-size: 13px; font-weight: 600; text-decoration: none;
    transform: translateY(-160%);
    transition: transform var(--dur-fast) var(--ease-out);
  }
  .skip-link:focus-visible { transform: translateY(0); }
  :where(a, button):focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 999px;
  }

  /* ---- Topbar ---- */
  .topbar {
    position: relative; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; height: 56px; flex-shrink: 0;
    background: transparent; border-bottom: 1px solid var(--border);
    -webkit-backdrop-filter: saturate(160%) blur(14px);
    backdrop-filter: saturate(160%) blur(14px);
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .menu-btn {
    width: 34px; height: 34px; border-radius: 999px; border: none; background: transparent;
    color: var(--text-secondary); display: none; align-items: center; justify-content: center; cursor: pointer;
    transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .menu-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
  .brand-mark { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: -0.03em; color: var(--text-primary); flex-shrink: 0; text-decoration: none; }
  .brand-mark img { width: 22px; height: 22px; border-radius: var(--radius-md); }
  .greeting { font-size: 13px; color: var(--text-secondary); margin-left: 6px; padding-left: 12px; border-left: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-center { flex: 1; display: flex; justify-content: center; margin: 0 16px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  #topbarAvatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); cursor: pointer; transition: border-color var(--dur-fast) var(--ease-out); }
  #topbarAvatar:hover { border-color: var(--border-strong); }

  /* Static, crawlable links to the public pages (desktop topbar) */
  .topbar-nav { display: flex; align-items: center; gap: 2px; }
  .topbar-nav a {
    font-size: 13px; font-weight: 500; color: var(--text-secondary); text-decoration: none;
    padding: 7px 13px; border-radius: 999px;
    transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .topbar-nav a:hover { color: var(--text-primary); background: var(--bg-elevated); }

  /* ---- Hub layout ---- */
  .chat-area {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 32px 20px 100px; display: flex; flex-direction: column; align-items: center;
    scroll-behavior: smooth; background: transparent;
    overscroll-behavior: contain;
  }
  .chat-area::-webkit-scrollbar { width: 5px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--radius-full); }
  .chat-area::-webkit-scrollbar-track { background: transparent; }

  .hub-grid { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 760px; }
  .hub-row-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 2px; }
  .hub-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.2; color: var(--text-primary); }
  .hub-subtitle { font-size: 13px; line-height: 1.5; color: var(--text-muted); margin-top: 3px; }
  .hub-link-pill { font-size: 12px; font-weight: 500; color: var(--text-primary); text-decoration: none; border: 1px solid var(--border); padding: 7px 14px; border-radius: 999px; background: var(--bg-card); transition: all var(--dur-fast) var(--ease-out); }
  .hub-link-pill:hover { border-color: var(--border-strong); background: var(--bg-card-hover); }
  .hub-eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.01em; color: var(--text-muted); }
  .hub-tag { font-size: 10.5px; font-weight: 500; background: var(--bg-elevated); border: 1px solid var(--border); padding: 2px 9px; border-radius: 999px; color: var(--text-secondary); }
  .hub-caption { font-size: 11.5px; color: var(--text-muted); }
  .hub-caption-center { font-size: 11.5px; color: var(--text-muted); text-align: center; }
  .hub-big-number { font-family: var(--font-display); font-size: 24px; font-weight: 700; margin-top: 6px; color: var(--text-primary); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .hub-medium-label { font-size: 13px; font-weight: 600; margin-top: 6px; color: var(--text-primary); }
  .hub-gauge-wrap { width: 112px; height: 112px; display: grid; place-items: center; color: var(--text-muted); font-size: 12px; margin: 0 auto; }
  .hub-volume-chart { margin-top: 10px; height: 64px; }
  .hub-counts-row { display: flex; gap: 10px; font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .hub-bar-strip { margin-top: 10px; height: 8px; display: flex; gap: 2px; border-radius: 999px; overflow: hidden; background: var(--bg-elevated); }
  .hub-clickable { cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out); }
  .hub-clickable:hover { border-color: var(--border-strong); background: var(--bg-card-hover); transform: translateY(-1px); }
  .hub-clickable .hub-eyebrow { align-self: flex-start; }

  .cere-grid-3 { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 12px; }
  .cere-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .aq-graph-card { padding: 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl); }

  /* ---- Floating dock: About / Founder (static HTML, lives outside .main so layout and auth gate can't hide it) ---- */
  .la-dock {
    position: fixed !important; left: 50%; transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    z-index: 60; display: flex !important; visibility: visible !important; opacity: 1 !important;
    align-items: center; gap: 6px; padding: 6px; max-width: calc(100vw - 24px);
    border-radius: 999px; border: 1px solid var(--border-strong, rgba(128,128,128,.4));
    background: rgba(18,18,18,.88);
    background: color-mix(in srgb, var(--bg-card, #121212) 85%, transparent);
    -webkit-backdrop-filter: saturate(160%) blur(16px); backdrop-filter: saturate(160%) blur(16px);
    box-shadow: 0 10px 34px rgba(0,0,0,.35);
  }
  .la-dock a {
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    font-size: 13px; font-weight: 600; text-decoration: none; line-height: 1;
    padding: 10px 16px; border-radius: 999px;
    color: var(--text-primary, #fff); background: transparent;
    transition: background var(--dur-fast, .15s) ease, opacity var(--dur-fast, .15s) ease;
  }
  .la-dock a:hover { background: var(--bg-elevated, rgba(128,128,128,.2)); }
  .la-dock a.primary { background: var(--text-primary, #fff); color: var(--bg-base, #000); }
  .la-dock a.primary:hover { opacity: .88; background: var(--text-primary, #fff); }
  .la-dock svg { flex-shrink: 0; }

  /* ---- Mobile ---- */
  @media (max-width: 880px) {
    .menu-btn { display: flex; }
    .topbar { padding: 0 14px; height: 52px; }
    .topbar-center { display: none; }
    .greeting { display: none; }
    .chat-area { padding: 20px 12px 100px; }
    .cere-grid-3, .cere-grid { grid-template-columns: 1fr; }
    .la-dock a { padding: 10px 14px; font-size: 12.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .chat-area { scroll-behavior: auto; }
    .hub-clickable:hover { transform: none; }
    .skip-link { transition: none; }
  }
</style>

<script>
function resizeInput(input) {
 if (!input) return;
 input.style.height = 'auto';
 input.style.height = input.scrollHeight + 'px';
}
function fillPrompt(text) {
 try { sessionStorage.setItem('learning-allied-pending-prompt', text); sessionStorage.setItem('aquila_pending_prompt', text); } catch(e){}
 window.location.href = window.pageUrl ? window.pageUrl('/chat') : '/chat';
}
function runPrompt(text) { fillPrompt(text); }
function handleKey(e) {
 if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); }
}

(function(){
 var viewport = window.visualViewport;
 if (!viewport) return;
 function syncViewportHeight(){
  var target = document.activeElement;
  if (target && target.matches('input, textarea')) document.documentElement.style.setProperty('--app-height', viewport.height + 'px');
  else document.documentElement.style.removeProperty('--app-height');
 }
 document.addEventListener('focusin', syncViewportHeight);
 document.addEventListener('focusout', function(){ setTimeout(syncViewportHeight, 0); });
 viewport.addEventListener('resize', syncViewportHeight);
 syncViewportHeight();
}());

(function(){
 var chatArea = document.getElementById('chatArea');
 var control = document.getElementById('scrollControl');
 if (!chatArea) return;
 var bar = document.createElement('div');
 bar.className = 'scroll-progress';
 document.body.prepend(bar);
 var ticking = false;
 function updateScrollState(){
  ticking = false;
  var max = Math.max(0, chatArea.scrollHeight - chatArea.clientHeight);
  var top = Math.min(max, Math.max(0, chatArea.scrollTop));
  bar.style.width = max > 0 ? ((top / max) * 100) + '%' : '0%';
  if (!control) return;
  var scrollable = max > 8;
  var direction = top >= max - 48 || top > max * 0.55 ? 'up' : 'down';
  control.classList.toggle('visible', scrollable);
  control.dataset.direction = direction;
  var label = direction === 'up' ? 'Scroll to top' : 'Scroll to latest';
  control.setAttribute('aria-label', label);
  control.title = label;
 }
 function scheduleScrollUpdate(){
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(updateScrollState);
 }
 if (control) {
  control.addEventListener('click', function(){
   var max = Math.max(0, chatArea.scrollHeight - chatArea.clientHeight);
   var target = control.dataset.direction === 'up' ? 0 : max;
   chatArea.scrollTo({ top: target, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  });
 }
 chatArea.addEventListener('scroll', scheduleScrollUpdate, { passive: true });
 window.addEventListener('resize', scheduleScrollUpdate, { passive: true });
 if ('ResizeObserver' in window) new ResizeObserver(scheduleScrollUpdate).observe(chatArea);
 if ('MutationObserver' in window) new MutationObserver(scheduleScrollUpdate).observe(chatArea, { childList: true, subtree: true });
 scheduleScrollUpdate();
}());

(function(){
 var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(reduceMotion) return;
 document.querySelectorAll('.send-btn, .signout-btn, .new-chat-btn, .upgrade-nav-btn').forEach(function(btn){
  btn.addEventListener('click', function(e){
   var ripple = document.createElement('span');
   var r = btn.getBoundingClientRect();
   var size = Math.max(r.width, r.height);
   ripple.style.cssText = 'position:absolute;top:'+(e.clientY-r.top-size/2)+'px;left:'+(e.clientX-r.left-size/2)+'px;width:'+size+'px;height:'+size+'px;border-radius:50%;background:rgba(255,255,255,0.15);transform:scale(0);animation:rippleAnim 0.5s ease-out;pointer-events:none;z-index:0;';
   btn.style.position = 'relative';
   btn.style.overflow = 'hidden';
   btn.appendChild(ripple);
   setTimeout(function(){ ripple.remove(); }, 600);
  });
 });
}());
</script>
