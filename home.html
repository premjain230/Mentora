 /* ===== Chat area — premium workspace ===== */
 .chat-area { flex: 1; overflow-y: auto; padding: 32px 48px 24px; display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth; background: var(--bg-base); }
 .chat-area::-webkit-scrollbar { width: 4px; } .chat-area::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }

 .welcome {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: 32px 20px 16px; gap: 14px; max-width: 720px; margin: 0 auto; width: 100%;
  animation: fadeUp 0.6s var(--ease-out) both;
 }
 .welcome-icon {
  width: 56px; height: 56px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 4px;
  box-shadow: var(--shadow-sm); position: relative; color: var(--text-primary);
 }
 .welcome-icon::before {
  content: ''; position: absolute; inset: -1px; border-radius: var(--radius-xl);
  background: linear-gradient(135deg, rgba(14,165,233,0.12), rgba(139,124,247,0.10));
  z-index: -1; opacity: 0.8;
 }
 .welcome-icon svg { width: 26px; height: 26px; stroke-width: 1.7; }
 .welcome h1 {
  font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.2;
  color: var(--text-primary);
 }
 .welcome p { font-size: 14px; color: var(--text-secondary); max-width: 460px; line-height: 1.6; font-weight: 400; }

 .suggestion-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; max-width: 640px; margin-top: 8px; }
 .suggestion-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 16px; cursor: pointer; text-align: left; transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
 }
 .suggestion-card:hover { background: var(--bg-card-hover); border-color: var(--border-strong); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
 .suggestion-card:active { transform: translateY(0); }
 .sug-icon { width: 30px; height: 30px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-muted); }
 .sug-icon svg { width: 15px; height: 15px; stroke-width: 1.7; }
 .sug-title { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; letter-spacing: -0.01em; }
 .sug-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

 /* ===== Input area — premium composer ===== */
 .input-area { padding: 16px 32px 20px; border-top: 1px solid var(--border-subtle); background: linear-gradient(to top, var(--bg-base) 60%, transparent); }
 .input-box {
  max-width: 720px; margin: 0 auto;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl);
  padding: 10px 12px 10px 16px; display: flex; align-items: flex-end; gap: 8px;
  box-shadow: var(--shadow-sm); transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
 }
 .input-box:focus-within { border-color: var(--border-active); background: var(--bg-card); box-shadow: var(--shadow-glow); }
 .input-box textarea {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text-primary); font-family: var(--font-main); font-size: 14px; font-weight: 450;
  resize: none; line-height: 1.6; min-height: 24px; max-height: 140px; overflow-y: auto; padding: 6px 0;
 }
 .input-box textarea::placeholder { color: var(--text-faint); }
 .input-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
 .send-btn {
  width: 34px; height: 34px; border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  transition: all var(--dur-fast) var(--ease-out);
  background: var(--text-primary); border: 1px solid var(--text-primary); color: var(--bg-base); box-shadow: none;
 }
 .send-btn:hover { background: #1e293b; transform: translateY(-1px); box-shadow: var(--shadow-sm); }
 .light-mode .send-btn { background: #0f172a; color: #fff; }
 .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
 .send-btn svg { width: 15px; height: 15px; stroke-width: 2.2; }
 .input-footer {
  display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 16px; margin-top: 10px;
  font-size: 11px; color: var(--text-faint); max-width: 720px; margin-left: auto; margin-right: auto; text-align: center; font-weight: 450;
 }
 .input-footer span { display: flex; align-items: center; gap: 5px; }

 /* ===== Messages — workspace, not bubbles ===== */
 .message-row { display: flex; padding: 0 16px; max-width: 740px; margin: 0 auto; width: 100%; }
 .message-row.user { justify-content: flex-end; }
 .message-row.assistant { gap: 14px; align-items: flex-start; }
 .user-bubble {
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: var(--radius-lg); border-bottom-right-radius: var(--radius-sm);
  padding: 10px 14px; max-width: 68%;
  font-size: 14px; line-height: 1.6; color: var(--text-primary); font-weight: 450;
  word-break: break-word; white-space: pre-wrap; box-shadow: var(--shadow-xs);
 }
 .assistant-avatar {
  width: 28px; height: 28px; flex-shrink: 0;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;
  margin-top: 2px; color: var(--text-muted); font-size: 12px; font-weight: 700;
 }
 .ai-bubble { flex: 1; font-size: 14px; line-height: 1.7; color: var(--text-primary); word-break: break-word; min-width: 0; font-weight: 400; }
 .ai-bubble h1 { font-family: var(--font-display); font-size: 18px; font-weight: 650; margin: 16px 0 8px; letter-spacing: -0.02em; }
 .ai-bubble h2 { font-family: var(--font-display); font-size: 15px; font-weight: 600; margin: 14px 0 6px; color: var(--text-primary); padding-bottom: 6px; border-bottom: 1px solid var(--border-subtle); }
 .ai-bubble h3 { font-size: 14px; font-weight: 600; margin: 12px 0 6px; }
 .ai-bubble strong { font-weight: 600; color: var(--text-primary); }
 .ai-bubble ul, .ai-bubble ol { padding-left: 18px; margin: 8px 0; }
 .ai-bubble li { margin: 4px 0; color: var(--text-secondary); }
 .ai-bubble li::marker { color: var(--text-muted); }
 .ai-bubble code { background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 1px 6px; font-family: var(--font-mono); font-size: 12px; color: var(--text-primary); font-weight: 500; }
 .ai-bubble pre { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px 16px; overflow-x: auto; margin: 12px 0; max-width: 100%; }
 .ai-bubble pre code { background: none; border: none; padding: 0; color: var(--text-primary); font-size: 12.5px; }
 .ai-bubble hr { border: none; border-top: 1px solid var(--border-subtle); margin: 16px 0; }
 .ai-bubble p { margin: 8px 0; color: var(--text-primary); }
 .ai-bubble a { color: var(--accent); font-weight: 500; border-bottom: 1px solid transparent; transition: border-color var(--dur-fast) ease; }
 .ai-bubble a:hover { border-bottom-color: var(--accent); }

 /* ===== AI action buttons — minimal ===== */
 .ai-actions { display: flex; align-items: center; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
 .ai-action-btn {
  display: flex; align-items: center; gap: 5px; padding: 6px 10px; font-size: 12px; font-weight: 450;
  font-family: var(--font-main); border-radius: var(--radius-full); border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-muted); cursor: pointer; transition: all var(--dur-fast) var(--ease-out); line-height: 1;
 }
 .ai-action-btn:hover { color: var(--text-primary); border-color: var(--border-strong); background: var(--bg-elevated); }
 .ai-action-btn.active-good, .ai-action-btn.active-copy { color: var(--accent); border-color: rgba(14,165,233,0.25); background: var(--accent-soft); }
 .ai-action-btn.active-bad { color: var(--accent3); border-color: rgba(248,113,113,0.25); background: rgba(248,113,113,0.08); }
 .ai-action-divider { width: 1px; height: 14px; background: var(--border); flex-shrink: 0; margin: 0 2px; }

 .chat-loading { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 40px 20px; color: var(--text-muted); font-size: 13px; }

 .cere-grid-3 { display:grid; grid-template-columns:1.1fr 1fr 1fr; gap:12px; }
 .cere-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
 /* ===== Mobile — refined ===== */
 @media (max-width: 880px) {
  .chat-area { padding: 20px 16px 16px; gap: 20px; }
  .input-area { padding: 12px 12px 14px; }
  .suggestion-grid { grid-template-columns: 1fr; gap: 8px; }
  .cere-grid-3, .cere-grid { grid-template-columns: 1fr; }
  .topbar-center { display: none !important; }
  .user-bubble { max-width: 84%; }
  .welcome { padding: 20px 8px 14px; gap: 12px; }
  .welcome h1 { font-size: 22px; }
  .welcome p { font-size: 13px; }
  .welcome-icon { width: 52px; height: 52px; border-radius: var(--radius-lg); }
  .welcome-icon svg { width: 24px; height: 24px; }
  .message-row { padding: 0 4px; max-width: 100%; }
  .input-footer { flex-direction: column; gap: 4px; }
 }

<!-- ===== Non-module helpers (must stay plain script for inline onXxx handlers) ===== -->
<script>
function resizeInput(input) {
 input.style.height = 'auto';
 input.style.height = input.scrollHeight + 'px';
}
function fillPrompt(text) {
 const input = document.getElementById('chatInput');
 input.value = text;
 resizeInput(input);
 input.focus();
}
function runPrompt(text) {
 const input = document.getElementById('chatInput');
 input.value = text;
 resizeInput(input);
 sendMessage();
}
function handleKey(e) {
 if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

/* ── Mobile sidebar — handled by js/components/sidebar.js mountSidebar() — DRY, no duplicate listeners.
  This page used to duplicate sidebar open/close/toggle logic (caused null addEventListener after DRY). Now delegated. */

/* ── Focus the chat input on load (desktop only; avoids mobile keyboard pop) ── */
(function(){
 if (window.matchMedia('(pointer: coarse)').matches) return;
 window.addEventListener('load', function(){
  var input = document.getElementById('chatInput');
  if (input && !input.value) {
   setTimeout(function(){ input.focus({ preventScroll: true }); }, 450);
  }
 });
}());

/* ── Scroll progress bar ── */
(function(){
 var bar = document.createElement('div');
 bar.className = 'scroll-progress';
 document.body.prepend(bar);
 var ticking = false;
 window.addEventListener('scroll', function(){
  if(!ticking){ requestAnimationFrame(function(){
   var h = document.documentElement.scrollHeight - window.innerHeight;
   bar.style.width = h > 0 ? ((window.scrollY / h) * 100) + '%' : '0%';
   ticking = false;
  }); ticking = true; }
 });
}());

/* ── Ripple effect on buttons ── */
(function(){
 var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(reduceMotion) return;
 document.querySelectorAll('.send-btn, .signout-btn, .new-chat-btn, .upgrade-nav-btn').forEach(function(btn){
  btn.addEventListener('click', function(e){
   var ripple = document.createElement('span');
   var r = btn.getBoundingClientRect();
   var size = Math.max(r.width, r.height);
   ripple.style.cssText = 'position:absolute;top:'+(e.clientY-r.top-size/2)+'px;left:'+(e.clientX-r.left-size/2)+'px;width:'+size+'px;height:'+size+'px;border-radius:50%;background:rgba(255,255,255,0.15);transform:scale(0);animation:rippleAnim 0.5s ease-out;pointer-events:none;z-index:0;';
   btn.style.position = 'relative';
   btn.style.overflow = 'hidden';
   btn.appendChild(ripple);
   setTimeout(function(){ ripple.remove(); }, 600);
  });
 });
}());
</script>
<style>
 @keyframes rippleAnim{to{transform:scale(2);opacity:0;}}
</style>
