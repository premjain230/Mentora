<html><head><title>Mentora AI</title></head>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Orbitron:wght@400;500;700;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body, .nb-root {
    background: #090b10;
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
  }
  .nav-actions a{
    text-decoration:none;
    color: inherit;
  }

  :root {
    --nb-bg: rgba(8, 10, 16, 0.92);
    --nb-border: rgba(0, 212, 255, 0.12);
    --nb-accent: #00d4ff;
    --nb-accent2: #7b5ea7;
    --nb-glow: rgba(0, 212, 255, 0.35);
    --nb-text: #e8ecf0;
    --nb-muted: rgba(200, 210, 220, 0.55);
  }

  .nb-root {
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── NAV ── */
  .navbar {
    width: 100%;
    height: 64px;
    background: var(--nb-bg);
    border-bottom: 1px solid var(--nb-border);
    backdrop-filter: blur(20px) saturate(1.8);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    position: relative;
    overflow: hidden;
    animation: navSlide 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes navSlide {
    from { opacity: 0; transform: translateY(-100%); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Animated scan line */
  .navbar::before {
    content: '';
    position: absolute;
    top: 0; left: -100%; width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0,212,255,0.04), transparent);
    animation: scan 4s ease-in-out infinite;
  }

  @keyframes scan {
    0%   { left: -60%; }
    100% { left: 160%; }
  }

  /* Bottom accent line */
  .navbar::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, var(--nb-accent) 30%, #a78bfa 60%, transparent 100%);
    opacity: 0;
    animation: lineReveal 1s 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
    filter: blur(0.5px);
  }

  @keyframes lineReveal {
    from { opacity: 0; transform: scaleX(0); transform-origin: left; }
    to   { opacity: 1; transform: scaleX(1); }
  }

  /* ── LOGO ── */
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    text-decoration: none;
    animation: fadeUp 0.5s 0.1s both;
  }

  .logo-icon {
    width: 32px; height: 32px;
    position: relative;
    flex-shrink: 0;
  }

  .logo-icon svg {
    width: 100%; height: 100%;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .logo:hover .logo-icon svg {
    transform: rotate(90deg) scale(1.1);
  }

  .logo-text {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.08em;
    background: linear-gradient(135deg, #ffffff 0%, var(--nb-accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ── NAV LINKS ── */

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  

  .dropdown {
    position: absolute;
    top: calc(100% + 12px);
    left: 50%;
    transform: translateX(-50%) translateY(-8px) scale(0.96);
    opacity: 0;
    pointer-events: none;
    min-width: 200px;
    background: rgba(10, 13, 22, 0.97);
    border: 1px solid rgba(0,212,255,0.14);
    border-radius: 12px;
    padding: 8px;
    backdrop-filter: blur(24px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,212,255,0.05);
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 100;
  }

  .has-dropdown:hover .dropdown {
    opacity: 1;
    pointer-events: all;
    transform: translateX(-50%) translateY(0) scale(1);
  }

  .dropdown a {
    display: flex !important;
    align-items: center;
    gap: 10px;
    padding: 9px 12px !important;
    border-radius: 8px;
    font-size: 13px;
    color: var(--nb-muted);
    border: 1px solid transparent !important;
    transition: all 0.18s;
  }

  .dropdown a:hover {
    color: #fff;
    background: rgba(0,212,255,0.08) !important;
    border-color: rgba(0,212,255,0.15) !important;
    transform: translateX(4px);
  }

  .dropdown-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--nb-accent);
    opacity: 0.5;
    flex-shrink: 0;
    transition: opacity 0.18s, box-shadow 0.18s;
  }

  .dropdown a:hover .dropdown-dot {
    opacity: 1;
    box-shadow: 0 0 8px var(--nb-accent);
  }

  /* ── RIGHT ACTIONS ── */
  .nav-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    animation: fadeUp 0.5s 0.3s both;
    text-decoration:none;
  }

  .btn-ghost {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 500;
    font-family: 'Space Grotesk', sans-serif;
    color: var(--nb-muted);
    background: transparent;
    border: 1px solid rgba(200,210,220,0.12);
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: all 0.22s;
  }

  .btn-ghost:hover {
    color: #fff;
    border-color: rgba(200,210,220,0.3);
    background: rgba(255,255,255,0.04);
  }

  /* CTA button */
  .btn-cta {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 20px;
    font-size: 13px;
    font-weight: 600;
    font-family: 'Space Grotesk', sans-serif;
    color: #000;
    background: var(--nb-accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.03em;
    position: relative;
    overflow: hidden;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .btn-cta::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 60%);
  }

  .btn-cta::after {
    content: '';
    position: absolute;
    top: 50%; left: -40%;
    width: 30%; height: 200%;
    background: rgba(255,255,255,0.25);
    transform: translateY(-50%) skewX(-20deg);
    transition: left 0.5s ease;
  }

  .btn-cta:hover::after {
    left: 140%;
  }

  .btn-cta:hover {
    transform: scale(1.04);
    box-shadow: 0 0 28px rgba(0,212,255,0.5), 0 4px 16px rgba(0,212,255,0.3);
  }

  .btn-cta:active {
    transform: scale(0.98);
  }

  /* Search button */
  .search-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(200,210,220,0.1);
    border-radius: 8px;
    cursor: pointer;
    color: var(--nb-muted);
    font-size: 16px;
    transition: all 0.22s;
  }
  .search-btn:hover {
    color: var(--nb-accent);
    border-color: rgba(0,212,255,0.3);
    background: rgba(0,212,255,0.07);
    box-shadow: 0 0 16px rgba(0,212,255,0.15);
  }

  /* ── HERO PREVIEW AREA ── */
  .preview-area {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 32px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .preview-area::before {
    content: '';
    position: absolute;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 400px;
    background: radial-gradient(ellipse, rgba(0,212,255,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 0%, transparent 100%);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    background: rgba(0,212,255,0.08);
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 99px;
    font-size: 12px;
    color: var(--nb-accent);
    font-weight: 500;
    letter-spacing: 0.05em;
    margin-bottom: 28px;
    animation: fadeUp 0.6s 0.8s both;
  }

  .badge-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--nb-accent);
    box-shadow: 0 0 8px var(--nb-accent);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.5; transform: scale(0.85); }
  }

  .hero-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 42px;
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: #fff;
    margin-bottom: 16px;
    animation: fadeUp 0.6s 0.9s both;
  }

  .hero-title span {
    background: linear-gradient(135deg, var(--nb-accent) 0%, #a78bfa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-sub {
    font-size: 15px;
    color: var(--nb-muted);
    max-width: 420px;
    line-height: 1.7;
    animation: fadeUp 0.6s 1s both;
    margin-bottom: 36px;
  }

  .hero-ctas {
    display: flex;
    gap: 12px;
    animation: fadeUp 0.6s 1.1s both;
  }

  .cta-primary {
    padding: 12px 28px;
    background: var(--nb-accent);
    color: #000;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: 0.04em;
    position: relative;
    overflow: hidden;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .cta-primary::after {
    content: '';
    position: absolute;
    top: 50%; left: -40%;
    width: 30%; height: 200%;
    background: rgba(255,255,255,0.3);
    transform: translateY(-50%) skewX(-20deg);
    transition: left 0.5s ease;
  }

  .cta-primary:hover::after { left: 140%; }
  .cta-primary:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 0 32px rgba(0,212,255,0.55), 0 8px 24px rgba(0,212,255,0.3);
  }

  .cta-secondary {
    padding: 12px 28px;
    background: transparent;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    font-family: 'Space Grotesk', sans-serif;
    border: 1px solid rgba(200,210,220,0.2);
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: all 0.22s;
  }

  .cta-secondary:hover {
    border-color: rgba(200,210,220,0.4);
    background: rgba(255,255,255,0.05);
    transform: translateY(-2px);
  }

  .label-note {
    position: absolute;
    bottom: 16px;
    font-size: 11.5px;
    color: rgba(200,210,220,0.3);
    letter-spacing: 0.05em;
  }
</style>

<div class="nb-root">
  <h2 class="sr-only">Dark AI-style navigation bar demo with animated menu, dropdown, and hero section</h2>

  <nav class="navbar">
    <a class="logo" href="#">
      <div class="logo-icon">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="12" height="12" rx="2" fill="#00d4ff" opacity="0.9"/>
          <rect x="18" y="2" width="12" height="12" rx="2" fill="#a78bfa" opacity="0.9"/>
          <rect x="2" y="18" width="12" height="12" rx="2" fill="#a78bfa" opacity="0.9"/>
          <rect x="18" y="18" width="12" height="12" rx="2" fill="#00d4ff" opacity="0.7"/>
          <rect x="10" y="10" width="12" height="12" rx="2" fill="rgba(0,212,255,0.25)" stroke="#00d4ff" stroke-width="0.8"/>
        </svg>
      </div>
      <span class="logo-text">NEXUS AI</span>
    </a>

   

    <div class="nav-actions">
      <button class="search-btn" aria-label="Search">
        <i class="ti ti-search" aria-hidden="true"></i>
      </button>
      <button class="btn-ghost">
        <i class="ti ti-user" aria-hidden="true"></i>
        <a href="">  login </a>
      </button>
      <button class="btn-cta">
        <i class="ti ti-bolt" aria-hidden="true"></i>
       <a href=""> Get Started </a>
      </button>
    </div>
  </nav>

  <div class="preview-area">
    <div class="grid-bg"></div>
    <div class="badge">
      <span class="badge-dot"></span>
      POWERED BY ADVANCED AI
    </div>
    <h1 class="hero-title">
      Learn Smarter<br>with <span>AI Power</span>
    </h1>
    <p class="hero-sub">
      It understands your full syllabus, tracks your weak areas, and helps you study like a topper.
    </p>
    <div class="hero-ctas">
      <button class="cta-primary">Start for Free</button>
      <button class="cta-secondary">Watch Demo →</button>
    </div>
    <span class="label-note">Join thousands of students learning smarter with Mentora AI.</span>
  </div>
</div>



</body>
