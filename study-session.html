<style>
 body { transition: background 0.35s ease, color 0.35s ease; }

 /* ===== Sidebar ===== */
 .logo-image { height: 34px; width: auto; display: block; }

 /* ===== Main ===== */
 .topbar-mobile-logo { display: none; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: var(--text-primary); }
 .topbar-mobile-logo span { color: var(--accent); }

 .content { flex: 1; overflow-y: auto; padding: 34px 40px 40px; }
 .content-inner { max-width: 700px; margin: 0 auto; }

 .page-title { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
 .page-sub { font-size: 14px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 26px; }

 /* ===== Cards ===== */
 .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 22px; margin-bottom: 16px; }
 .card-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.4px; color: var(--accent); padding: 0 0 10px; }
 .field-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 14px 0 6px; }
 .field-label:first-child { margin-top: 0; }
 input[type="text"], textarea, select {
  width: 100%; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text-primary);
  font-family: var(--font-main); font-size: 14px;
  padding: 12px 14px; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
 }
 textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
 input[type="text"]:focus, textarea:focus, select:focus { border-color: rgba(0,212,255,0.4); box-shadow: 0 0 0 3px rgba(0,212,255,0.10); }

 .duration-row { display: flex; flex-wrap: wrap; gap: 8px; }
 .duration-chip {
  padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--bg-input); color: var(--text-secondary);
  font-family: var(--font-mono); font-size: 12.5px; cursor: pointer;
  transition: all 0.18s; user-select: none;
 }
 .duration-chip:hover { border-color: var(--border-hover); color: var(--text-primary); }
 .duration-chip.active { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,0.08); box-shadow: 0 0 12px rgba(0,212,255,0.12); }

 .btn-gradient {
  width: 100%; height: 52px; border: none; border-radius: 14px; margin-top: 20px;
  background: linear-gradient(135deg, #00b4d8, var(--accent-strong));
  color: #040d12; font-family: var(--font-main); font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
 }
 .btn-gradient:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(0,212,255,0.25); }
 .btn-gradient:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }
 .btn-outline {
  width: 100%; height: 50px; border-radius: 14px; margin-top: 14px;
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-primary); font-family: var(--font-main); font-size: 14.5px; font-weight: 600;
  cursor: pointer; transition: all 0.18s;
 }
 .btn-outline:hover { border-color: var(--border-hover); color: var(--text-primary); }
 .btn-danger {
  width: 100%; height: 48px; border-radius: 14px; margin-top: 14px;
  background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.3);
  color: var(--accent3); font-family: var(--font-main); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.18s;
 }
 .btn-danger:hover { background: rgba(255,107,107,0.15); }

 /* ===== Session ===== */
 .session-header { text-align: center; padding: 8px 0 18px; }
 .session-title { font-size: 21px; font-weight: 800; letter-spacing: -0.4px; margin-bottom: 4px; }
 .session-meta { font-size: 12.5px; color: var(--text-secondary); font-family: var(--font-mono); }

 .timer-wrap { display: flex; justify-content: center; margin: 18px 0 6px; }
 .timer-ring {
  width: 168px; height: 168px; border-radius: 50%;
  background: conic-gradient(var(--accent) var(--p, 0%), var(--bg-input) 0);
  display: flex; align-items: center; justify-content: center; position: relative;
  box-shadow: 0 0 40px rgba(0,212,255,0.12);
 }
 .timer-ring::before {
  content: ''; position: absolute; inset: 10px;
  background: var(--bg-card); border-radius: 50%;
 }
 .timer-time { position: relative; font-family: var(--font-mono); font-size: 38px; font-weight: 700; color: var(--text-primary); letter-spacing: 1px; }
 .timer-sub { position: relative; text-align: center; margin-top: 4px; font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-muted); font-family: var(--font-mono); }

 .goal-box { margin-top: 18px; padding: 14px 16px; border-radius: 12px; background: rgba(167,139,250,0.08); border: 1px solid rgba(167,139,250,0.25); font-size: 13.5px; line-height: 1.6; color: var(--text-primary); }
 .goal-box .goal-label { display: block; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--accent2); font-family: var(--font-mono); margin-bottom: 5px; }

 .check-item {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px;
  cursor: pointer; transition: all 0.18s; background: var(--bg-input);
 }
 .check-item:hover { border-color: var(--border-hover); }
 .check-item.done { opacity: 0.55; border-color: rgba(52,211,153,0.4); }
 .check-item.done .check-label { text-decoration: line-through; }
 .check-box {
  width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0; margin-top: 1px;
  border: 1.5px solid var(--text-muted);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: #040d12; transition: all 0.18s;
 }
 .check-item.done .check-box { background: var(--green); border-color: var(--green); }
 .check-label { font-size: 13.5px; line-height: 1.5; color: var(--text-primary); }

 .key-point { display: flex; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; font-size: 13.5px; line-height: 1.55; color: var(--text-primary); background: var(--bg-input); }
 .key-point .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 8px; }

 .practice-item { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; font-size: 13.5px; line-height: 1.55; color: var(--text-primary); background: var(--bg-input); }

 .section-heading { font-size: 13px; font-weight: 700; margin: 22px 0 12px; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
 .section-heading::before { content: ''; width: 3px; height: 14px; border-radius: 2px; background: var(--accent); }

 .history-item {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px;
  border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px;
  background: var(--bg-input); transition: all 0.18s;
 }
 .history-item:hover { border-color: var(--border-hover); }
 .history-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.18); color: var(--accent); flex-shrink: 0; }
 .history-body { flex: 1; min-width: 0; }
 .history-name { font-size: 13.5px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
 .history-sub { font-size: 11.5px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 3px; }
 .history-status { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; padding: 3px 8px; border-radius: 20px; font-family: var(--font-mono); }
 .history-status.completed { background: rgba(52,211,153,0.12); color: var(--green); }
 .history-status.abandoned { background: rgba(255,107,107,0.12); color: var(--accent3); }
 .history-status.active { background: rgba(0,212,255,0.12); color: var(--accent); }

 .empty-state { text-align: center; padding: 30px 16px; color: var(--text-muted); font-size: 13px; line-height: 1.7; }

 .toast {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary);
  padding: 12px 18px; border-radius: 12px; font-size: 13.5px; z-index: 60;
  opacity: 0; visibility: hidden; transition: all 0.3s; box-shadow: 0 12px 32px rgba(0,0,0,0.4);
  display: flex; align-items: center; gap: 8px; max-width: 90%;
 }
 .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

 .loading { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 46px 20px; color: var(--text-muted); font-size: 13px; }
 .loading-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: aquilaDot 1.2s ease-in-out infinite; }
 .loading-dot:nth-child(2) { animation-delay: 180ms; }
 .loading-dot:nth-child(3) { animation-delay: 360ms; }
 @keyframes learningAlliedDot { 0%,80%,100%{ transform:translateY(0);opacity:.4; } 40%{ transform:translateY(-5px);opacity:1; } }
 @keyframes aquilaDot { 0%,80%,100%{ transform:translateY(0);opacity:.4; } 40%{ transform:translateY(-5px);opacity:1; } }

 .fade-up { animation: fadeUp 0.45s cubic-bezier(0.16,1,0.3,1) both; }

 a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

 @media (max-width: 880px) {
  .topbar { padding: 12px 14px; }
  .content { padding: 22px 16px 28px; }
  .card { padding: 18px; }
  .timer-ring { width: 146px; height: 146px; }
  .timer-time { font-size: 32px; }
 }
 @media (max-width: 420px) { .topbar-mobile-logo span { display: none; } }
</style>
</head>

<script>
/* ── Mobile sidebar — handled by js/components/sidebar.js mountSidebar() — removed duplicate that caused null errors */

/* ── Toast helper (exposed for module) — Learning Allied ── */
window.__aquilaToast = window.__learningAlliedToast = function (msg) {
 let el = document.querySelector('.toast');
 if (!el) {
  el = document.createElement('div');
  el.className = 'toast';
  document.body.appendChild(el);
 }
 el.textContent = msg;
 el.classList.add('show');
 clearTimeout(window.__toastTimer);
 window.__toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
};
</script>
