<style>
/* Styles the markup that study-session.js renders into #contentInner (JS unchanged) */
.content{flex:1;overflow-y:auto;padding:44px 32px 80px;font-family:var(--font-main);color:var(--pm-text);-webkit-font-smoothing:antialiased}
.content::-webkit-scrollbar{width:6px}.content::-webkit-scrollbar-thumb{background:var(--pm-border-strong);border-radius:6px}
#contentInner{max-width:680px;margin:0 auto}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fade-up{animation:rise .3s var(--pm-ease) both}.fade-up:nth-child(3){animation-delay:.05s}.fade-up:nth-child(4){animation-delay:.1s}

.page-title{margin:0;font-family:var(--font-display);font-size:32px;font-weight:700;letter-spacing:-.035em}
.page-sub{margin:8px 0 28px;font-size:14px;line-height:1.6;color:var(--pm-text-2);max-width:560px}

.card{padding:24px;margin-bottom:16px;border-radius:var(--pm-r);background:var(--pm-surface);border:1px solid var(--pm-border);box-shadow:none}
.card-label{font-size:16px;font-weight:600;letter-spacing:-.015em;margin-bottom:4px}
.field-label{font-size:13px;font-weight:500;color:var(--pm-text-2);margin:18px 0 7px}
#contentInner input[type="text"],#contentInner textarea{width:100%;box-sizing:border-box;font-family:inherit;font-size:14px;color:var(--pm-text);background:var(--pm-surface);border:1px solid var(--pm-border-strong);border-radius:var(--pm-r-sm);padding:0 14px;height:42px;outline:none;transition:border-color .16s,box-shadow .16s}
#contentInner textarea{height:auto;min-height:84px;padding:11px 14px;resize:vertical;line-height:1.5}
#contentInner input::placeholder,#contentInner textarea::placeholder{color:var(--pm-text-3)}
#contentInner input:focus,#contentInner textarea:focus{border-color:var(--pm-accent);box-shadow:0 0 0 3px var(--pm-accent-soft)}

.duration-row{display:flex;flex-wrap:wrap;gap:8px}
.duration-chip{height:36px;padding:0 16px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;color:var(--pm-text-2);background:var(--pm-surface);border:1px solid var(--pm-border-strong);border-radius:999px;transition:all .16s var(--pm-ease)}
.duration-chip:hover{color:var(--pm-text);border-color:var(--pm-text-3)}
.duration-chip:active{transform:scale(.97)}
.duration-chip.active{background:var(--pm-inv-bg);color:var(--pm-inv-fg);border-color:transparent}

.btn-gradient{width:100%;height:44px;margin-top:22px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;color:var(--pm-inv-fg);background:var(--pm-inv-bg);border:0;border-radius:999px;position:relative;overflow:hidden;transition:opacity .16s,transform .16s var(--pm-ease)}
.btn-gradient:hover:not(:disabled){opacity:.88;transform:translateY(-1px)}
.btn-gradient:active:not(:disabled){transform:scale(.98)}
.btn-gradient:disabled{opacity:.55;cursor:not-allowed}
.btn-outline,.btn-danger{height:44px;padding:0 16px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.btn-outline[style*="display: block"],.btn-danger[style*="display: block"]{display:inline-flex!important}

/* History */
.history-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--pm-border)}
.history-item:first-child{border-top:0}
.history-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;color:var(--pm-accent);background:var(--pm-accent-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pm-accent) 25%,transparent)}
.history-body{flex:1;min-width:0}
.history-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-sub{font-size:13px;color:var(--pm-text-3);margin-top:2px}
.history-status{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;flex-shrink:0}
.history-status.completed{background:var(--pm-ok-soft);color:var(--pm-ok)}
.history-status.active{background:var(--pm-accent-soft);color:var(--pm-accent)}
.history-status.abandoned{background:var(--pm-bad-soft);color:var(--pm-bad)}
.empty-state{padding:20px 0 4px;font-size:14px;line-height:1.6;color:var(--pm-text-2)}
.loading{display:flex;gap:6px;padding:20px 0;justify-content:center}
.loading-dot{width:6px;height:6px;border-radius:50%;background:var(--pm-text-3);animation:dot 1.2s ease-in-out infinite}
.loading-dot:nth-child(2){animation-delay:.15s}.loading-dot:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}

/* Live session */
.session-header{margin-bottom:20px}
.session-title{font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.25}
.session-meta{margin-top:6px;font-size:14px;color:var(--pm-text-2)}
.timer-wrap{display:flex;justify-content:center;padding:8px 0 4px}
.timer-ring{--p:0%;position:relative;width:200px;height:200px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--pm-accent) var(--p),var(--pm-border) 0);transition:background .4s linear}
.timer-ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--pm-surface)}
.timer-ring>div{position:relative;text-align:center}
.timer-time{font-size:44px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.timer-sub{margin-top:6px;font-size:13px;color:var(--pm-text-3)}
.goal-box{margin-top:20px;padding:12px 16px;text-align:left;font-size:14px;line-height:1.55;background:var(--pm-inset);border-left:2px solid var(--pm-accent);border-radius:0 var(--pm-r-sm) var(--pm-r-sm) 0}
.goal-label{display:block;font-size:12px;font-weight:600;color:var(--pm-text-3);margin-bottom:2px}
.section-heading{font-size:16px;font-weight:600;letter-spacing:-.015em;margin:0 0 6px}
.section-heading:not(:first-child){margin-top:26px}
.check-item{display:flex;align-items:flex-start;gap:12px;padding:12px 2px;border-top:1px solid var(--pm-border);cursor:pointer;transition:background .16s}
.check-item:first-of-type{border-top:0}
.check-item:focus-visible{outline:2px solid var(--pm-accent);outline-offset:2px;border-radius:6px}
.check-box{width:20px;height:20px;margin-top:1px;border-radius:6px;border:1.5px solid var(--pm-border-strong);flex-shrink:0;display:grid;place-items:center;transition:all .16s}
.check-item:hover .check-box{border-color:var(--pm-accent)}
.check-item.done .check-box{background:var(--pm-accent);border-color:var(--pm-accent)}
.check-item.done .check-box::after{content:"✓";font-size:12px;font-weight:700;color:#fff}
.check-label{font-size:14px;line-height:1.55;transition:color .16s}
.check-item.done .check-label{color:var(--pm-text-3);text-decoration:line-through}
.key-point{display:flex;gap:12px;align-items:flex-start;padding:7px 0;font-size:14px;line-height:1.55;color:var(--pm-text)}
.key-point .dot{width:6px;height:6px;border-radius:50%;background:var(--pm-accent);flex-shrink:0;margin-top:8px}
.practice-item{margin-top:10px;padding:12px 16px;font-size:14px;line-height:1.55;background:var(--pm-inset);border:1px solid var(--pm-border);border-radius:var(--pm-r-sm)}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,12px);padding:10px 16px;font-size:14px;z-index:999;opacity:0;pointer-events:none;max-width:calc(100vw - 32px);transition:opacity .2s,transform .2s var(--pm-ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:640px){
 .content{padding:28px 16px 56px}.card{padding:20px}.page-title{font-size:26px}
 .timer-ring{width:176px;height:176px}.timer-time{font-size:38px}
 .btn-outline,.btn-danger{height:46px}.duration-chip{height:40px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Toast used by study-session.js */
window.__learningAlliedToast = window.__aquilaToast = function(msg){
 var t=document.getElementById('toast'); t.textContent=msg; t.className='toast show';
 clearTimeout(window._tt); window._tt=setTimeout(function(){t.className='toast'},3200);
};
/* Keyboard access for the objectives checklist (rendered by study-session.js) */
(function(){
 var root=document.getElementById('contentInner');
 function enhance(){ root.querySelectorAll('.check-item').forEach(function(el){
  if(el.getAttribute('role')) return;
  el.setAttribute('role','checkbox'); el.setAttribute('tabindex','0');
  el.setAttribute('aria-checked', el.classList.contains('done'));
 });}
 new MutationObserver(enhance).observe(root,{childList:true,subtree:true});
 root.addEventListener('click',function(e){ var c=e.target.closest('.check-item'); if(c) setTimeout(function(){c.setAttribute('aria-checked',c.classList.contains('done'))},0); });
 root.addEventListener('keydown',function(e){ var c=e.target.closest&&e.target.closest('.check-item'); if(c&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); c.click(); }});
})();
</script>
