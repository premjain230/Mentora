<style>
.settings-grid { max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:24px; }
.settings-card { background:var(--bg-card);border:1px solid var(--border);border-radius:18px;overflow:hidden;transition:border-color 0.2s; }
.settings-card:hover { border-color:rgba(0,212,255,0.15); }
.card-header { padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px; }
.card-header-icon { width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0; }
.card-header-icon.cyan { background:rgba(0,212,255,0.12); }
.card-header-icon.purple { background:rgba(167,139,250,0.12); }
.card-header-icon.red { background:rgba(255,107,107,0.12); }
.card-header-text h2 { font-size:15px;font-weight:600; }
.card-header-text p { font-size:12px;color:var(--text-muted);margin-top:2px; }
.info-row { display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;margin-bottom:10px; }
.info-row:last-child { margin-bottom:0; }
.info-label { font-size:12px;color:var(--text-muted);margin-bottom:3px;font-weight:500;text-transform:uppercase;letter-spacing:0.8px; }
.info-value { font-size:13.5px;font-weight:500;word-break:break-all; }
.info-badge { font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:rgba(0,212,255,0.1);color:var(--cyan);border:1px solid rgba(0,212,255,0.2);white-space:nowrap;flex-shrink:0;margin-left:10px; }
.form-meta { display:flex;justify-content:space-between;align-items:center;margin-top:5px; }
.char-count { font-size:11px;color:var(--text-muted);font-family:var(--font-mono); }
.form-input[disabled] { opacity:0.55;cursor:not-allowed; }
.btn-row { display:flex;gap:10px;flex-wrap:wrap; }
.danger-zone { border:1px solid rgba(255,107,107,0.18);border-radius:10px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap; }
.danger-zone-text h4 { font-size:13px;font-weight:600;color:var(--red); }
.danger-zone-text p { font-size:12px;color:var(--text-muted);margin-top:2px; }
.toast-icon { font-size:16px; }
@media (max-width:520px) {
  .btn-row { flex-direction:column; }
  .modal-actions { flex-direction:column-reverse; }
  .danger-zone { flex-direction:column;align-items:flex-start; }
}

<script>
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('sidebarOverlay');
const menuBtn = document.getElementById('menuBtn');
const closeBtn = document.getElementById('sidebarClose');

function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('open'); }
function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
menuBtn.addEventListener('click', openSidebar);
closeBtn.addEventListener('click', closeSidebar);
overlay.addEventListener('click', closeSidebar);
document.querySelectorAll('.nav-item:not(.nav-group-toggle)').forEach((link) => {
  link.addEventListener('click', () => { if (window.innerWidth <= 880) closeSidebar(); });
});
function toggleNavGroup(el) {
  el.classList.toggle('open');
  const children = el.nextElementSibling;
  if (children) children.classList.toggle('open');
}

function updateCharCount(el, counterId, max) {
  document.getElementById(counterId).textContent = `${el.value.length} / ${max}`;
}

function showToast(message, type = 'success') {
  const icon = type === 'success' ? '✅' : '❌';
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span class="toast-icon">${icon}</span>${message}`;
  const container = document.getElementById('toastContainer');
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(10px)';
    toast.style.transition = 'opacity 0.3s, transform 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

const logoutModal = document.getElementById('logoutModal');
document.getElementById('logoutBtn').addEventListener('click', () => logoutModal.classList.add('open'));
document.getElementById('signOutBtnSidebar').addEventListener('click', () => logoutModal.classList.add('open'));
document.getElementById('cancelLogout').addEventListener('click', () => logoutModal.classList.remove('open'));
logoutModal.addEventListener('click', (e) => { if (e.target === logoutModal) logoutModal.classList.remove('open'); });
</script>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { collection, addDoc, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getUserPlan } from "./subscription.js";

if (!auth) { document.getElementById('stateLoading').textContent = 'Firebase unavailable. Please try again.'; return; }
let currentUser = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = "login.html"; return; }
  currentUser = user;
  const name = user.displayName || user.email?.split("@")[0] || "Guest";
  document.getElementById("userName").textContent = name;
  document.getElementById("displayName").textContent = user.displayName || name;
  document.getElementById("displayEmail").textContent = user.email || "—";
  document.getElementById("supportFrom").value = user.email || "";
  const avatar = document.getElementById("userAvatar");
  if (user.photoURL) {
    avatar.innerHTML = `<img src="${escAttr(user.photoURL)}" alt="${escAttr(name)}" />`;
  } else {
    avatar.textContent = name.charAt(0).toUpperCase();
  }

  const plan = await getUserPlan(user.uid, user);
  const planLabel = plan === "pro" ? "✨ Aquila Pro" : "Free Plan";
  document.getElementById("userPlan").textContent = planLabel;
  const dispPlan = document.getElementById("displayPlan");
  if (dispPlan) dispPlan.textContent = planLabel;

  // Ensure user doc exists (fallback if sign-up write failed)
  const userRef = doc(db, "users", user.uid);
  const userSnap = await getDoc(userRef);
  if (!userSnap.exists()) {
    setDoc(userRef, {
      uid: user.uid,
      displayName: user.displayName || "",
      email: user.email || "",
      photoURL: user.photoURL || "",
      exam: "",
      createdAt: serverTimestamp(),
      plan: "free",
    }).catch(() => {});
  }
});

document.getElementById("confirmLogout").addEventListener("click", async () => {
  try { await signOut(authInstance); window.location.href = "login.html"; }
  catch (err) { showToast("Sign out failed. Please try again.", "error"); }
});

window.sendSupport = async function sendSupport() {
  const subject = document.getElementById("supportSubject").value.trim();
  const message = document.getElementById("supportMessage").value.trim();
  const btn = document.getElementById("sendSupportBtn");
  if (!subject) { showToast("Please enter a subject.", "error"); return; }
  if (!message) { showToast("Please enter a message.", "error"); return; }
  if (!currentUser) { showToast("You must be signed in to send a message.", "error"); return; }
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Sending…`;
  try {
    await addDoc(collection(db, "support_requests"), {
      uid: currentUser.uid, email: currentUser.email || "",
      displayName: currentUser.displayName || "", subject, message,
      createdAt: serverTimestamp(), status: "open",
    });
    document.getElementById("supportSubject").value = "";
    document.getElementById("supportMessage").value = "";
    document.getElementById("subjectCount").textContent = "0 / 100";
    document.getElementById("messageCount").textContent = "0 / 1000";
    showToast("Your message has been sent successfully!", "success");
  } catch (err) {
    console.error("Support send error:", err);
    showToast("Failed to send message. Please try again.", "error");
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Send message`;
  }
};

function escAttr(v) {
  return String(v).replace(/[&<>"'`]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
}
</script>
<script type="module">import { inject } from 'https://esm.sh/@vercel/analytics'; inject();</script>
<script type="module">import { injectSpeedInsights } from 'https://esm.sh/@vercel/speed-insights'; injectSpeedInsights();</script>
