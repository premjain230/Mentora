<script>
async function checkVerification() {
 const btn = document.getElementById('checkBtn');
 btn.classList.add('loading');
 btn.textContent = 'Checking…';
 try {
  const { checkEmailVerified } = await import('./auth.js');
  const verified = await checkEmailVerified();
  if (verified) {
   window.location.href = 'home.html';
  } else {
   showMsg('Not verified yet. Please click the link in your email, then try again.');
   btn.classList.remove('loading');
   btn.textContent = "I've verified — continue";
  }
 } catch (e) {
  showMsg('Something went wrong. Please try again.');
  btn.classList.remove('loading');
  btn.textContent = "I've verified — continue";
 }
}
async function resendEmail() {
 const btn = document.getElementById('resendBtn');
 btn.textContent = 'Sending…';
 btn.style.pointerEvents = 'none';
 try {
  const { resendVerificationEmail } = await import('./auth.js');
  await resendVerificationEmail();
 } catch (e) {}
 btn.textContent = 'Resend verification email';
 btn.style.pointerEvents = '';
}
function showMsg(text, isError = true) {
 const el = document.getElementById('authMsg');
 el.textContent = text;
 el.style.background = isError ? 'rgba(244,114,182,0.12)' : 'rgba(6,214,207,0.12)';
 el.style.border = isError ? '1px solid rgba(244,114,182,0.3)' : '1px solid rgba(6,214,207,0.3)';
 el.style.color = isError ? '#f472b6' : '#06d6cf';
}
(async function init() {
 const { auth } = await import('./firebase-config.js');
 const { onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
 onAuthStateChanged(auth, (user) => {
  if (!user) {
   window.location.href = 'login.html';
   return;
  }
  if (user.emailVerified) {
   window.location.href = 'home.html';
   return;
  }
  document.getElementById('emailDisplay').textContent = user.email;
 });
})();
</script>
