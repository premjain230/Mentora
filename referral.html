<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ref-bg:#000000;--ref-surface:#0a0a0a;--ref-card:#0a0a0a;--ref-border:#222222;--ref-border-strong:#333333;--ref-text:#f5f5f5;--ref-text-secondary:#a8a8a8;--ref-text-muted:#737373;--ref-accent:#ff8a1f;--ref-accent-soft:rgba(255,138,31,0.14);--ref-green:#10b981;--ref-amber:#f59e0b;--ref-radius:24px;--ref-font:'Space Grotesk',Inter,sans-serif;--ref-mono:'JetBrains Mono','Space Mono',monospace}
.light-mode{--ref-bg:#f4f4f4;--ref-surface:#ffffff;--ref-card:#ffffff;--ref-border:#e3e3e3;--ref-border-strong:#cfcfcf;--ref-text:#0a0a0a;--ref-text-secondary:#4a4a4a;--ref-text-muted:#8a8a8a;--ref-accent:#ea6a00;--ref-accent-soft:rgba(234,106,0,0.10);--ref-green:#0f9d6b;--ref-amber:#b7791f}
body{background:var(--ref-bg);color:var(--ref-text);font-family:var(--ref-font);min-height:100vh}
.ref-container{max-width:720px;margin:0 auto;padding:24px 16px 64px}
.ref-header{text-align:center;padding:32px 0 24px}
.ref-header h1{font-size:28px;font-weight:700;letter-spacing:-0.03em;margin-bottom:6px}
.ref-header p{color:var(--ref-text-secondary);font-size:14px;line-height:1.5}
.share-card{background:var(--ref-card);border:1px solid var(--ref-border);border-radius:var(--ref-radius);padding:24px;margin-bottom:20px}
.share-label{font-size:12px;color:var(--ref-text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:600}
.share-link-wrap{display:flex;gap:8px;margin-bottom:12px}
.share-link-wrap input{flex:1;background:var(--ref-surface);border:1px solid var(--ref-border);border-radius:var(--radius-md);padding:12px 14px;color:var(--ref-text);font-family:var(--ref-mono);font-size:13px;outline:none}
.share-link-wrap input:focus{border-color:var(--ref-accent)}
.share-link-wrap button{background:var(--pill-bg,#ffffff);border:none;border-radius:999px;padding:12px 20px;color:var(--pill-fg,#000000);font-weight:600;font-size:13px;font-family:var(--ref-font);cursor:pointer;transition:opacity 0.15s;white-space:nowrap}
.share-link-wrap button:hover{opacity:0.88}
.share-link-wrap button:active{transform:translateY(0)}
.share-btns{display:flex;gap:8px;flex-wrap:wrap}
.share-btns button{flex:1;min-width:100px;padding:10px;border-radius:999px;border:1px solid var(--ref-border);background:var(--ref-surface);color:var(--ref-text-secondary);font-size:12px;font-weight:500;font-family:var(--ref-font);cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.share-btns button:hover{border-color:var(--ref-border-strong);color:var(--ref-text);background:var(--ref-surface)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--ref-card);border:1px solid var(--ref-border);border-radius:var(--ref-radius);padding:16px;text-align:center}
.stat-card .value{font-size:28px;font-weight:700;letter-spacing:-0.03em;margin-bottom:2px}
.stat-card .label{font-size:11px;color:var(--ref-text-muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:500}
.tier-progress{background:var(--ref-card);border:1px solid var(--ref-border);border-radius:var(--ref-radius);padding:24px;margin-bottom:20px}
.tier-progress h3{font-size:16px;font-weight:600;margin-bottom:16px}
.tier-bar{height:8px;background:var(--ref-surface);border-radius:999px;overflow:hidden;margin-bottom:10px}
.tier-fill{height:100%;background:linear-gradient(90deg,var(--ref-accent),var(--ref-accent));border-radius:999px;transition:width 0.5s cubic-bezier(0.16,1,0.3,1)}
.tier-info{display:flex;justify-content:space-between;font-size:12px;color:var(--ref-text-secondary)}
.tier-next{color:var(--ref-accent);font-weight:600}
.badges-section{background:var(--ref-card);border:1px solid var(--ref-border);border-radius:var(--ref-radius);padding:24px;margin-bottom:20px}
.badges-section h3{font-size:16px;font-weight:600;margin-bottom:16px}
.badges-grid{display:flex;gap:12px;flex-wrap:wrap}
.badge-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 12px;background:var(--ref-card);border:1px solid var(--ref-border);border-radius:var(--ref-radius);min-width:80px;transition:all 0.15s;opacity:0.3;filter:grayscale(1)}
.badge-item.unlocked{opacity:1;filter:none;border-color:color-mix(in srgb, var(--ref-accent) 30%, transparent)}
.badge-icon{font-size:28px}
.badge-name{font-size:10px;color:var(--ref-text-muted);text-align:center;font-weight:500}
.badge-item.unlocked .badge-name{color:var(--ref-text)}
.referrals-list{background:var(--ref-card);border:1px solid var(--ref-border);border-radius:var(--ref-radius);padding:24px;margin-bottom:20px}
.referrals-list h3{font-size:16px;font-weight:600;margin-bottom:12px}
.referral-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ref-border);font-size:13px}
.referral-row:last-child{border-bottom:none}
.ref-status{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}
.ref-status.pending{background:color-mix(in srgb, var(--ref-amber) 12%, transparent);color:var(--ref-amber)}
.ref-status.rewarded{background:color-mix(in srgb, var(--ref-green) 12%, transparent);color:var(--ref-green)}
.empty-state{text-align:center;padding:24px;color:var(--ref-text-muted);font-size:13px}
.perks-list{background:var(--ref-card);border:1px solid var(--ref-border);border-radius:var(--ref-radius);padding:24px;margin-bottom:20px}
.perk-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ref-border);font-size:13px}
.perk-item:last-child{border-bottom:none}
.perk-check{color:var(--ref-green);font-weight:700}
.perk-icon{font-size:18px}.perk-info{flex:1}.perk-info strong{display:block;margin-bottom:2px}
.perk-req{font-size:11px;color:var(--ref-text-muted)}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--ref-text-muted);text-decoration:none;font-size:13px;margin-bottom:16px;transition:color 0.15s}
.back-link:hover{color:var(--ref-text)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ref-card);border:1px solid color-mix(in srgb, var(--ref-accent) 30%, transparent);border-radius:999px;padding:12px 20px;font-size:13px;color:var(--ref-accent);z-index:999;opacity:0;transition:opacity 0.3s}
.toast.show{opacity:1}
@media(max-width:480px){.stats-grid{grid-template-columns:repeat(3,1fr);gap:8px}.stat-card{padding:12px}.stat-card .value{font-size:20px}}
@media(max-width:400px){.stats-grid{grid-template-columns:1fr 1fr}.stat-card .value{font-size:22px}}
/* prefers-color-scheme removed: app uses .light-mode class instead */
</style>
</head>
<body>
<div id="sidebarMount"></div>



<main class="main">
<div class="topbar">
  <div class="topbar-left">
    <button class="menu-btn" id="menuBtn" aria-label="Open menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="topbar-mobile-logo"><img src="/learningallied-white.svg" alt="Learning Allied" class="logo-img"><span class="logo-text">Learning Allied</span></div>
  </div>
  <div class="topbar-right">
    <a href="/home" class="back-link" style="margin-bottom:0;">← Home</a>
  </div>
</div>
  <div class="topbar" style="background:var(--bg-base);border-bottom:1px solid var(--border-subtle);">
    <div class="topbar-left">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-mobile-logo"><img src="/learningallied-white.svg" alt="Learning Allied" class="logo-img"><span class="logo-text">Learning Allied</span></div>
      <div style="display:none;" class="model-selector"><span class="model-dot"></span>Learning Allied</div>
      <div id="topbarGreeting" style="font-size:14px;font-weight:500;color:var(--text-secondary);margin-left:8px;">Hi, <span id="greetingName">there</span></div>
    </div>
    <div style="flex:1;display:flex;justify-content:center;max-width:480px;margin:0 16px;" class="topbar-center"></div>
    <div style="display:flex;align-items:center;gap:12px;" class="topbar-right">
      <button style="width:36px;height:36px;border-radius:999px;background:var(--bg-card);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-muted);position:relative;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8a6 6 0 0 1 12 0c0 7-6 11-6 11s-6-4-6-11"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span style="position:absolute;top:6px;right:7px;width:7px;height:7px;background:var(--green);border-radius:50%;border:1px solid var(--bg-card);"></span></button>
      <div style="display:flex;align-items:center;gap:8px;cursor:pointer;">
        <img id="topbarAvatar" src="" data-pending-avatar="1" alt="User" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--border);" />
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-muted);"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>
  </div>

  <main class="main" style="overflow-y:auto;">
<div class="ref-container">
 <a href="home.html" class="back-link">&larr; Back to Dashboard</a>
 <div class="ref-header">
  <h1>Refer & Earn</h1>
  <p>Invite friends to Learning Allied. You both get rewards.</p>
 </div>
 <div id="loadingState" style="text-align:center;padding:60px 0;color:var(--text-muted);font-size:14px">Loading...</div>
 <div id="dashboardContent" style="display:none"></div>
 <div id="authRequired" style="display:none;text-align:center;padding:60px 0">
  <p style="font-size:18px;margin-bottom:12px">Sign in to view your referral dashboard</p>
  <a href="login.html" style="display:inline-block;padding:12px 28px;background:var(--accent);color:#050505;border-radius:var(--radius);text-decoration:none;font-weight:600">Sign In</a>
 </div>
</div>
</main>
<div id="toast" class="toast"></div>

<script type="module">
import { auth } from './firebase-config.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getReferralCode, getDashboard, getTiers, getBadges, shareReferral, startDashboardRefresh, stopDashboardRefresh } from './modules/referral-system.js';
import { ensureModulesInitialized } from './chat.js';
import { populateSidebarUser } from './js/components/sidebar.js';
import { getUserPlan } from './subscription.js';

const BASE = location.origin;

function $(id) { return document.getElementById(id); }

function showToast(msg) {
 const t = $('toast');
 t.textContent = msg;
 t.classList.add('show');
 setTimeout(() => t.classList.remove('show'), 2500);
}

async function render(uid) {
 try {
  const [dashboard, tiersData, badgesData] = await Promise.all([
   getDashboard(uid),
   getTiers(),
   getBadges(),
  ]);

  const loading = $('loadingState');
  const content = $('dashboardContent');
  loading.style.display = 'none';
  content.style.display = 'block';

  const tiers = tiersData.tiers || [];
  const allBadges = badgesData.badges || [];

  const codeData = dashboard.referralCode
   ? { code: dashboard.referralCode, link: `${BASE}/signup.html?ref=${dashboard.referralCode}` }
   : await getReferralCode(uid);

  const percent = dashboard.nextRewardAt !== null && dashboard.nextReward !== undefined
   ? Math.min(100, Math.round((1 - dashboard.nextRewardAt / (dashboard.nextReward?.minRefs || dashboard.nextRewardAt + 1)) * 100))
   : 100;

  const ownedBadges = new Set((dashboard.badges || []).map(b => b.id));

  content.innerHTML = `
   <div class="share-card">
    <div class="share-label">Your Referral Link</div>
    <div class="share-link-wrap">
     <input type="text" id="refLink" value="${codeData.link}" readonly onclick="this.select()"/>
     <button id="copyBtn">Copy</button>
    </div>
    <div class="share-btns">
     <button data-share="whatsapp">WhatsApp</button>
     <button data-share="telegram">Telegram</button>
     <button data-share="twitter">Twitter</button>
     <button data-share="native">Share</button>
    </div>
   </div>

   <div class="stats-grid">
    <div class="stat-card"><div class="value" style="color:var(--green)">${dashboard.totalReferrals}</div><div class="label">Referred</div></div>
    <div class="stat-card"><div class="value" style="color:var(--accent)">${dashboard.pendingReferrals}</div><div class="label">Pending</div></div>
    <div class="stat-card"><div class="value" style="color:var(--accent2)">${dashboard.level || 1}</div><div class="label">Level</div></div>
   </div>

   <div class="tier-progress">
    <h3>
     ${dashboard.nextReward
      ? `Next Reward: Invite ${dashboard.nextRewardAt} more friend${dashboard.nextRewardAt !== 1 ? 's' : ''}`
      : 'All Rewards Unlocked!'}
    </h3>
    <div class="tier-bar"><div class="tier-fill" style="width:${percent}%"></div></div>
    <div class="tier-info">
     <span>${dashboard.rewardTierName || 'Level ' + dashboard.rewardTier}</span>
     ${dashboard.nextReward ? `<span class="tier-next">${dashboard.nextReward.badge ? '🏆' : '🎁'} ${dashboard.nextReward.bonusChats ? dashboard.nextReward.bonusChats + ' chats' : dashboard.nextReward.proDays ? dashboard.nextReward.proDays + 'd Pro' : dashboard.nextReward.quizDays ? dashboard.nextReward.quizDays + 'd Quiz' : ''}</span>` : '<span>🎉 Complete</span>'}
    </div>
   </div>

   <div class="perks-list">
    <h3>Reward Tiers</h3>
    ${tiers.map(t => `
     <div class="perk-item" style="${dashboard.totalReferrals >= t.minRefs ? 'opacity:1' : 'opacity:0.5'}">
      <span class="perk-check">${dashboard.totalReferrals >= t.minRefs ? '✅' : '🔒'}</span>
      <div class="perk-info">
       <strong>${t.badge ? BADGE_NAMES[t.badge] + ' ' + (BADGE_ICONS[t.badge] || '') : '🎁 ' + (t.bonusChats ? t.bonusChats + ' Bonus Chats' : t.proDays ? t.proDays + ' Days Pro' : t.quizDays + ' Days Premium Quiz')}</strong>
      </div>
      <span class="perk-req">${t.minRefs} referral${t.minRefs !== 1 ? 's' : ''}</span>
     </div>
    `).join('')}
   </div>

   <div class="badges-section">
    <h3>Badges</h3>
    <div class="badges-grid">
     ${allBadges.map(b => `
      <div class="badge-item${ownedBadges.has(b.id) ? ' unlocked' : ''}">
       <div class="badge-icon">${BADGE_ICONS[b.id] || '🏅'}</div>
       <div class="badge-name">${b.name}</div>
      </div>
     `).join('')}
    </div>
   </div>

   ${dashboard.referrals && dashboard.referrals.length > 0 ? `
    <div class="referrals-list">
     <h3>Recent Referrals (${dashboard.referrals.length})</h3>
     ${dashboard.referrals.map(r => `
      <div class="referral-row">
       <span style="color:var(--text-secondary)">${new Date(r.createdAt || Date.now()).toLocaleDateString()}</span>
       <span class="ref-status ${r.status}">${r.status}</span>
      </div>
     `).join('')}
    </div>
   ` : `
    <div class="referrals-list">
     <h3>Recent Referrals</h3>
     <div class="empty-state">Invite friends to see them here.</div>
    </div>
   `}
  `;

  const BADGE_ICONS = {};
  const BADGE_NAMES = {};
  allBadges.forEach(b => { BADGE_ICONS[b.id] = b.icon; BADGE_NAMES[b.id] = b.name; });

  document.getElementById('copyBtn').addEventListener('click', () => {
   navigator.clipboard.writeText(codeData.link).catch(() => {});
   showToast('Link copied!');
  });

  document.querySelectorAll('[data-share]').forEach(btn => {
   btn.addEventListener('click', () => {
    const type = btn.dataset.share;
    const text = encodeURIComponent('Learn faster with Learning Allied — a neuroscience-powered study companion! 🧠✨');
    const url = encodeURIComponent(codeData.link);
    const links = {
     whatsapp: `https://wa.me/?text=${text}%20${url}`,
     telegram: `https://t.me/share/url?url=${url}&text=${text}`,
     twitter: `https://twitter.com/intent/tweet?text=${text}&url=${url}`,
     native: null,
    };
    if (type === 'native') {
     shareReferral(codeData.link);
     showToast('Sharing...');
    } else if (links[type]) {
     window.open(links[type], '_blank', 'noopener,noreferrer');
    }
   });
  });

  startDashboardRefresh(uid);
 } catch (e) {
  console.error('Referral dashboard error:', e);
  const loading = $('loadingState');
  loading.innerHTML = `<span style="color:var(--accent3)">Failed to load. <button onclick="location.reload()" style="background:var(--card);border:1px solid var(--border);padding:8px 16px;border-radius:8px;color:var(--text);cursor:pointer;font-family:var(--font);margin-top:8px">Retry</button></span><br><span style="font-size:12px;color:var(--text-muted);margin-top:8px;display:inline-block">${e.message}</span>`;
 }
}

onAuthStateChanged(auth, async user => {
 if (!user) {
  $('loadingState').style.display = 'none';
  $('authRequired').style.display = 'block';
  return;
 }
 try {
  const plan = await getUserPlan(user.uid, user);
  const mount = document.getElementById('sidebarMount');
  populateSidebarUser(user, plan, mount);
 } catch(e) {}
 ensureModulesInitialized().then(() => render(user.uid));
});

window.addEventListener('beforeunload', stopDashboardRefresh);
</script>
<script type="module" src="/js/pro-ring.js"></script>
</main>
<script type="module">
import { mountSidebar } from '/js/components/sidebar.js';
mountSidebar('/referral').catch(() => {});
</script>
</body>
