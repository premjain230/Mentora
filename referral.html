<!DOCTYPE html>
<html lang="en">
<script>document.documentElement.className=localStorage.getItem('aquila-theme')==='dark'?'':'light-mode'</script>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://www.gstatic.com https://apis.google.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' blob: https://www.googleapis.com https://esm.sh https://www.gstatic.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; object-src 'none'; frame-src 'self' https://www.gstatic.com;">
<meta name="description" content="Refer friends to Aquila AI and unlock rewards — more AI chats, premium quizzes, and Pro access."/>
<link rel="canonical" href="https://aquila-sand.vercel.app/referral.html"/>
<meta property="og:title" content="Refer & Earn — Aquila AI"/>
<meta property="og:description" content="Invite friends to Aquila AI and unlock premium rewards."/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://aquila-sand.vercel.app/referral.html"/>
<title>Refer & Earn — Aquila AI</title>
<meta name="referrer" content="no-referrer-when-downgrade">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0b0f;--surface:#0f1117;--card:#1a1d27;--card2:#1e2130;--border:rgba(255,255,255,0.07);--border-hover:rgba(255,255,255,0.12);--text:#f0f0f8;--text-secondary:#8b8fa8;--text-muted:#4a4d62;--accent:#00d4ff;--accent2:#a78bfa;--accent3:#ff6b6b;--green:#22c55e;--amber:#f59e0b;--radius:12px;--font:'Sora',sans-serif;--mono:'Space Mono',monospace}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
.ref-container{max-width:720px;margin:0 auto;padding:24px 16px 64px}
.ref-header{text-align:center;padding:32px 0 24px}
.ref-header h1{font-size:28px;font-weight:800;letter-spacing:-0.5px;margin-bottom:6px}
.ref-header p{color:var(--text-secondary);font-size:14px;line-height:1.5}
.share-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px}
.share-label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:600}
.share-link-wrap{display:flex;gap:8px;margin-bottom:12px}
.share-link-wrap input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;color:var(--text);font-family:var(--mono);font-size:13px;outline:none}
.share-link-wrap input:focus{border-color:var(--accent)}
.share-link-wrap button{background:var(--accent);border:none;border-radius:var(--radius);padding:12px 20px;color:#050505;font-weight:600;font-size:13px;font-family:var(--font);cursor:pointer;transition:all 0.15s;white-space:nowrap}
.share-link-wrap button:hover{background:#33ddff;transform:translateY(-1px)}
.share-link-wrap button:active{transform:translateY(0)}
.share-btns{display:flex;gap:8px;flex-wrap:wrap}
.share-btns button{flex:1;min-width:100px;padding:10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);color:var(--text-secondary);font-size:12px;font-weight:500;font-family:var(--font);cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.share-btns button:hover{border-color:var(--border-hover);color:var(--text);background:var(--card2)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.stat-card .value{font-size:28px;font-weight:800;letter-spacing:-0.5px;margin-bottom:2px}
.stat-card .label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:500}
.tier-progress{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px}
.tier-progress h3{font-size:16px;font-weight:600;margin-bottom:16px}
.tier-bar{height:8px;background:var(--card);border-radius:10px;overflow:hidden;margin-bottom:10px}
.tier-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:10px;transition:width 0.5s cubic-bezier(0.16,1,0.3,1)}
.tier-info{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary)}
.tier-next{color:var(--accent);font-weight:600}
.badges-section{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px}
.badges-section h3{font-size:16px;font-weight:600;margin-bottom:16px}
.badges-grid{display:flex;gap:12px;flex-wrap:wrap}
.badge-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);min-width:80px;transition:all 0.15s;opacity:0.3;filter:grayscale(1)}
.badge-item.unlocked{opacity:1;filter:none;border-color:rgba(0,212,255,0.3)}
.badge-icon{font-size:28px}
.badge-name{font-size:10px;color:var(--text-muted);text-align:center;font-weight:500}
.badge-item.unlocked .badge-name{color:var(--text)}
.referrals-list{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px}
.referrals-list h3{font-size:16px;font-weight:600;margin-bottom:12px}
.referral-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.referral-row:last-child{border-bottom:none}
.ref-status{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.ref-status.pending{background:rgba(245,158,11,0.12);color:var(--amber)}
.ref-status.rewarded{background:rgba(34,197,94,0.12);color:var(--green)}
.empty-state{text-align:center;padding:24px;color:var(--text-muted);font-size:13px}
.perks-list{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px}
.perk-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.perk-item:last-child{border-bottom:none}
.perk-check{color:var(--green);font-weight:700}
.perk-icon{font-size:18px}.perk-info{flex:1}.perk-info strong{display:block;margin-bottom:2px}
.perk-req{font-size:11px;color:var(--text-muted)}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);text-decoration:none;font-size:13px;margin-bottom:16px;transition:color 0.15s}
.back-link:hover{color:var(--text)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid rgba(0,212,255,0.3);border-radius:var(--radius);padding:12px 20px;font-size:13px;color:var(--accent);z-index:999;opacity:0;transition:opacity 0.3s}
.toast.show{opacity:1}
@media(max-width:480px){.stats-grid{grid-template-columns:repeat(3,1fr);gap:8px}.stat-card{padding:12px}.stat-card .value{font-size:20px}}
@media(prefers-color-scheme:light){:root{--bg:#f4f5f9;--surface:#ffffff;--card:#f0f1f6;--card2:#e8e9f0;--border:rgba(0,0,0,0.08);--text:#1a1a2e;--text-secondary:#6b6f8a;--text-muted:#a0a3b8}.share-btns button{color:var(--text-secondary)}}
</style>
</head>
<body>
<div class="ref-container">
  <a href="home.html" class="back-link">&larr; Back to Dashboard</a>
  <div class="ref-header">
    <h1>Refer & Earn</h1>
    <p>Invite friends to Aquila AI. You both get rewards.</p>
  </div>
  <div id="loadingState" style="text-align:center;padding:60px 0;color:var(--text-muted);font-size:14px">Loading...</div>
  <div id="dashboardContent" style="display:none"></div>
  <div id="authRequired" style="display:none;text-align:center;padding:60px 0">
    <p style="font-size:18px;margin-bottom:12px">Sign in to view your referral dashboard</p>
    <a href="login.html" style="display:inline-block;padding:12px 28px;background:var(--accent);color:#050505;border-radius:var(--radius);text-decoration:none;font-weight:600">Sign In</a>
  </div>
</div>
<div id="toast" class="toast"></div>

<script type="module">
import { auth } from './firebase-config.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getReferralCode, getDashboard, getTiers, getBadges, shareReferral, startDashboardRefresh, stopDashboardRefresh } from './modules/referral-system.js';
import { ensureModulesInitialized } from './chat.js';

const BASE = 'https://aquila-sand.vercel.app';

function $(id) { return document.getElementById(id); }

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function render(uid) {
  try {
    const [dashboard, tiersData, badgesData] = await Promise.all([
      getDashboard(uid),
      getTiers(),
      getBadges(),
    ]);

    const loading = $('loadingState');
    const content = $('dashboardContent');
    loading.style.display = 'none';
    content.style.display = 'block';

    const tiers = tiersData.tiers || [];
    const allBadges = badgesData.badges || [];

    const codeData = dashboard.referralCode
      ? { code: dashboard.referralCode, link: `${BASE}/signup.html?ref=${dashboard.referralCode}` }
      : await getReferralCode(uid);

    const percent = dashboard.nextRewardAt !== null && dashboard.nextReward !== undefined
      ? Math.min(100, Math.round((1 - dashboard.nextRewardAt / (dashboard.nextReward?.minRefs || dashboard.nextRewardAt + 1)) * 100))
      : 100;

    const ownedBadges = new Set((dashboard.badges || []).map(b => b.id));

    content.innerHTML = `
      <div class="share-card">
        <div class="share-label">Your Referral Link</div>
        <div class="share-link-wrap">
          <input type="text" id="refLink" value="${codeData.link}" readonly onclick="this.select()"/>
          <button id="copyBtn">Copy</button>
        </div>
        <div class="share-btns">
          <button data-share="whatsapp">WhatsApp</button>
          <button data-share="telegram">Telegram</button>
          <button data-share="twitter">Twitter</button>
          <button data-share="native">Share</button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><div class="value" style="color:var(--green)">${dashboard.totalReferrals}</div><div class="label">Referred</div></div>
        <div class="stat-card"><div class="value" style="color:var(--accent)">${dashboard.pendingReferrals}</div><div class="label">Pending</div></div>
        <div class="stat-card"><div class="value" style="color:var(--accent2)">${dashboard.level || 1}</div><div class="label">Level</div></div>
      </div>

      <div class="tier-progress">
        <h3>
          ${dashboard.nextReward
            ? `Next Reward: Invite ${dashboard.nextRewardAt} more friend${dashboard.nextRewardAt !== 1 ? 's' : ''}`
            : 'All Rewards Unlocked!'}
        </h3>
        <div class="tier-bar"><div class="tier-fill" style="width:${percent}%"></div></div>
        <div class="tier-info">
          <span>${dashboard.rewardTierName || 'Level ' + dashboard.rewardTier}</span>
          ${dashboard.nextReward ? `<span class="tier-next">${dashboard.nextReward.badge ? '🏆' : '🎁'} ${dashboard.nextReward.bonusChats ? dashboard.nextReward.bonusChats + ' chats' : dashboard.nextReward.proDays ? dashboard.nextReward.proDays + 'd Pro' : dashboard.nextReward.quizDays ? dashboard.nextReward.quizDays + 'd Quiz' : ''}</span>` : '<span>🎉 Complete</span>'}
        </div>
      </div>

      <div class="perks-list">
        <h3>Reward Tiers</h3>
        ${tiers.map(t => `
          <div class="perk-item" style="${dashboard.totalReferrals >= t.minRefs ? 'opacity:1' : 'opacity:0.5'}">
            <span class="perk-check">${dashboard.totalReferrals >= t.minRefs ? '✅' : '🔒'}</span>
            <div class="perk-info">
              <strong>${t.badge ? BADGE_NAMES[t.badge] + ' ' + (BADGE_ICONS[t.badge] || '') : '🎁 ' + (t.bonusChats ? t.bonusChats + ' Bonus Chats' : t.proDays ? t.proDays + ' Days Pro' : t.quizDays + ' Days Premium Quiz')}</strong>
            </div>
            <span class="perk-req">${t.minRefs} referral${t.minRefs !== 1 ? 's' : ''}</span>
          </div>
        `).join('')}
      </div>

      <div class="badges-section">
        <h3>Badges</h3>
        <div class="badges-grid">
          ${allBadges.map(b => `
            <div class="badge-item${ownedBadges.has(b.id) ? ' unlocked' : ''}">
              <div class="badge-icon">${BADGE_ICONS[b.id] || '🏅'}</div>
              <div class="badge-name">${b.name}</div>
            </div>
          `).join('')}
        </div>
      </div>

      ${dashboard.referrals && dashboard.referrals.length > 0 ? `
        <div class="referrals-list">
          <h3>Recent Referrals (${dashboard.referrals.length})</h3>
          ${dashboard.referrals.map(r => `
            <div class="referral-row">
              <span style="color:var(--text-secondary)">${new Date(r.createdAt || Date.now()).toLocaleDateString()}</span>
              <span class="ref-status ${r.status}">${r.status}</span>
            </div>
          `).join('')}
        </div>
      ` : `
        <div class="referrals-list">
          <h3>Recent Referrals</h3>
          <div class="empty-state">Invite friends to see them here.</div>
        </div>
      `}
    `;

    const BADGE_ICONS = {};
    const BADGE_NAMES = {};
    allBadges.forEach(b => { BADGE_ICONS[b.id] = b.icon; BADGE_NAMES[b.id] = b.name; });

    document.getElementById('copyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(codeData.link).catch(() => {});
      showToast('Link copied!');
    });

    document.querySelectorAll('[data-share]').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.dataset.share;
        const text = encodeURIComponent('Learn faster with Aquila AI — a neuroscience-powered study companion! 🧠✨');
        const url = encodeURIComponent(codeData.link);
        const links = {
          whatsapp: `https://wa.me/?text=${text}%20${url}`,
          telegram: `https://t.me/share/url?url=${url}&text=${text}`,
          twitter: `https://twitter.com/intent/tweet?text=${text}&url=${url}`,
          native: null,
        };
        if (type === 'native') {
          shareReferral(codeData.link);
          showToast('Sharing...');
        } else if (links[type]) {
          window.open(links[type], '_blank', 'noopener,noreferrer');
        }
      });
    });

    startDashboardRefresh(uid);
  } catch (e) {
    console.error('Referral dashboard error:', e);
    const loading = $('loadingState');
    loading.innerHTML = `<span style="color:var(--accent3)">Failed to load. <button onclick="location.reload()" style="background:var(--card);border:1px solid var(--border);padding:8px 16px;border-radius:8px;color:var(--text);cursor:pointer;font-family:var(--font);margin-top:8px">Retry</button></span><br><span style="font-size:12px;color:var(--text-muted);margin-top:8px;display:inline-block">${e.message}</span>`;
  }
}

onAuthStateChanged(auth, user => {
  if (!user) {
    $('loadingState').style.display = 'none';
    $('authRequired').style.display = 'block';
    return;
  }
  ensureModulesInitialized().then(() => render(user.uid));
});

window.addEventListener('beforeunload', stopDashboardRefresh);
</script>
</body>
</html>
